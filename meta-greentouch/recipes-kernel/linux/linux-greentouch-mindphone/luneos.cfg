# The MTK connectivity stack (wmt_drv, wlan_drv_gen2, bt_drv, gps_drv) only
# exists as stock vendor modules; their source is not in the GPL drop. Our
# config delta shifts CRCs (module_layout), so they can only enter via
# modprobe --force - which the kernel refuses without this.
CONFIG_MODULE_FORCE_LOAD=y
