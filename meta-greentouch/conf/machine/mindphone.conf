#-----------------------------------------------------------------------------
#@TYPE: Machine
#@NAME: GreenTouch MindPhone (codename MindPhone)
#@DESCRIPTION: Machine configuration for the GreenTouch MindPhone
#-----------------------------------------------------------------------------

# MT6739: 64-bit-capable SoC that stock runs entirely in 32-bit mode
# (bootopt=64S3,32S1,32S1; stock kernel is an armv7 zImage, vendor blobs are
# ELF32). Kernel, userland and the Halium system image must all be 32-bit —
# same tune as the other 32-bit halium machines (hammerhead, tenderloin, and
# now halium-arm - see its machine .conf) so their sstate is reusable.
require conf/machine/include/meta-android-halium.inc

TARGET_ARCH = "arm"

# mindphone is Treble (Android 11), unlike hammerhead-halium and
# tenderloin-halium which predate Treble entirely - so it also picks up
# whatever a recipe scopes to the generic 32-bit GSI machine (see
# halium-arm.conf) the same way a machine variant picks up its base class's
# overrides (compare raspberrypi3-64.conf's "raspberrypi3:"). halium-arm
# happens to share mindphone's cortexa8 tune too (see its machine .conf for
# why), so a recipe whose content differs between the two - waydroid.bb is
# the current example - needs its own PACKAGE_ARCH:mindphone to avoid the two
# overwriting each other in the feed.
MACHINEOVERRIDES =. "halium-arm:"

PREFERRED_PROVIDER_virtual/kernel ?= "linux-greentouch-mindphone"
MACHINE_KERNEL_PR = "r3"

# Read off this device's OWN stock kernel configuration - the IKCONFIG of the
# 4.14.186 boot.img this port replaces, kept as stock-config-4.14.186.txt next
# to mindphone-notes.md - because the MindPhone has no GSMArena or Kimovil
# entry to read a spec sheet from:
#
#   nfc          "# CONFIG_NFC is not set", and MTK_NFC_CLKBUF_ENABLE is unset
#                too. There is no NFC controller on this board.
#   fingerprint  "# CONFIG_MTK_FINGERPRINT_SUPPORT is not set" with
#                CONFIG_MTK_FINGERPRINT_SELECT="NA". No sensor.
#   touchscreen  CONFIG_TOUCHSCREEN_MTK_GSLX680=y.
#   keyboard-t9  CONFIG_KEYBOARD_MTK, and on this device it drives a real T9
#                keypad - physical keys, and the primary text input. That is a
#                LuneOS-specific feature name rather than oe-core's plain
#                "keyboard", which only decides whether the kbd console tools
#                ship and says nothing about the hardware; athena.conf carries
#                the full vocabulary note. keyboard-qwerty is its sibling, for
#                the alphabetic keyboards on athena, mp01 and q25.
#
# "nfc" was in this list before and was never true of this device; it came in
# with the rest of the list from a sibling machine.
#
# No camera features because this device HAS NO CAMERA - none at all, which is
# the point of a kosher phone and is confirmed on hardware by the owner.
#
# Do not be talked out of that by the stock kernel config, which names three
# image sensors (CONFIG_CUSTOM_KERNEL_IMGSENSOR="sp5409_mipi_raw
# gc5025_mipi_raw sp2509_mipi_raw"). Those are MediaTek reference-design
# defaults for the MT6739 rather than statements about this board - the same
# trap radon.conf documents at length for NFC and fingerprint. It is also the
# straightforward explanation for what mindset-deviceinfo records: a sensor
# driver that reads 0xffffffff and a pipeline that has never delivered a frame
# is a driver probing a part that is not fitted.
MACHINE_FEATURES = "apm alsa bluetooth gps usbgadget usbhost phone wifi vfat ext2 keyboard-t9 touchscreen"

# 4.0" 480x800. These were 1080x2340 at 403 ppi, which is a 6.2" flagship
# panel and never had anything to do with this device - copied in with the
# rest of the list from a sibling machine. An MT6739 cannot drive that mode at
# all. The real panel is the one mindset-deviceinfo was written against:
#
#   sqrt(480^2 + 800^2) / 4.0 = 233 ppi, Android's hdpi bucket (240).
#
# Do NOT "fix" this to agree with deviceinfo_display_dpi="190" in
# mindset-deviceinfo. The two are different questions and are deliberately
# different numbers: 233 is what the panel physically is, which is what these
# variables mean, while 190 is chosen so the shell's GridUnit comes out at 11
# and the fixed-size chrome fits inside 480 px. That file explains the
# arithmetic.
MACHINE_DISPLAY_WIDTH_PIXELS = "480"
MACHINE_DISPLAY_HEIGHT_PIXELS = "800"
MACHINE_DISPLAY_ORIENTATION = "0"
MACHINE_DISPLAY_PPI = "233"

# This device HAS NO CAMERA, and MACHINE_FEATURES says so by omitting
# camera-rear/camera-front - which since "packagegroup: drive the hardware
# stacks from MACHINE_FEATURES" (30 Sep 2026) is enough to keep
# org.webosports.app.camera out of the image.
#
# packagegroup-webos-extended still pulls the webOS OSE camera service and
# pipeline in unconditionally; on a device with no sensor neither has anything
# to talk to. The variables are set with ?=, so emptying them here is all it
# takes.
VIRTUAL-RUNTIME_com.webos.service.camera = ""
VIRTUAL-RUNTIME_g-camera-pipeline = ""

PREFERRED_VERSION_android-headers-halium = "16.0%"

# Android 11, so the "modern" droid modules rather than the jb2q ones the
# halium include defaults to.
PREFERRED_VERSION_pulseaudio-modules-droid = "17.0.103%"
VIRTUAL-RUNTIME_android-system-image = "android-system-image-mindphone"

PREFERRED_PROVIDER_virtual/xserver = "xserver-xorg"
XSERVER = " \
    xserver-xorg \
    xf86-input-evdev \
    xf86-video-fbdev \
"

# We need fsck.vfat for vfat partitions we need to mount
# Also, include the wlan module for the kernel
# connman's wireguard VPN plugin talks the kernel's WireGuard netlink family
# directly rather than shelling out to wg-quick, so it needs a kernel-side
# WireGuard. This kernel predates 5.6, where WireGuard became an in-tree
# driver, so it comes from the wireguard-linux-compat backport that
# wireguard-module builds out-of-tree. Nothing pulls that in on its own - the
# generic Halium rootfs cannot, having no kernel at all - and this machine
# builds its own complete image, so it is named here.
#
# Name the recipe's meta package, not kernel-module-wireguard. The split
# package only gains RPROVIDES:kernel-module-wireguard inside
# split_kernel_module_packages during do_package, so that name has no
# parse-time provider from this recipe (neither module.bbclass nor
# kernel-module-split.bbclass sets PACKAGES_DYNAMIC). The only recipe claiming
# it at parse time is the kernel, via PACKAGES_DYNAMIC "^kernel-module-.*" in
# kernel.bbclass - and this 4.14 kernel has no WireGuard to build, so the ask
# resolved to a package nobody ever produced and do_rootfs died with "No
# candidates to install kernel-module-wireguard". wireguard-module is a real
# package name at parse time (module.bbclass sets KERNEL_MODULES_META_PACKAGE
# = "${PN}", and kernel-module-split makes it RDEPEND on every module the
# recipe splits out), so it resolves straight to the recipe.
MACHINE_EXTRA_RDEPENDS = " \
    android-kernel-bootimg \
    dosfstools \
    mtk-ril-watchdog \
    wireguard-module \
"

#kernel-module-wlan

# 32-bit build; the dtb rides in the v2 boot header's own section (as the
# stock dt_table blob the kernel recipe ships), so a plain zImage is right.
KERNEL_IMAGETYPE = "zImage"
# ext4 as well: no custom recovery exists for this device, so LuneOS is
# installed over fastboot as a rootfs.img inside a flashed userdata image
# rather than via the luneos-package recovery zip.
IMAGE_FSTYPES += "tar.gz ext4 userdataimg"
IMAGE_ROOTFS_EXTRA_SPACE = "200000"

# ... and build that userdata image here, rather than leaving it to be wrapped
# by hand. See classes/userdataimg.bbclass.
IMAGE_CLASSES += "userdataimg"

# A/B device, no numbered boot partition; lk exposes by-name links.
ANDROID_BOARD_BOOTIMAGE_PARTITION = "/dev/block/platform/bootdevice/by-name/boot_a"
ANDROID_BOARD_SYSTEMIMAGE_PARTITION_SIZE = "931037184"
ANDROID_BOARD_FLASH_BLOCK_SIZE = "131072"

# MTK serial (CONFIG_MTK_SERIAL in the stock config), not qcom ttyHSL
SERIAL_CONSOLE = "921600 ttyMT0"

require conf/machine/include/arm/armv7a/tune-cortexa8.inc


