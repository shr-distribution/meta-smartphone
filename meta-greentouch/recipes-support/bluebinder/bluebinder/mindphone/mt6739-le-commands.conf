# The MT6739 combo chip answers every LE command it is sent, but claims not one
# of them in Read_Local_Supported_Commands: 137 classic commands come back and
# octets 25-28, the whole LE range, are zero.
#
# That bitmap is not informational. hci_init gates the LE event mask on it, so
# BlueZ ends up sending LE Set Event Mask 0x10 - LE Long Term Key Request and
# nothing else - and the chip then dutifully emits no LE meta events at all. LE
# discovery finds nothing and LE connects time out, while classic inquiry works.
#
# Put back the four bits that gate events only (hci_core.c):
#
#   26 bit 3  LE Set Scan Enable      -> LE Advertising Report
#   26 bit 4  LE Create Connection    -> LE Connection Complete
#   27 bit 2  LE Connection Update    -> LE Connection Update Complete
#   27 bit 5  LE Read Remote Features -> LE Read Remote Used Features Complete
#
# which gives the LE event mask 0x1f that was confirmed working on the device.
#
# Deliberately not set: 25 bit 6, and 26 bits 6-7. Those gate the kernel into
# *issuing* Read LE Advertising Channel TX Power, Read LE White List Size and
# Clear LE White List, and whether this controller honours those is untested -
# unlike the four above, claiming them has consequences beyond enabling events.
BLUEBINDER_LOCAL_COMMANDS_SET=26:18,27:24
