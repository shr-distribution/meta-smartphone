#@TYPE: Machine
#@NAME: Motorola moto g06 (lagos)
#@DESCRIPTION: Machine configuration for the Motorola moto g06 (MediaTek MT6768, marketed as Helio G81/MT6769), Android 15 vendor

#-----------------------------------------------------------------------------
# Like bluejay/panther, this machine exists to build the *boot images*. The
# rootfs comes from halium-arm64 and the GSI (Halium 16.0, halium_arm64) is
# chosen at install time.
#
#   MACHINE=lagos bitbake luneos-bootimg-gki   boot-, init_boot- and
#                                              boot-...-debug.img
#
# Every fact below is read from the stock firmware
# lagos_g_user_15_VVOB35.78-188_d845b5_release-keys_CFC.1 (an SP Flash Tool /
# fastboot package; scatter MT6768_Android_scatter.txt) unless marked
# UNVERIFIED.
#
# Tier A on Google's own GKI, NOT on MediaTek's mgk derivative: the stock
# kernel is 6.6.118-android15-8-g350f378eb496-ab14943902-4k, built by kleaf on
# Google's build host, i.e. ACK android15-6.6 at 350f378eb496. So the kernel is
# linux-halium-gki_6.6.bb - the one-kernel-per-KMI route - and not a device
# tree as on q25, mp01 and brax3. The stock vendor_boot (168), vendor_dlkm
# (194) and system_dlkm (78) modules stay; see the recipe for the KMI check.
#-----------------------------------------------------------------------------

require conf/machine/include/arm/arch-arm64.inc
require conf/machine/include/meta-android-halium.inc

GKI_BOOTIMG = "1"
PREFERRED_VERSION_linux-halium-gki = "6.6%"
# The stock boot.img carries a gzip kernel (Image.gz); keep what this lk is
# known to take.
GKI_KERNEL_IMAGE_NAME = "Image.gz"

PREFERRED_PROVIDER_virtual/kernel = "linux-dummy"
HALIUM_GENERIC_ROOTFS_DEVICE = "1"
MACHINE_ESSENTIAL_EXTRA_RDEPENDS = ""
MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS = ""

# Goodix fingerprint (gf_tee.ko, vendor.goodix.hardware.biometrics.fingerprint),
# MT6631 FM receiver (fmradio_drv_mt6631.ko), dual SIM (IRadio*/slot1, slot2).
# No nfc: the vendor manifest declares no android.hardware.nfc HAL, although
# an init.vnd_lagos.nfc.rc ships - presumably for another SKU; add it once a
# unit with NFC is seen.
MACHINE_FEATURES = "alsa bluetooth gps usbgadget usbhost phone wifi vfat ext2 touchscreen fingerprint"
MACHINE_FEATURES += "fm-radio"
MACHINE_FEATURES += "camera-rear camera-front"

# 720x1640 at 120 Hz: all three panel drivers in the stock module set are
# named for it (dsi_panel_{csot_nt36528a,tm_icnl9916x,txd_ili79505}_688_720x1640_vdo_120hz),
# and "688" is the 6.88" diagonal: sqrt(720^2 + 1640^2) / 6.88 = 260 ppi.
# ro.sf.lcd_density is 280.
MACHINE_DISPLAY_WIDTH_PIXELS = "720"
MACHINE_DISPLAY_HEIGHT_PIXELS = "1640"
MACHINE_DISPLAY_ORIENTATION = "0"
MACHINE_DISPLAY_PPI = "260"

# Tracks the GSI generation, not the vendor (sargo.conf explains). The vendor is
# Android 15 (ro.vendor.build.version.sdk=35, ro.board.api_level=202404, no
# ro.vndk.version): it carries its own former-VNDK libraries, so the GSI needs
# no snapshot for it.
PREFERRED_VERSION_android-headers-halium = "16.0%"
PREFERRED_VERSION_pulseaudio-modules-droid = "17.0.103%"

VIRTUAL-RUNTIME_android-system-image = ""

IMAGE_FSTYPES += "tar.gz ext4 userdataimg"
IMAGE_ROOTFS_EXTRA_SPACE = "200000"
IMAGE_CLASSES += "userdataimg"
FASTBOOT_BOOT_PARTITIONS = "boot"

# Boot images: an Android-13-launch layout. Stock boot.img is header v4 (header
# size 1584) with the kernel alone (ramdisk size 0); init_boot.img is v4 with
# the ramdisk alone. Both stock ramdisks (init_boot and vendor_boot's) are LZ4
# legacy (02 21 4c 18), and ours has to match across the concatenation
# (mp01 landed in Android Recovery with a gzip one).
ANDROID_BOOTIMG_HEADER_VERSION = "4"
ANDROID_BOOTIMG_INIT_BOOT = "1"
GKI_RAMDISK_COMPRESSION = "lz4-legacy"

# Partitions (scatter): boot_a 64 MiB, init_boot_a 8 MiB, vendor_boot_a 64 MiB.
# init_boot is the binding constraint: brax3's ramdisk was 8,015,872 B against
# the same 8 MiB, so anything added to initramfs-android-image for this
# machine has to be weighed against it.

# Stock header os_version is 0 in both boot.img and init_boot.img (the patch
# level travels in the AVB footer as com.android.build.boot.os_version = 15),
# so the class default of 0 reproduces it.
#ANDROID_BOOTIMG_OS_VERSION = "0"

# Stock boot.img cmdline is empty; vendor_boot (stays stock) carries
# "bootopt=64S3,32N2,64N2". Everything LuneOS needs is in CONFIG_CMDLINE
# (linux-halium-gki-6.6/luneos_defconfig). The padding is q25's: the Helio G99
# lk drops the first 20 characters of the boot-image cmdline. UNVERIFIED
# whether this MT6768 lk does; if it does not, the first token is an unknown
# parameter the kernel ignores, which only loses log_buf_len.
# cgroup_disable=net_prio pre-empts the LXC/connman/ccmni deadlock measured on
# the MP01.
ANDROID_BOOTIMG_CMDLINE = "????????????????????log_buf_len=4M printk.devkmsg=on cgroup_disable=net_prio"

# 8250_mtk.ko is in the stock vendor_boot set. UNVERIFIED as a usable console;
# no debug UART is known on this device.
SERIAL_CONSOLE = "115200 ttyS0"
