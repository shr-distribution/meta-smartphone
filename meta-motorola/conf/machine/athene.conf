#-----------------------------------------------------------------------------
#@TYPE: Machine
#@NAME: Motorola G4 (codename athene)
#@DESCRIPTION: Machine configuration for the Motorola G4
#-----------------------------------------------------------------------------

require conf/machine/include/arm/armv7a/tune-cortexa8.inc
require conf/machine/include/meta-android-halium.inc

PREFERRED_PROVIDER_virtual/kernel ?= "linux-motorola-athene"
MACHINE_KERNEL_PR = "r0"

# No "nfc": neither of the two phones that share this codename has an NFC
# controller - the spec sheets list it absent on the G4 and on the G4 Plus
# alike, and the athene device tree carries no NFC HAL.
#
# No "fingerprint" either, for the plain G4 this machine is named for. athene
# is one device tree for both models and the PLUS is the one with the
# front-mounted reader, so a Plus being built here can add the feature - this
# is a Halium machine, so biomd would have a HAL to reach - but it must not be
# the default for the model in the @NAME line.
#
# No "keyboard": a slab, with side keys rather than a physical keyboard.
MACHINE_FEATURES = "apm alsa bluetooth gps usbgadget usbhost phone wifi vfat ext2 touchscreen"
MACHINE_DISPLAY_WIDTH_PIXELS = "1080"
MACHINE_DISPLAY_HEIGHT_PIXELS = "1920"
MACHINE_DISPLAY_ORIENTATION = "0"
MACHINE_DISPLAY_PPI = "401"

PREFERRED_VERSION_android-headers-halium = "7.1%"
VIRTUAL-RUNTIME_android-system-image = "android-system-image-athene"
ANDROID_HEADERS_DEFINES = "QCOM_BSP QTI_BSP QCOM_HARDWARE"

PREFERRED_PROVIDER_virtual/xserver = "xserver-xorg"
XSERVER = " \
    xserver-xorg \
    xf86-input-evdev \
    xf86-video-fbdev \
"

# We need fsck.vfat for vfat partitions we need to mount
# Also, include the wlan module for the kernel
MACHINE_EXTRA_RDEPENDS = " \
    android-kernel-bootimg \
    dosfstools \
"

KERNEL_IMAGETYPE = "zImage"
IMAGE_FSTYPES += "tar.gz"
IMAGE_ROOTFS_EXTRA_SPACE = "200000"

ANDROID_BOARD_BOOTIMAGE_PARTITION = "/dev/block/mmcblk0p28"
ANDROID_BOARD_SYSTEMIMAGE_PARTITION_SIZE = "2600255488"
ANDROID_BOARD_FLASH_BLOCK_SIZE = "131072"

SERIAL_CONSOLE = "115200 ttyHSL0"

# 13 MP on the back, 5 MP on the front (16/5 on the G4 Plus that shares this
# codename). camera-front is what makes packagegroup-luneos-extended install
# luneos-faced, and the pair is what installs the camera app.
MACHINE_FEATURES += "camera-rear camera-front"
