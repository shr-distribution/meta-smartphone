# The sdcard's partition, for example mmcblk1p1
sdcard_partition="not-set-in-machine.conf"

# The android system partition, for example mmcblk0p8
#
# Left unset: lagos has dynamic partitions (super) and the GSI is carried as
# android-rootfs.img on userdata.
system_partition="not-set-in-machine.conf"

# The type of the root filesystem image, for example ext2
rootfs_type="ext2"

# USB gadget functions for the initramfs debug shell.
#
# Not the default "rndis": lagos runs Google's own android15-6.6 GKI, which has
# CONFIG_USB_CONFIGFS_RNDIS unset. Motorola's replacement, mtk_usb_f_rndis.ko,
# registers "mtk_rndis" and lives in vendor_dlkm, which the initramfs never
# loads - so "rndis" would create no function and no gadget would enumerate.
#
# ECM (telnet on 192.168.2.15 for a Linux or macOS host) and ACM (a serial
# shell, /dev/ttyACM0 on Linux, a COM port on Windows with the inbox driver)
# are both built into the GKI. Two functions, not more: the MP01 (musb, as
# here) lost its UDC with four.
USB_FUNCTIONS="ecm acm"
