# LuneOS / Halium kernel config delta - FuriPhone FLX1s (radon, MT6877)
#
# Merged on top of arch/arm64/configs/k6877v1_64_k419_defconfig from
# furilabs/linux-furiphone-radon, branch forky (4.19.325).
#
# This file is SHORT, and that is the interesting thing about this port.
#
# Every other Halium port in this tree starts from an Android defconfig, whose
# author never intended a glibc/systemd userspace to run on it, and the
# fragment then has to add thirty or forty options: SYSVIPC, the namespace set,
# VT, the cgroup controllers, binderfs, squashfs, BT_HCIVHCI, and above all
# turn STATIC_USERMODEHELPER back off.
#
# None of that is needed here. FuriLabs ship FuriOS - Debian, systemd,
# libhybris, an LXC Android container - on this kernel, so their defconfig has
# already been through exactly this exercise. Audited symbol by symbol against
# the athena and mindphone requirement lists (see radon-notes.md, "The config
# audit"): all 64 required symbols are already correct in the stock defconfig,
# with one partial - CUSE, which is =m and therefore merely needs loading.
#
# So what remains below is only bring-up instrumentation and one =m symbol
# promoted to =y. Nothing here is a Halium requirement, because there are no
# unmet Halium requirements on this device, and nothing here changes how the
# kernel is compiled - it is built with the vendor's own Clang.
#
# NOTE: do NOT write bare "# CONFIG_FOO=y" in comments in this file.
# scripts/kconfig/merge_config.sh matches ^(# )?CONFIG_[A-Za-z0-9_][= ] and
# treats such a line as a directive, so a "documentation" comment silently
# overrides the symbol. Reference symbols without the CONFIG_ prefix below.

# ---------------------------------------------------------------------------
# 1. Toolchain: nothing to do here
# ---------------------------------------------------------------------------
# The kernel is built with Google's prebuilt Android Clang r416183b - the same
# release FuriLabs pin in debian/kernel-info.mk, and the same one sunfish, q25,
# mp01 and bramble already use in this tree. See the recipe's toolchain section
# and set GKI_CLANG_DIR:radon in local.conf.
#
# Because the compiler is the vendor's own, the stock LTO setting is KEPT:
#
#   LTO_CLANG stays =y, exactly as the defconfig has it
#
# An earlier draft of this fragment forced CONFIG_LTO_NONE to allow a GCC
# build. That was wrong for this tree - meta-smartphone does not build Android
# kernels with GCC, it ships a prebuilt Clang per machine - and it would have
# meant shipping a kernel built differently from the one the vendor validates.
# Do not reintroduce it.
#
# CC_IS_CLANG needs no handling either way: kbuild re-derives it from $(CC),
# so it is not a settable symbol.
#
# ThinLTO is deliberately NOT used here. It is worth real time on the GKI
# machines (mp01 measured 20 min -> 6 min), but this tree is 4.19 with
# MediaTek's own LTO implementation rather than upstream's, CONFIG_LTO_CLANG_THIN
# does not exist in it, and there is no KMI argument for LTO-neutrality because
# there is no KMI. Build it the way the vendor does.

# ---------------------------------------------------------------------------
# 2. The one partial requirement
# ---------------------------------------------------------------------------
# CUSE is =m in the stock defconfig. Nothing in LuneOS autoloads it and it is
# only wanted by userspace character-device emulation, but it costs nothing to
# have present and saves a puzzling failure later.
CONFIG_CUSE=y

# ---------------------------------------------------------------------------
# 3. Bring-up instrumentation - REMOVED, it was what broke the boot
# ---------------------------------------------------------------------------
# This section used to enable FRAMEBUFFER_CONSOLE (+DETECT_PRIMARY, FONT_8x16)
# and promote NETCONSOLE and NETPOLL to built-in, as debugging aids. On 23 Sep
# 2026 that turned out to be what stopped the device booting at all.
#
# How it was established, on hardware:
#
#   our kernel     + our ramdisk      -> hang at lk's splash
#   FuriLabs kernel + our ramdisk     -> hang (read as "the ramdisk is at fault")
#   our kernel     + FuriLabs ramdisk -> hang  <- the decisive one
#
# The third test is what settles it: FuriLabs' ramdisk demonstrably boots this
# phone, so with both directions hanging the only common factor is our kernel.
# Diffing our built .config against the stock defconfig then left a very short
# list, of which FRAMEBUFFER_CONSOLE and a built-in NETCONSOLE are the only
# entries that touch early boot.
#
# It also explains why the failure was invisible. The kernel dies while bringing
# up the console, so there is no console to report it on; nothing downstream
# runs, which is why there was no adb gadget even in the enable_adb image, no
# pstore record, no trace written by the initramfs harness, and bootman's
# next-boot was never consumed.
#
# fbcon on this device is a poor bet in hindsight: the panel is driven by
# the DRM_MEDIATEK driver with FBDEV emulation, and lk has already painted its
# splash through its own display path. athena (device-athena.md) records fbcon
# never taking over from the dummy console on that port either - the difference
# here is that this SoC does not survive the attempt.
#
# DO NOT re-enable these to debug a boot failure on this device. They are the
# boot failure. Use the initramfs trace harness (LUNEOS_TRACE_INITRD=1, writes
# to the unused init_boot_b partition) instead - it needs no kernel change.

# ---------------------------------------------------------------------------
# 4. Deliberately left alone
# ---------------------------------------------------------------------------
# Recorded so the next person does not "fix" them:
#
#   STATIC_USERMODEHELPER  already unset in stock. This is the option that
#                          breaks module autoload, coredumps and the firmware
#                          fallback loader on every other Android defconfig,
#                          and FuriLabs have already dealt with it.
#   SYSVIPC, USER_NS,      all already =y. On the GKI machines (bluejay, q25,
#   PID_NS, IPC_NS         mp01) these four are KMI poison and must stay off;
#                          here they are simply correct, because there is no
#                          KMI to preserve.
#   VT, BT_HCIVHCI         already =y - normally supplied by droidian.config.
#   ANDROID_BINDER_DEVICES already lists anbox-binder, anbox-hwbinder and
#                          anbox-vndbinder alongside the standard three, so
#                          Waydroid needs no binder work at all.
#   ZRAM, ZSMALLOC         already =y; FuriOS runs zram via
#                          systemd-zram-generator and LuneOS can do the same.
#   MODULE_SIG             not set, so our modules load unsigned.
#   DUMMY=y                mer-kernel-check wants it unset. Kept at stock, as
#                          on athena and mindphone, where =y caused no trouble.
#   FW_LOADER_USER_HELPER  kept at the stock value; mindphone turned it off and
#                          flagged it as a suspected wifi/firmware regression.
#   KALLSYMS_ALL=y,        kept. athena dropped both to fit a 16.7 MiB boot
#   IKHEADERS=m            window; radon's window is 272 MiB and there is
#                          nothing to save them from.
#   TOUCHSCREEN_MTK_TOUCH  a list-valued string ("GT9886 GT9896S") naming
#   CUSTOM_KERNEL_IMGSENSOR source subdirectories. mp01 had to rewrite these
#                          because it built a *different* tree than the config
#                          came from and the directories did not exist. We
#                          build the vendor's own tree, so they resolve - but
#                          if either is ever edited, the directory has to exist
#                          or the build dies with "No rule to make target".
