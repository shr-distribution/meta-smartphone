# Let adbd start in the early window where luneos-usb-setup.sh is waiting for it.
#
# radon-usb-debug.service runs DefaultDependencies=no / Before=basic.target, and
# starts this unit with `systemctl --no-block start`, then polls up to 10s for
# /dev/usb-ffs/adb/ep1. But android-tools-adbd is WantedBy=basic.target with the
# default dependencies, which gives it an implicit After=basic.target - and
# basic.target is waiting for radon-usb-debug. So the queued start cannot run
# until the very unit waiting for it has exited: the poll always times out, the
# script stops the still-queued adbd, tears the gadget down and rebuilds it
# rndis-only. Every boot. What that looks like in the journal is a start and a
# stop ten seconds apart with no "Starting Android Debug Bridge" between them,
# and adbd reporting ConditionTimestampMonotonic=0 - never even evaluated.
#
# Dropping the default dependencies removes that implicit ordering, so the
# --no-block start runs immediately and adbd claims the endpoints while the
# script is still polling. local-fs.target is kept because adbd needs the rootfs,
# and the shutdown handling that DefaultDependencies would have supplied is
# restored explicitly.
#
# Deliberately NOT fixed by making the start blocking or by lengthening the
# timeout: the script's own comment records that a blocking `systemctl start`
# deadlocks until TimeoutStartSec and leaves the device with no gadget at all.
[Unit]
DefaultDependencies=no
After=local-fs.target
Conflicts=shutdown.target
Before=shutdown.target
