# bootman configuration for the LuneOS initramfs on radon.
#
# Differs from FuriLabs' own (debian/bootman.furios.conf) in two ways:
#
#   backend=drm   FuriOS uses minui, which is Android's recovery UI library and
#                 is not available in OE. DRM is the right choice here anyway:
#                 the panel driver is built into the kernel, so /dev/dri/card0
#                 exists in the initramfs before any vendor userspace runs.
#
#   timeout=60    Shorter than FuriOS's 300. This menu only appears when there
#                 is a choice to make; a phone that reboots unattended should
#                 not sit on it for five minutes.
[general]
animations=true
backend=drm
timeout=60

[keyboard]
autohide=true
layout=us
popovers=true

[textarea]
obscured=true

[theme]
default=breezy-dark
alternate=breezy-light
