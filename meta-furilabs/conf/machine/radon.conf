#-----------------------------------------------------------------------------
#@TYPE: Machine
#@NAME: FuriPhone FLX1s (codename radon)
#@DESCRIPTION: Machine configuration for FuriLabs' FLX1s, MediaTek Dimensity
#              900 (MT6877), 6.7" 720x1600 90 Hz, Linux 4.19.325
#
# This is a Tier B port in the sense kernel-porting.md uses the word - a legacy
# (pre-GKI) 4.19 kernel built whole from source, not a GKI image paired with
# stock vendor modules - but it is a Tier B port with none of the usual Tier B
# pain, for one reason:
#
#   FuriLabs already ship a glibc/systemd Linux distribution (FuriOS) on this
#   exact kernel, using the same libhybris + LXC Android container stack LuneOS
#   uses, and they publish the kernel tree, the adaptation package and the
#   vendor image publicly under their own name.
#
# The practical consequence is in luneos.cfg: every single option the LuneOS
# stack needs - SYSVIPC, the full namespace set, VT, BT_HCIVHCI, binderfs,
# overlayfs, squashfs, the cgroup controllers, no STATIC_USERMODEHELPER - is
# ALREADY SET in FuriLabs' own defconfig. Audited symbol by symbol against the
# athena/mindphone requirement list; see radon-notes.md "The config audit".
# Nothing else in this tree has started from that position.
#
# Read meta-blackberry/conf/machine/athena.conf alongside this for the legacy
# boot-image side, and meta-minimal/conf/machine/mp01.conf for the
# dynamic-partition/GSI side - radon is a hybrid of the two: an old-style
# header v2 boot image on a modern A/B + dynamic-super partition layout.
#-----------------------------------------------------------------------------

require conf/machine/include/arm/arch-arm64.inc
require conf/machine/include/meta-android-halium.inc

PREFERRED_PROVIDER_virtual/kernel ?= "linux-furilabs-radon"
MACHINE_KERNEL_PR = "r0"

# The kernel is built with Google's prebuilt Android Clang r416183b - the
# release FuriLabs themselves pin, and the same one sunfish, q25, mp01 and
# bramble use. It is not fetched by the recipe; point local.conf at the copy
# already on disk:
#
#   GKI_CLANG_DIR:radon = "/home/herrie/Documents/GitHub/luneos-gki-toolchain-android12-5.10/prebuilts-master/clang/host/linux-x86/clang-r416183b"
#
# Without it do_check_toolchain fails the build early with that message.

# No physical keyboard (slab phone; the "keys" in the spec sheet are the
# side-mounted power/volume/assistant switches, which are ordinary key
# devices).
#
# NO NFC, NO FINGERPRINT, NO eSIM on this device - confirmed on hardware and by
# the owner, so none of those stacks are installed.
#
# An earlier version of this comment asserted the opposite ("the HARDWARE HAS
# BOTH"), on the strength of CONFIG_MTK_FINGERPRINT_SELECT="GF318M", a
# goodix-fp node in mt6877.dtb, and CONFIG_NFC=m. Those are MediaTek
# reference-design defaults, not statements about this board. What the hardware
# actually says, read from FuriLabs' own FuriOS on this phone:
#
#   /vendor/bin/hw            26 HAL services, NONE matching nfc/finger/biometric
#   find /vendor -iname *nfc* nothing; same for *finger*, *goodix*, *biometric*
#   device tree               no nfc node at all (fingerprint/goodix_fp exist)
#   /dev                      no NFC or fingerprint chardev
#   FuriOS init log           "Could not find android.hardware.biometrics
#                              .fingerprint@2.1::IBiometricsFingerprint/default"
#   the "goodix" driver noise in dmesg is GT9886 - the TOUCHSCREEN, not a sensor
#
# So FuriLabs' 90_furios-device.gschema.override, which sets fingerprint=false
# and nfc=false, was reporting the hardware accurately after all.
#
# packagegroup-luneos-extended gates nfcd/biomd/lpac on the MACHINE_FEATURES
# "nfc", "fingerprint" and "esim" respectively, so simply not listing them here
# is what keeps them out of the image.
#
# No "apm": MediaTek PMIC with the Android power HAL behind it, as on mp01.
MACHINE_FEATURES = "alsa bluetooth gps usbgadget usbhost phone wifi vfat ext2 touchscreen"

# Three hardware privacy switches on the left edge: camera, cellular and
# microphone. "killswitch" pulls in org.webosports.service.killswitch, which
# reads them and reports them on the bus for the shell's status bar indicator,
# its on-screen alert and the camera app's notice. The switches themselves and
# how to read each one are described in killswitchd.conf.radon in that service's
# repo; the camera one also needs an action, because nothing in the vendor image
# acts on persist.vendor.camera.disabled.
MACHINE_FEATURES += "killswitch"

# 6.7" 1600x720 HD+ 90 Hz, from FuriLabs' own published specification, and
# corroborated by the kernel's own build-time panel geometry:
#   CONFIG_LCM_WIDTH="720"  CONFIG_LCM_HEIGHT="1600"
#   CONFIG_DRM_PANEL_TRULY_FT8756_VDO=y   (a DSI video-mode panel, built in)
#
# sqrt(720^2 + 1600^2) / 6.7 = 261.9 ppi.
#
# Orientation 0 and NOT rotated: CONFIG_MTK_LCM_PHYSICAL_ROTATION="0", and
# FuriLabs' phoc.ini drives DSI-1 upright at scale 2. This is the opposite of
# mp01, where the panel is mounted a quarter turn off - do not copy mp01's
# rotation handling here.
MACHINE_DISPLAY_WIDTH_PIXELS = "720"
MACHINE_DISPLAY_HEIGHT_PIXELS = "1600"
MACHINE_DISPLAY_ORIENTATION = "0"
MACHINE_DISPLAY_PPI = "262"

# Tracks the GSI generation pinned in android-system-image-radon.bb, not the
# vendor: libhybris gates its per-generation support on ANDROID_VERSION_MAJOR,
# which comes from this package, so the two have to move together.
PREFERRED_VERSION_android-headers-halium = "16.0%"

# Treble-era GSI, so the modern droid modules rather than the jb2q ones the
# halium include defaults to.
PREFERRED_VERSION_pulseaudio-modules-droid = "17.0.103%"
VIRTUAL-RUNTIME_android-system-image = "android-system-image-radon"

# Deliberately no XSERVER. The stack here is hwcomposer-based (MediaTek
# hwcomposer behind the Android container), which xf86-video-fbdev does not
# serve - same reasoning as mp01.

# The dual-boot route: LVM plus FuriLabs' own boot manager, in the initramfs.
#
# radon can be installed two ways. The standalone kit writes a rootfs image over
# the whole userdata partition and destroys FuriOS. The dual-boot route puts
# LuneOS in an LVM logical volume inside userdata alongside FuriOS, switched by
# FuriLabs' boot manager - which is how Sailfish installs on this phone.
# S01-lvm-bootman.sh (in initramfs-scripts-halium) is the LuneOS side of that
# contract and needs both of these.
#
# lvm2 is the stock recipe, not a static build. An earlier version of this file
# asked for a hand-rolled lvm2-static, on the reasoning that an initramfs has no
# story for shared libraries - which is true of a hand-assembled busybox
# initramfs and NOT true here: initramfs-android-image is an ordinary OE image,
# so IMAGE_INSTALL pulls each package's libraries in with it. The static build
# also broke lvm2 for every other machine in the tree, because
# --enable-static_link links dmeventd statically too and there is no static
# libudev to link it against.
#
# bootman runs in the initramfs rather than in a booted system, so whichever OS
# is flashed provides the menu for the whole device. Without it here, installing
# LuneOS would make the phone single-boot again and getting back to FuriOS would
# need a host and a USB cable.
#
# Both are shipped unconditionally because one initramfs serves both install
# routes: the premount script falls back to the rootfs.img layout when there is
# no volume group, so the standalone install is unaffected. Cost is a few MB
# against a 40 MiB boot partition holding a 24.7 MB image.
# bootman is DELIBERATELY NOT INSTALLED for now.
#
# It was, and the result was a device that showed lk's splash and then went
# mute - no console, no USB gadget, no pstore log - on 23 Sep 2026. bootman is
# an LVGL application that takes the display and waits for input from inside
# the initramfs, and ours was built with the DRM backend because minui (which
# FuriLabs use) is Android's recovery UI library and is not available in OE.
# Whether DRM works there was never verified, and it is the most likely reason
# the initramfs went dark.
#
# Getting LuneOS to boot at all comes first. The consequence while it is out:
# switching FuriOS -> LuneOS still works (FuriOS's own initramfs provides the
# menu and flashes our boot image), but once LuneOS is running there is no menu
# to switch back with, so returning to FuriOS needs mtkclient. That is an
# acceptable trade for a bring-up image and NOT acceptable for a shipped one -
# put bootman back, with a backend proven on this hardware, before calling the
# dual-boot route finished.
ANDROID_EXTRA_INITRAMFS_IMAGE_INSTALL = "lvm2"

# The container mounts MediaTek's vfat firmware/nvram partitions out of its
# fstab, so fsck.vfat has to exist in the rootfs.
MACHINE_EXTRA_RDEPENDS = " \
    android-kernel-bootimg \
    dosfstools \
    radon-usb-debug \
"

# FuriLabs build Image.gz (debian/kernel-info.mk: KERNEL_BUILD_TARGET =
# Image.gz) and pass the device tree to mkbootimg as the header's own dtb
# section rather than appending it to the kernel - KERNEL_IMAGE_WITH_DTB = 1
# with KERNEL_IMAGE_DTB = arch/arm64/boot/dts/mediatek/mt6877.dtb, on a
# header v2 image, whose header has a dtb address and size field for exactly
# that. So no Image.gz-dtb here, unlike athena.
KERNEL_IMAGETYPE = "Image.gz"
IMAGE_FSTYPES += "tar.gz"
IMAGE_ROOTFS_EXTRA_SPACE = "200000"

# A/B slots AND dynamic partitions (super), which is the modern layout - but
# with a legacy header v2 boot image, which is not. Both halves are verified
# from FuriLabs' own adaptation package:
#
#   A/B      usr/libexec/radon-bootslot reads androidboot.slot_suffix from
#            /proc/cmdline and symlinks by-partlabel/boot_a|boot_b to "boot".
#   dynamic  radon-vendor-32's flash-vendorimage writes to
#            /dev/mapper/dynpart-vendor_a|_b, i.e. dm devices carved out of
#            super by parse-android-dynparts.
#   UFS      usr/lib/furios/device/bootman-ignore-partition lists
#            /dev/sda:/dev/sdb:/dev/sdc - three LUNs, so UFS, not eMMC.
#
# by-partlabel rather than by-name: this is MediaTek, and the MTK devices in
# this tree (mp01, q25, mindphone) only get by-partlabel symlinks.
#
# This is the ON-DEVICE path, for a running system writing its own boot image.
# It is NOT how the port gets installed in the first place: the FLX1s is
# flashed with MediaTek's SP Flash Tool (or mtkclient on Linux), not fastboot.
# See radon-notes.md, "Installing: SP Flash Tool, not fastboot" - and in
# particular do not write preloader or super.
ANDROID_BOARD_BOOTIMAGE_PARTITION = "/dev/disk/by-partlabel/boot_a"

# MediaTek on 4.19 registers the 8250 console as ttyS0.
# UNVERIFIED as a usable console: a retail FLX1s exposes no debug UART, and
# the kernel's built-in CONFIG_CMDLINE already carries console=tty0.
SERIAL_CONSOLE = "115200 ttyS0"

# Camera topology. The FLX1s has both a rear and a user-facing camera, and the
# camera app is confirmed working on this device. camera-front is what makes
# packagegroup-luneos-extended install luneos-faced; a rear-only device would
# declare only camera-rear and correctly get no face unlock.
MACHINE_FEATURES += "camera-rear camera-front"
