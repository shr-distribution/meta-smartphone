# The sdcard's partition, for example mmcblk1p1
sdcard_partition="not-set-in-machine.conf"

# The android system partition, for example mmcblk0p8
#
# Left unset deliberately. This device has dynamic partitions: there is no
# fixed system partition node, it is a dm device carved out of super, and the
# GSI is carried as android-rootfs.img inside our own rootfs instead
# (see android-system-image-radon.bb).
system_partition="not-set-in-machine.conf"

# The type of the root filesystem image, for example ext2
rootfs_type="ext2"

# The display backlight, so the panel is lit before the compositor starts and
# the device does not look dead through the whole of boot.
#
# The node name is taken from FuriLabs' own adaptation, which drives exactly
# this path in usr/libexec/radon-brightness:
#   /sys/class/leds/lcd-backlight/brightness
# Their script's own default is max_brightness / 2, which is the value used
# here in spirit - but max_brightness is not readable from a static config, so
# a mid-scale absolute is used instead.
#
# UNVERIFIED: if the panel's max_brightness turns out to be small (some
# MediaTek backlights scale 0-255, others 0-80 as on mp01), 128 will simply
# clamp to full. Adjust once the real range is known.
boot_backlight_node="/sys/class/leds/lcd-backlight/brightness"
boot_backlight_level="128"
