# LuneOS delta for the Zinwa Q25's own kernel (MediaTek mgk 5.10.198).
#
# Merged on top of the device's four-fragment config chain
# (gki_defconfig + mgk.config + entry_level.config + q20_v12_factory.config),
# which is the baseline the stock vendor modules' CRCs were computed against.
# Everything here is therefore a *deviation from that baseline*, and every
# deviation is a chance to break the KMI. Build with
# LUNEOS_KERNEL_FRAGMENT = "0" first to prove the baseline reproduces, then add
# this and measure again with check-kmi.sh.
#
# Sections are ordered by how likely they are to move a CRC, most dangerous
# last, so bisecting means deleting from the bottom.
#
# The source list is mer_verify_kernel_config against the stock IKCONFIG
# (firmware/mer-check-stock-q25.txt: 23 errors, 54 warnings) plus what the
# Halium stack needs on top.

# ---------------------------------------------------------------------------
# 1. Behavioural only - no struct touched, no CRC can move
# ---------------------------------------------------------------------------

# systemd/udev hard requirements. Stock has none of these.
CONFIG_DEVTMPFS=y
CONFIG_DEVTMPFS_MOUNT=y
CONFIG_FHANDLE=y
CONFIG_TMPFS_XATTR=y
CONFIG_TMPFS_POSIX_ACL=y
CONFIG_AUTOFS_FS=y
CONFIG_QUOTA_NETLINK_INTERFACE=y

# Virtual terminal. Also the console the stock cmdline asks for (console=tty0),
# and this device has no usable debug UART, so it is the only console there is.
CONFIG_VT=y
CONFIG_VT_CONSOLE=y

# request_module() autoloading. Stock sets STATIC_USERMODEHELPER=y with an
# empty path, which disables the usermode helper outright.
# CONFIG_STATIC_USERMODEHELPER is not set

# Hotplug events to the initramfs's mdev. Stock GKI has no uevent_helper, and
# without it late hotplug events are lost and /dev/disk/by-partlabel can come
# up empty. mer wants the path to default empty.
CONFIG_UEVENT_HELPER=y
CONFIG_UEVENT_HELPER_PATH=""

# bluebinder feeds the Android BT HAL into a virtual HCI, so vhci is its kernel
# prerequisite; the rest is the bluez profile set. Stock has none of them.
CONFIG_BT_HCIVHCI=y
CONFIG_BT_RFCOMM=y
CONFIG_BT_RFCOMM_TTY=y
CONFIG_BT_HIDP=y
CONFIG_BT_BNEP=y
CONFIG_BT_BNEP_MC_FILTER=y
CONFIG_BT_BNEP_PROTO_FILTER=y

# Waydroid wants its own binder trio however the nodes are created, plus veth
# and the checksum target for its networking. LuneOS mounts binderfs on the
# host and binds it into the container, which is orthogonal to this list.
CONFIG_ANDROID_BINDER_DEVICES="binder,hwbinder,vndbinder,anbox-binder,anbox-hwbinder,anbox-vndbinder"
CONFIG_VETH=y
CONFIG_NETFILTER_XT_TARGET_CHECKSUM=y

# ---------------------------------------------------------------------------
# 2. Netfilter / ofono / VPN. These add modules and match extensions rather
#    than members of core structs, but a few netfilter options do reach into
#    struct net - so they come before the namespace block, not with section 1.
# ---------------------------------------------------------------------------
CONFIG_INET_AH=y
CONFIG_INET_IPCOMP=y
CONFIG_INET6_AH=y
CONFIG_INET6_IPCOMP=y
CONFIG_NF_LOG_IPV4=y
CONFIG_NF_LOG_IPV6=y
CONFIG_IP_NF_MATCH_AH=y
CONFIG_IP_NF_MATCH_RPFILTER=y
CONFIG_IP6_NF_MATCH_RPFILTER=y
CONFIG_NETFILTER_XT_MATCH_RECENT=y
CONFIG_NETFILTER_XT_MATCH_SCTP=y

# PPP stack (ofono dialup / DUN)
CONFIG_PPP=y
CONFIG_PPP_ASYNC=y
CONFIG_PPP_SYNC_TTY=y
CONFIG_PPP_FILTER=y
CONFIG_PPP_MULTILINK=y
CONFIG_PPP_DEFLATE=y
CONFIG_PPP_BSDCOMP=y
CONFIG_PPPOE=y

# L2TP (VPN)
CONFIG_L2TP=y
CONFIG_L2TP_V3=y
CONFIG_L2TP_IP=y

# NET_L3_MASTER_DEV stays off deliberately: it adds l3mdev_ops to struct
# net_device, which every vendor wifi module touches. ofono does not need VRF.
# Same for FANOTIFY, NF_TABLES, HUGETLBFS, POSIX_MQUEUE and CGROUP_PIDS, all of
# which the Droidian port marks ABI-breaking on MT6789.

# ---------------------------------------------------------------------------
# 3. Namespaces - and the KMI-poison list, MEASURED on this device
#
# Result of the bisect, 13 Sep 2026, against all 344 stock vendor modules
# (180 from the vendor_boot ramdisk + 184 from vendor_dlkm):
#
#   baseline (device config, no fragment)          344 checked, 0 would fail
#   + this whole fragment incl. SYSVIPC/USER_NS    344 checked, 344 would fail
#   + this fragment as it now stands               344 checked, 0 would fail
#
# So the KMI-poison list for MediaTek mgk android12-5.10 on MT6789 is
#
#     CONFIG_SYSVIPC (with SYSVIPC_SYSCTL and IPC_NS), and CONFIG_USER_NS
#
# and everything else below and above is KMI-clean - PID_NS and
# CHECKPOINT_RESTORE included, which is the same answer bluejay's bisect gave on
# android14-6.1. The two were held out as a group and not separated from each
# other; neither is needed, so the extra 15-minute build was not spent.
#
# Userland consequences, and they are real:
#   - No SysV IPC. Watch Qt's QSharedMemory / QSystemSemaphore, which fall back
#     to POSIX only on some platforms. POSIX shm and semaphores are unaffected.
#   - LXC must not unshare the IPC or user namespaces. PID_NS is available.
#
# The escape hatch, if SysV IPC ever turns out to be load-bearing: the Halium
# fork of ACK android12-5.10 carries "GKI: use Android ABI padding for SYSVIPC
# task_struct fields", which puts the new task_struct members in the reserved
# KABI padding so the CRCs do not move. Cherry-picking it onto this tree is
# untried but is the known shape of the fix. Re-run check-kmi.sh if you do.
CONFIG_PID_NS=y
CONFIG_CHECKPOINT_RESTORE=y
# CONFIG_USER_NS is not set
# CONFIG_SYSVIPC is not set

# ---------------------------------------------------------------------------
# 4. Command line
#
# Kept from the stock value: the GKI boot-time quieting flags. Added: selinux=0,
# console=tty0 (the only console this device has, and a boot-hang fix), and the
# cgroup v1 pair - the Android container needs the legacy hierarchy, systemd
# reads both off /proc/cmdline with proc_cmdline_get_bool(), and there is no
# other route to get them there: the boot image's own cmdline is at the mercy of
# a bootloader that eats its first 20 characters.
#
# CONFIG_CMDLINE_EXTEND is already set by gki_defconfig, so whatever the
# bootloader does supply is appended to this rather than replacing it.
# ---------------------------------------------------------------------------
CONFIG_CMDLINE="stack_depot_disable=on kasan.stacktrace=off kvm-arm.mode=protected cgroup_disable=pressure cgroup.memory=nokmem selinux=0 console=tty0 systemd.unified_cgroup_hierarchy=0 SYSTEMD_CGROUP_ENABLE_LEGACY_FORCE=1"
CONFIG_CMDLINE_EXTEND=y
