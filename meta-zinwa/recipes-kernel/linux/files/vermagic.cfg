# Make our kernel's vermagic string match the stock modules' exactly.
#
# THIS IS WHAT DECIDES WHETHER THE DEVICE BOOTS AT ALL, and the Q25 port
# shipped without it for a fortnight. The reasoning that missed it is worth
# stating, because it was nearly right:
#
#   check-kmi.sh reported 344 of 344 stock modules load, 0 CRC mismatches, so
#   the KMI is preserved - and mtk-load-modules.sh escalates through
#   modprobe -> --force-vermagic -> --force, which covers a vermagic string
#   that differs. Both true. Both irrelevant to the modules that matter.
#
# The modules that matter are loaded by the INITRAMFS, not by that script. On
# this device the storage and USB controllers are themselves vendor modules -
# ufs-mediatek-mod.ko, phy-mtk-ufs.ko, mtk-mmc.ko, musb_hdrc.ko, all in the
# stock vendor_boot ramdisk's /lib/modules - so init.sh has to insmod them
# before it can find userdata at all. The initramfs carries only **busybox**
# insmod/modprobe, which has no --force-vermagic, and CONFIG_MODULE_FORCE_LOAD
# is not set in the stock config either. So the vermagic has to genuinely match
# or nothing loads, there is no userdata, and the phone is mute: no console (no
# debug UART), no adb (the USB controller is one of the modules that did not
# load).
#
# Stock modules carry:
#   5.10.198-android12-9-gfcab0aff02db SMP preempt mod_unload modversions aarch64
#
# and ours carried:
#   5.10.198-g2a873a3511ee             SMP preempt mod_unload modversions aarch64
#
# Everything after the release string already matches - same SMP, PREEMPT,
# MODULE_UNLOAD and MODVERSIONS, because we build the device's own config - and
# the sublevel needs no rewriting either: the xelex tree is genuinely 5.10.198,
# exactly what the stock kernel reports. Only the suffix differs, and that is
# what the two lines below fix. See also the empty .scmversion the recipe
# writes, without which kbuild appends a "+" and the match misses by one
# character.
#
# The alternative was CONFIG_MODULE_FORCE_LOAD=y plus kmod in the initramfs so
# insmod --force-vermagic could be used. Rejected for the same reason the MP01
# rejected it: two changes instead of one, and force-loading permanently
# disables the check, so a *real* future mismatch would stop being caught.
#
# Note this is a different remedy from "build the vendor's modules yourself"
# (kmi-crc-matching.md step -1), which is the better answer on most devices and
# the wrong one here: the Q25's CRCs already match, so matching buys nothing,
# and embedding modules in the boot image is actively dangerous on MT6789 -
# the MP01 measured lk silently refusing to load a boot image that grew from
# 28 MB to 31.6 MB. Ours is 27 MB. Leave it there.
CONFIG_LOCALVERSION="-android12-9-gfcab0aff02db"
# CONFIG_LOCALVERSION_AUTO is not set
