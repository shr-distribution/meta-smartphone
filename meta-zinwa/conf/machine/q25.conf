#-----------------------------------------------------------------------------
#@TYPE: Machine
#@NAME: Zinwa Q25 (BlackBerry Classic restomod)
#@DESCRIPTION: Machine configuration for the Zinwa Q25 / Q25 Pro, MediaTek
#              Helio G99 (MT6789)
#
# Same shape as bluejay.conf and panther.conf: this machine exists to build the
# *boot image*. The rootfs comes from halium-arm64 and the GSI is chosen at
# install time. Two things come out of here:
#
#   MACHINE=q25 bitbake initramfs-android-image   the Halium initramfs
#   MACHINE=q25 bitbake luneos-bootimg-gki        boot-q25-luneos.img
#                                                 (+ the -debug variant)
#
# Tier A in the sense that matters - the device keeps its own stock vendor
# modules and we replace only the kernel - but NOT "one kernel per KMI". The
# kernel is built from the Q25's own source (recipes-kernel/linux in this
# layer), because MediaTek's MT6789 kernel is their "mgk" GKI derivative rather
# than pristine ACK and the stock modules' CRCs follow it. The recipe's
# DESCRIPTION carries the measurement that settled this.
#
# It is not, and cannot be, built with OE's cross toolchain: that would move the
# exported symbol CRCs under CONFIG_MODVERSIONS and the phone's own stock vendor
# modules would stop loading. It uses the Clang the KMI was frozen with
# (r416183b), which is also what the stock kernel's version string names.
#-----------------------------------------------------------------------------

require conf/machine/include/arm/arch-arm64.inc
require conf/machine/include/meta-android-halium.inc

# No kernel in the rootfs sense - the GKI kernel is built by
# linux-halium-gki and consumed directly by luneos-bootimg-gki - but
# virtual/kernel still has to resolve.
PREFERRED_PROVIDER_virtual/kernel = "linux-dummy"
MACHINE_ESSENTIAL_EXTRA_RDEPENDS = ""
MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS = ""

# This machine builds GKI boot images; see meta-android's
# recipes-bsp/gki-bootimg/luneos-bootimg-gki_1.0.bb, which is gated on this
# rather than on a list of device names.
GKI_BOOTIMG = "1"

# The kernel comes from the device's own tree, not from ACK. gki_bootimg.bbclass
# takes whichever provider is named here and packs its deployed Image.
#
# This is the Q25's one real departure from the bluejay/panther pattern, and it
# was measured rather than chosen: an ACK android12-5.10 build (which this tree
# can still do - see linux-halium-gki_5.10.bb) scored 344 of 344 stock vendor
# modules failing to load, module_layout included. MediaTek does not ship pure
# GKI on MT6789; the stock kernel is their "mgk" flavour, gki_defconfig merged
# with mgk_64_k510_defconfig and two more fragments on a tree carrying
# drivers/misc/mediatek out of tree, and the stock modules' CRCs follow that.
# The KMI discipline is unchanged - stock vendor_boot and vendor_dlkm stay, we
# replace only the kernel - but the baseline to reproduce is MediaTek's.
GKI_KERNEL_PROVIDER = "linux-zinwa-q25"

# GKI 5.10 arm64 builds Image, Image.gz and Image.lz4. MediaTek lk takes the
# gzip one: BOARD_KERNEL_IMAGE_NAME := Image.gz in the device's LineageOS
# BoardConfig.mk, and UBports' make-bootimage.sh picks Image.gz for the
# Droidian port's deviceinfo too.
GKI_KERNEL_IMAGE_NAME = "Image.gz"

# "keyboard-qwerty", not oe-core's plain "keyboard". The two say different
# things and only one of them is about this device: oe-core reads "keyboard"
# as "ship the console keymap tooling", and all it actually does under a
# systemd distro is drag kbd into the rootfs through the (otherwise empty)
# keymaps package - no use to a Wayland shell. The LuneOS names say what the
# hardware IS, the way camera-rear/camera-front do:
#
#   keyboard-qwerty  full physical alphabetic keyboard (athena, mp01, q25)
#   keyboard-t9      physical numeric/T9 keypad (mindphone)
#
# Nothing consumes them yet; they are the gate for anything that should behave
# differently with hardware keys, starting with whether the shell puts a
# virtual keyboard on screen.
#
# Physical QWERTY plus a capacitive trackpad. The Classic's 3.5" panel is
# capacitive as well, so "touchscreen" is true too - trackpad and panel are
# both pointers here. No
# "apm": this is a MediaTek PMIC with the Android power HAL behind it, same as
# the Tensor machines.
#
# NFC is on Zinwa's own spec sheet for the Q25 and Q25 Pro, and so is the
# side-mounted fingerprint reader in the power key. No "esim": the tray is one
# physical SIM plus microSD, with no eUICC behind it.
# "trackpad" is the Classic's capacitive pad below the keys, as a device of its
# own rather than as part of the keyboard - which is what installs kbdscroll
# (see KEYBOARD_RDEPENDS in packagegroup-luneos-extended): a slide over it
# scrolls the screen and, with Alt held, moves the text cursor. UNVERIFIED on
# hardware: kbdscroll reads an absolute surface, and if this pad turns out to
# report REL_X/REL_Y it is a pointer to the compositor already and this feature
# should come back out. "kbdscroll --list" on the device settles it.
MACHINE_FEATURES = "alsa bluetooth gps usbgadget usbhost phone wifi vfat ext2 keyboard-qwerty trackpad touchscreen nfc fingerprint"

# 3.5" 720x720 IPS, 1:1. sqrt(720^2 + 720^2) / 3.5 = 291 ppi.
#
# The square panel is the unusual part and it is worth stating plainly: webOS
# app pages and the shell are laid out for a tall portrait canvas. The grid unit
# and device pixel ratio that make that fit are in the Tier 1 deviceinfo
# (recipes-core/luneos-device-config), which is where a value that is tuned by
# eye on hardware belongs - these three are the panel's own numbers.
MACHINE_DISPLAY_WIDTH_PIXELS = "720"
MACHINE_DISPLAY_HEIGHT_PIXELS = "720"
MACHINE_DISPLAY_ORIENTATION = "0"
MACHINE_DISPLAY_PPI = "291"

# Tracks the GSI generation, not the vendor: libhybris gates its
# per-generation support on ANDROID_VERSION_MAJOR, which comes from this
# package. Same reasoning as sargo.conf, which spells it out at length.
#
# VERIFIED from the stock firmware's own vendor.prop
# (OS-new-camera-0120-Q25-GMS.zip, q20_v12_factory/vendor.prop):
#   ro.vndk.version=31, ro.board.first_api_level=31,
#   ro.vendor.build.version.sdk=31, build id SP1A.210812.016
# i.e. an Android 12 vendor. Do not be fooled by the Android 14 build
# fingerprint the system/product/odm partitions carry - that is a spoof for
# attestation; every real platform property on this ROM says 12.
#
# The generic halium_arm64 16.0 GSI carries com.android.vndk.v31 (checked in
# halium-luneos-16.0-20260910-1-halium_arm64.tar.bz2, alongside v30/v32/v33/v34),
# so this device needs no VNDK snapshot work of the kind mindphone needed - the
# same tarball sargo runs serves the Q25.
PREFERRED_VERSION_android-headers-halium = "16.0%"

# Treble-era GSI, so the modern droid modules rather than the jb2q ones the
# halium include defaults to.
PREFERRED_VERSION_pulseaudio-modules-droid = "17.0.103%"

# No GSI baked in, as on halium-arm64: rootfs.img and android-rootfs.img sit
# side by side in the Droidian-style Linux partition and the GSI is picked at
# install time from the device's vendor API level.
VIRTUAL-RUNTIME_android-system-image = ""

# Deliberately no XSERVER: this machine builds no rootfs, and the stack here is
# hwcomposer-based, which xf86-video-fbdev does not serve.

IMAGE_FSTYPES += "tar.gz"
IMAGE_ROOTFS_EXTRA_SPACE = "200000"

# Boot image: header v4, and no init_boot - so the ramdisk rides in boot next
# to the kernel, as on bluejay. Confirmed against the device's own LineageOS
# BoardConfig.mk (device/xelex/Q25): BOARD_BOOT_HEADER_VERSION := 4,
# BOARD_USES_GENERIC_KERNEL_IMAGE := true, and AB_OTA_PARTITIONS lists boot,
# vendor_boot, dtbo and no init_boot. BOARD_INCLUDE_DTB_IN_BOOTIMG is set but
# on a GKI device that puts the dtb in vendor_boot, which stays stock - a v4
# boot header has no dtb section at all.
#
# Confirmed again against the stock boot.img itself: header v4, kernel
# 20,174,525 B, ramdisk 1,189,717 B - a *non-zero* ramdisk, which is what says
# the generic ramdisk rides in boot. init_boot_a/init_boot_b do exist in the
# MT6789 scatter (8 MiB each) but the stock firmware ships no init_boot.img and
# LineageOS's fastboot-info.txt does not flash one: the partitions are there and
# unused. Do not set ANDROID_BOOTIMG_INIT_BOOT from the partition table.
#
# boot is 64 MiB and A/B (boot_a at 0x2aa00000, boot_b at 0x4ca00000), so there
# is room and a spare slot; see the port notes for the install flow.
ANDROID_BOOTIMG_HEADER_VERSION = "4"
ANDROID_BOOTIMG_INIT_BOOT = "0"

# (os_version << 11) | os_patch_level, packed as the v3/v4 header wants it:
# 12.0.0 and 2024-03. Not a guess - unpack_bootimg on the stock boot.img
# reports exactly "os version: 12.0.0 / os patch level: 2024-03", so this
# reproduces the stock header field for field. bluejay and panther leave it 0
# because a Pixel bootloader does not read it; a MediaTek lk with AVB enabled
# might. Never lower it below what is already flashed.
ANDROID_BOOTIMG_OS_VERSION = "0x18000183"

# The twenty question marks are not decoration. MediaTek's Helio G99 lk drops
# the first 20 characters of the boot image command line before handing it to
# the kernel (established by the Droidian port, deviceinfo-android12-5.10), so
# anything real has to start at offset 20. That the stock BOARD_KERNEL_CMDLINE
# is "bootopt=64S3,32N2,64N2" - a token lk parses and consumes itself - is
# probably the mechanism; either way the padding is what the working port uses
# and this is not the place to experiment. Note the *stock* boot.img cmdline is
# empty (verified with unpack_bootimg) and bootopt lives in vendor_boot's
# cmdline, which stays stock - so nothing is being displaced here.
# gki_defconfig sets
# CONFIG_CMDLINE_EXTEND, so what survives here is appended to the fragment's
# CONFIG_CMDLINE rather than replacing it.
#
# printk.devkmsg=on keeps the dmesg replay out of the ratelimiter, which is how
# early-boot evidence is collected when the device does not come up.
#
# cgroup_disable=net_prio breaks a deadlock the MP01 hit at both boot and
# shutdown, measured there from /proc/<pid>/stack while it was happening:
#   - lxc-start creates the container's cgroup; net_prio's cgrp_css_online()
#     runs under cgroup_mutex and takes rtnl_lock
#   - connmand holds rtnl in ccmni_close() -> flush_delayed_work(), waiting for
#     a ccmni work item on the "events" workqueue
#   - every "events" kworker is parked in cgroup_bpf_release() waiting for
#     cgroup_mutex
# and PID 1 then blocks in proc_cgroup_show, so systemctl never returns. Nothing
# device-specific about it: net_prio is the only controller whose css_online
# takes rtnl, ccmni is MediaTek's shared cellular netdev, and the LXC container
# and connman are the same on every Halium port. Pre-emptive here rather than
# discovered again. Same knob as the kernel fragment's cgroup_disable=pressure;
# cgroup_disable accumulates across the command line, and putting it here means
# no kernel rebuild to change it.
#
# Not copied from the MP01: its "initcall_debug=0 loglevel=4", which exist to
# undo a vendor_boot cmdline that turns both on. The Q25's vendor_boot cmdline is
# "bootopt=64S3,32N2,64N2 buildvariant=user" (verified with unpack_bootimg) and
# turns on neither, so there is nothing to undo.
ANDROID_BOOTIMG_CMDLINE = "????????????????????log_buf_len=4M printk.devkmsg=on cgroup_disable=net_prio"

# MediaTek on GKI uses the 8250 driver - 8250_mtk.ko is in the stock
# vendor_boot module set - so ttyS0, not mindphone's 4.14-era ttyMT0. Still
# UNVERIFIED as a usable console: the Q25 exposes no debug UART and the stock
# vendor_boot cmdline asks for console=tty0.
SERIAL_CONSOLE = "115200 ttyS0"

# 50 MP on the back and 8 MP on the front - both new parts fitted by the
# restomod, not the Classic's original sensors. camera-front is what installs
# luneos-faced, and the pair is what installs the camera app.
MACHINE_FEATURES += "camera-rear camera-front"

# The infrared transmitter: a MediaTek PWM IR transmitter (mtk-pwm-ir-tx,
# "mediatek,irtx-pwm") that the GKI kernel exposes as /dev/lirc0, read on the
# phone on 6 Oct 2026 - LIRC_CAN_SEND_PULSE, carrier and duty cycle settable,
# which is what irblasterd's lirc backend needs. Like the rest of this list it
# only documents the device: the rootfs, and so the packages, come from
# halium-arm64, which declares ir-blaster for that reason.
MACHINE_FEATURES += "ir-blaster"

# Build the kernel with ThinLTO rather than the device config's full LTO. The
# single-threaded "LTO vmlinux.o" link is ~20 minutes of one core and is most of
# the build; ThinLTO parallelises it and is KMI-neutral (CRCs come from genksyms
# on preprocessed source, not codegen - the MP01 verified 0/345 both ways on this
# same SoC). check-kmi.sh remains the per-build gate. Set to "0" for a shipped
# image if matching the vendor's codegen exactly is wanted.
KERNEL_LTO_THIN = "1"

# Put our patched keyboard driver into the initramfs, where it replaces the
# vendor's bbqX0kbd.ko. Without it the Q20 symbol-layer patch is dead code - the
# device would load the vendor's binary from the vendor_boot ramdisk instead.
# One 66 KB module; see the recipe's do_install for the substitution mechanism.
ANDROID_EXTRA_INITRAMFS_IMAGE_INSTALL = "linux-zinwa-q25"

# Deliberately NOT set: the device's kernel modules WHOLESALE in
# ANDROID_EXTRA_INITRAMFS_IMAGE_INSTALL.
#
# kmi-crc-matching.md step -1 says to build the vendor's modules rather than
# match their CRCs, and on a device with published source - which this one has -
# that is normally right. It is the wrong call here, for two measured reasons:
#
#   1. There is nothing to buy. check-kmi.sh reports 344 of 344 stock modules
#      load against our kernel with 0 CRC mismatches, so the binaries the device
#      already has are fine. The only thing that blocked them was the vermagic
#      string, fixed for free in files/vermagic.cfg.
#   2. It is actively risky on MT6789. The MP01 embedded its 180 vendor modules
#      (5.5 MB compressed) and the boot image went from 28 MB to 31.6 MB, after
#      which lk stopped loading it at all - no kmsg, no panic, nothing in expdb,
#      on six consecutive images. The 64 MiB partition was never the constraint;
#      the combined ramdisk the kernel must decompress is. Ours is 27 MB.
#
# If a future config change does move a CRC, the escalation is a minimal set
# (storage + USB + watchdog, a few hundred KB) rather than all of them, and
# watch the boot image stay near 28 MB.

# Deliberately NOT set: GKI_RAMDISK_COMPRESSION. The MP01 needs "lz4-legacy"
# because both of its stock ramdisks are LZ4 and AOSP requires the compression
# to match across the bootloader's concatenation. Both of the Q25's stock
# ramdisks are gzip (checked with file(1) on the unpacked stock boot.img and
# vendor_boot.img), which is what initramfs-android-image already produces.
