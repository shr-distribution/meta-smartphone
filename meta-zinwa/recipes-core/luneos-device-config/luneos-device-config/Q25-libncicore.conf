# Tier 2 adaptation for the Zinwa Q25 (ro.product.vendor.device Q25).
# Same workaround and the same chip as the Titan and Titan Pocket copies in
# meta-webos-ports: drop it once nfcd-binder-plugin's coreInitialized() gate
# is fixed (see sargo's copy there for the cause).
#
# The Q25's ST21NFC (i2c 3-0008, vendor HAL
# android.hardware.nfc@1.2-service-st) initialises and nfcd registers adapter
# nfc0, but the default RF_DISCOVER_CMD (21 03 0b 05 03 01 00 01 01 01 05 01
# 02 01: passive and active NFC-A, NFC-B, passive and active NFC-F) is
# answered 41 03 01 01, NCI STATUS_REJECTED ("[nci] WARNING! >
# RF_DISCOVER_RSP error 1", 15 Nov 2026), and no tag is ever seen. With this
# file the HAL logs Tx 21 03 07 03 03 01 00 01 01 01 and Rx 41 03 01 00.
#
# Costs FeliCa (NFC-F) only.
[Configuration]
Technologies = Poll-A, Poll-B
