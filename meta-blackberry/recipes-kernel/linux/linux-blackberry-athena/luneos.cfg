# LuneOS / Halium kernel config delta — BlackBerry KEY2 (athena, SDM660)
#
# Merged on top of arch/arm64/configs/athena-perf_defconfig
# (tim-ecoder/android_kernel_blackberry_sdm660-4p19, lineage23.2-athena, 4.19.325).
#
# Derived from mer_verify_kernel_config (mer-kernel-check), the Halium
# halium.config fragment, systemd's README, and the LXC requirements of the
# Halium Android container. Every entry below is either a mer-check ERROR or a
# known-required item for the LuneOS stack; accepted deviations are documented
# at the bottom.

# ---------------------------------------------------------------------------
# 1. mer-kernel-check ERRORS — hard requirements
# ---------------------------------------------------------------------------

# systemd: name_to_handle_at()/open_by_handle_at(), used by the mount monitor
CONFIG_FHANDLE=y

# systemd + Mer: System V IPC. Also the dependency that makes IPC_NS selectable.
CONFIG_SYSVIPC=y

# systemd and the Halium initrd both require a kernel-populated /dev
CONFIG_DEVTMPFS=y
CONFIG_DEVTMPFS_MOUNT=y

# Virtual console. Stock Android has no VT at all; LuneOS needs it for the
# console, for VT switching and for plymouth-less boot output.
CONFIG_VT=y
CONFIG_VT_CONSOLE=y
CONFIG_CONSOLE_TRANSLATIONS=y
CONFIG_UNIX98_PTYS=y

# UTF-8 filenames
CONFIG_NLS_UTF8=y

# Stock sets CONFIG_STATIC_USERMODEHELPER=y with STATIC_USERMODEHELPER_PATH=""
# — an empty path disables *every* call_usermodehelper(), i.e. request_module(),
# core dumps and the firmware fallback loader. Android never calls them; LuneOS
# does (module autoload in particular).
# CONFIG_STATIC_USERMODEHELPER is not set

# ---------------------------------------------------------------------------
# 2. Namespaces — required by the LXC Android container
# ---------------------------------------------------------------------------
CONFIG_NAMESPACES=y
CONFIG_UTS_NS=y
CONFIG_IPC_NS=y
CONFIG_PID_NS=y
CONFIG_USER_NS=y
CONFIG_NET_NS=y
CONFIG_CHECKPOINT_RESTORE=y

# ---------------------------------------------------------------------------
# 3. cgroups — LXC device whitelisting + systemd resource control
# ---------------------------------------------------------------------------
CONFIG_CGROUPS=y
CONFIG_CGROUP_DEVICE=y
CONFIG_CGROUP_FREEZER=y
CONFIG_CGROUP_SCHED=y
CONFIG_CGROUP_CPUACCT=y
CONFIG_CGROUP_PERF=y
CONFIG_CGROUP_NET_PRIO=y
CONFIG_NET_CLS_CGROUP=y
CONFIG_BLK_CGROUP=y
CONFIG_MEMCG=y
CONFIG_MEMCG_SWAP=y
CONFIG_CPUSETS=y

# ---------------------------------------------------------------------------
# 4. systemd optional-but-recommended
# ---------------------------------------------------------------------------
CONFIG_FANOTIFY=y
CONFIG_FANOTIFY_ACCESS_PERMISSIONS=y
CONFIG_AUTOFS4_FS=y
CONFIG_SECURITY_YAMA=y
CONFIG_TMPFS_XATTR=y
CONFIG_TMPFS_POSIX_ACL=y
CONFIG_SECCOMP=y

# SELinux: keep it built (the Android container needs the labels) but allow
# selinux=0 / permissive from the kernel cmdline during bring-up.
CONFIG_SECURITY_SELINUX=y
CONFIG_SECURITY_SELINUX_DEVELOP=y
CONFIG_SECURITY_SELINUX_BOOTPARAM=y

# ---------------------------------------------------------------------------
# 5. Bluetooth — bluebinder talks to the container HAL over a virtual HCI
# ---------------------------------------------------------------------------
CONFIG_BT=y
CONFIG_BT_HCIVHCI=y
CONFIG_BT_RFCOMM=y
CONFIG_BT_RFCOMM_TTY=y
CONFIG_BT_BNEP=y
CONFIG_BT_BNEP_MC_FILTER=y
CONFIG_BT_BNEP_PROTO_FILTER=y
CONFIG_BT_HIDP=y
CONFIG_RFKILL=y

# HID: BT keyboards/mice via hidraw, and uinput for the hardware keyboard
CONFIG_HIDRAW=y
CONFIG_UHID=y
CONFIG_INPUT_UINPUT=y

# ---------------------------------------------------------------------------
# 6. Waydroid / nested containers
# ---------------------------------------------------------------------------
CONFIG_SQUASHFS=y
CONFIG_SQUASHFS_XATTR=y
CONFIG_SQUASHFS_XZ=y
CONFIG_SQUASHFS_ZLIB=y
CONFIG_VETH=y
CONFIG_TUN=y
CONFIG_NETFILTER_XT_TARGET_CHECKSUM=y
CONFIG_BRIDGE=y

# ---------------------------------------------------------------------------
# 7. Storage / misc userland conveniences
# ---------------------------------------------------------------------------
CONFIG_BLK_DEV_LOOP=y
CONFIG_BLK_DEV_NBD=y
CONFIG_FUSE_FS=y
CONFIG_CUSE=y
CONFIG_ISO9660_FS=y
CONFIG_UDF_FS=y
CONFIG_IKCONFIG=y
CONFIG_IKCONFIG_PROC=y

# ---------------------------------------------------------------------------
# 8. Deliberate values that differ from mer-kernel-check's advice
# ---------------------------------------------------------------------------
# NOTE: do NOT write bare "# CONFIG_FOO=y" in comments in this file.
# scripts/kconfig/merge_config.sh matches ^(# )?CONFIG_[A-Za-z0-9_][= ] and
# treats such a line as a directive, so a "documentation" comment silently
# overrides the symbol. Reference symbols without the CONFIG_ prefix below.

# DUMMY: mer wants it unset (connman can present dummy0 as a wired service).
# Kept =y to match stock and the mindphone port, where =y caused no trouble and
# Android's netd expects dummy0 to exist. This is the one deliberate mer ERROR.
CONFIG_DUMMY=y

# FW_LOADER_USER_HELPER: kept at the stock value. Qualcomm firmware is loaded
# directly from the filesystem, so the fallback path is inert. mindphone turned
# this off and flagged it as a suspected wifi/firmware regression - not repeated.
CONFIG_FW_LOADER_USER_HELPER=y
CONFIG_FW_LOADER_USER_HELPER_FALLBACK=y

# Left as mer warnings on purpose:
#   RTC_DRV_CMOS            - x86 only, not available on arm64
#   SECURITY_YAMA_STACKED   - only meaningful on kernels < 4.3
#   NFS*/SUNRPC/LOCKD/CIFS/BTRFS/ECRYPT_FS - unused by LuneOS on a handset
#   BT_HCIUART*             - BT goes through bluebinder/vhci, not a UART HCI
#   NF_CONNTRACK_IPV4/IPV6  - merged into NF_CONNTRACK since 4.19
#   LBDAF                   - removed in 4.19 (always-on for 64-bit)

# netconsole: stream kmsg to the host over the USB gadget network (UDP 6666,
# listen with: nc -ul 6666). Dynamic so the initramfs attaches it after the
# gadget comes up. Tier B only - NETPOLL alters struct net_device, which is
# KMI-poison on GKI devices.
CONFIG_NETCONSOLE=y
CONFIG_NETCONSOLE_DYNAMIC=y

# Append ONLY athena's device tree to Image.gz-dtb.
#
# Without this the arm64 boot Makefile globs every .dtb in the build tree - 27
# blobs, ~8 MB, 26 of them for other sdm630/sda630 boards - giving a 24.9 MB
# Image.gz-dtb. The boot header puts the kernel at base+0x8000 and the ramdisk
# at base+0x01000000, i.e. 16.8 MB of room, so that image runs 8.2 MB past the
# ramdisk load address. The stock 4.4 image is 14.8 MB and fits with 2 MB spare.
#
# Needs the companion kernel commit "arm64: boot: append only the device trees
# the config asks for" - DTB_LIST was resolved but never used by the
# Image.gz-dtb rule.
#
# Safe to restrict to the one blob: the target is a BBF100-8, i.e. the SDM660
# KEY2 - msm-id 0x13d, board-id 0xde000008 - and this dtb is the only one in
# the tree that matches it (verified against the dtbs appended to the shipping
# /e/OS boot.img, where it is byte-for-byte the same board match).
#
# The /e/OS image additionally carries two SDM636 (msm-id 0x159, board-ids
# 0xba000008 / 0xaa000008) athena variants, which this tree has no dts for.
# Irrelevant for BBF100-8; it would matter for a KEY2 that reports 0x159.
CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE=y
# Pin the "Appended DTB Kernel Image name" choice rather than relying on
# first-entry-wins: enabling the parent option also rewrites KBUILD_IMAGE to
# $(KBUILD_IMAGE)-dtb, and we want Image.gz-dtb, which is what
# KERNEL_IMAGETYPE in athena.conf asks bitbake to build.
CONFIG_IMG_GZ_DTB=y
CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE_NAMES="vendor/qcom/sdm660-internal-codec-mtp-athena"

# ---------------------------------------------------------------------------
# 9. Fitting the boot-image window  (ramdisk 0x01000000 - kernel 0x8000)
# ---------------------------------------------------------------------------
# 16,744,448 bytes for Image.gz plus every appended device tree. The address is
# proven - it is what the shipping /e/OS boot.img uses and what the UBports
# SDM660 port (Xiaomi Mi A2) uses - so the kernel is trimmed to fit rather than
# the address moved. Trimming the appended dtbs (section 8) gets 24.9 -> 17.2 MB;
# these get the last ~0.4 MB and some margin.

# IKHEADERS embeds the whole kernel-headers tarball in the image for on-device
# eBPF/BTF tooling. Android uses it; LuneOS does not, and it is the single
# largest removable chunk here.
# CONFIG_IKHEADERS is not set

# All symbols, not just functions, in the kallsyms table. Useful for kernel
# development, a few hundred KB we do not have. IKCONFIG stays on - /proc/config.gz
# is how the running config gets checked against mer-kernel-check.
# CONFIG_KALLSYMS_ALL is not set

# MDSS's extended debug logger.
# CONFIG_FB_MSM_MDSS_XLOG_DEBUG is not set

# Dropped from section 7: no optical media on a handset.
# CONFIG_ISO9660_FS is not set
# CONFIG_UDF_FS is not set

# ---------------------------------------------------------------------------
# 10. Bring-up debugging on a device with no usable serial port
# ---------------------------------------------------------------------------
# NOTE (20 Sep 2026): the options below are KEPT but they DO NOT WORK on this
# device. Built with CONFIG_FRAMEBUFFER_CONSOLE=y and console=tty0, fbcon never
# takes over from the dummy console - fb0 registers at 1.12 s, the console stays
# "colour dummy device 80x25", and "Console: switching to colour frame buffer
# device" is absent from 1406 lines of dmesg. DEFERRED_TAKEOVER is off,
# mdss_fb uses register_framebuffer(), and fb_console_init() runs at
# subsys_initcall, so the usual causes are ruled out; root cause unknown.
#
# Left enabled because they cost ~100 KB against 3.6 MB of headroom and may yet
# be made to work, but DO NOT treat the screen as a debug channel here: use adb
# and dmesg. And note that on this phone the BlackBerry splash stays up in every
# case, including a fully working boot - it is not a symptom of anything.
# ---------------------------------------------------------------------------
CONFIG_FRAMEBUFFER_CONSOLE=y
CONFIG_FRAMEBUFFER_CONSOLE_DETECT_PRIMARY=y
CONFIG_FONT_SUPPORT=y
CONFIG_FONT_8x16=y

# SELinux: this kernel has NO CONFIG_SECURITY_SELINUX_BOOTPARAM_VALUE symbol.
# The CIP 4.19.325 tree backported the 5.x SELinux/LSM rework, which deleted it:
# security/selinux/hooks.c now has a hardcoded
#     int selinux_enabled_boot __initdata = 1;
# with only __setup("selinux=", ...) to change it. We carried that symbol for a
# while and merge_config.sh dropped it silently - it never did anything.
#
# We also do not pass selinux=0 on the cmdline any more. Every other LuneOS
# Halium port (tissot, sagit, surya, oxygen, tenderloin) passes only
# androidboot.selinux=permissive, which is an Android-init property the kernel
# ignores, and leaves the kernel's own SELinux enabled. selinux=0 was copied
# from the UBports SDM660 deviceinfo, where it is half of a pair - UBports also
# sets CONFIG_DEFAULT_SECURITY="apparmor" and passes security=apparmor, because
# Ubuntu Touch confines apps with AppArmor. LuneOS does not use AppArmor, so
# copying only the selinux=0 half leaves the LSM slot empty for no benefit, and
# the Android container inside wants the security.selinux xattr handler live.
#
# SECURITY_SELINUX_BOOTPARAM (section 4) stays on, so selinux=0 can still be
# added to the cmdline to A/B it without a rebuild.

# ---------------------------------------------------------------------------
# 11. Match LineageOS's code generation
# ---------------------------------------------------------------------------
# Diffing our built .config against the same defconfig processed alone showed
# 35 symbols differing beyond this fragment - almost all benign fallout of VT,
# fbcon and squashfs, plus compiler version strings. One is not:
#
#   CONFIG_ARM64_LSE_ATOMICS   LineageOS: absent    ours: =y
#   CONFIG_BROKEN_GAS_INST     LineageOS: =y        ours: absent
#
# LineageOS builds with clang 19, whose assembler this 4.19 tree decides is
# "broken", so ARM64_LSE_ATOMICS never gets enabled there. Our binutils 2.46 is
# fine by that test, so we turn LSE atomics on - a whole-kernel code-generation
# difference that exists purely because of the toolchain, and that the working
# reference does not have.
#
# Turned off to match the configuration that is known to boot and mount on this
# SoC. Revisit once the port is healthy; LSE atomics are a performance win, not
# a correctness requirement.
# CONFIG_ARM64_USE_LSE_ATOMICS is not set
