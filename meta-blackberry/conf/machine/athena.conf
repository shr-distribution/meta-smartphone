#-----------------------------------------------------------------------------
#@TYPE: Machine
#@NAME: BlackBerry KEY2 (codename athena)
#@DESCRIPTION: Machine configuration for the BlackBerry KEY2 (BBF100), SDM660
#
# Target verified as BBF100-8: SDM660, qcom,msm-id 0x13d, board-id 0xde000008.
# There are SDM636 (0x159) KEY2 variants in the wild - the /e/OS image ships
# dtbs for two of them - and this kernel tree has no dts for those.
#-----------------------------------------------------------------------------

require conf/machine/include/arm/arch-arm64.inc
require conf/machine/include/meta-android-halium.inc

PREFERRED_PROVIDER_virtual/kernel ?= "linux-blackberry-athena"
MACHINE_KERNEL_PR = "r0"

# "keyboard-qwerty", not oe-core's plain "keyboard". The two say different
# things and only one of them is about this device: oe-core reads "keyboard"
# as "ship the console keymap tooling", and all it actually does under a
# systemd distro is drag kbd into the rootfs through the (otherwise empty)
# keymaps package - no use to a Wayland shell. The LuneOS names say what the
# hardware IS, the way camera-rear/camera-front do:
#
#   keyboard-qwerty  full physical alphabetic keyboard (athena, mp01, q25)
#   keyboard-t9      physical numeric/T9 keypad (mindphone)
#
# Nothing consumes them yet; they are the gate for anything that should behave
# differently with hardware keys, starting with whether the shell puts a
# virtual keyboard on screen.
#
# The KEY2 has a 4-row physical QWERTY with a capacitive surface, and a
# touchscreen above it. Both are real input devices here.
#
# NFC and the fingerprint reader built into the space bar are stock BBF100
# hardware. No "esim": the dual-SIM BBF100-6 takes a second nano-SIM, and no
# KEY2 variant has an eUICC.
MACHINE_FEATURES = "apm alsa bluetooth gps usbgadget usbhost phone wifi vfat ext2 keyboard-qwerty touchscreen nfc fingerprint"

# 4.5" 1080x1620 (3:2) panel. sqrt(1080^2+1620^2)/4.5 = 433 ppi.
# The LineageOS device tree buckets this as TARGET_SCREEN_DENSITY := 384.
# VERIFY on hardware before trusting the scaling - sargo needed a device pixel
# ratio well away from the "natural" one.
MACHINE_DISPLAY_WIDTH_PIXELS = "1080"
MACHINE_DISPLAY_HEIGHT_PIXELS = "1620"
MACHINE_DISPLAY_ORIENTATION = "0"
MACHINE_DISPLAY_PPI = "433"

# Same reasoning as sargo: this tracks the GSI generation pinned in
# android-system-image-athena.bb, not the vendor. libhybris gates its
# per-generation support on ANDROID_VERSION_MAJOR, which comes from this
# package, so the two have to move together.
PREFERRED_VERSION_android-headers-halium = "16.0%"

# Treble-era GSI, so the "modern" droid modules rather than the jb2q ones the
# halium include defaults to.
PREFERRED_VERSION_pulseaudio-modules-droid = "17.0.103%"
VIRTUAL-RUNTIME_android-system-image = "android-system-image-athena"

PREFERRED_PROVIDER_virtual/xserver = "xserver-xorg"
XSERVER = " \
    xserver-xorg \
    xf86-input-evdev \
    xf86-video-fbdev \
"

# fsck.vfat for the vfat firmware partitions (modem, bluetooth) the container
# mounts out of fstab.qcom.
MACHINE_EXTRA_RDEPENDS = " \
    android-kernel-bootimg \
    dosfstools \
"

# BOARD_KERNEL_IMAGE_NAME := Image.gz-dtb in the LineageOS BoardConfig: the
# dtbs are appended to the compressed kernel, there is no dtb section and no
# dtbo.img on this device.
KERNEL_IMAGETYPE = "Image.gz-dtb"
IMAGE_FSTYPES += "tar.gz"
IMAGE_ROOTFS_EXTRA_SPACE = "200000"

# Non-A/B, non-dynamic partitions; Qualcomm, so by-name symlinks exist
# (unlike the MTK devices, which only have by-partlabel).
ANDROID_BOARD_BOOTIMAGE_PARTITION = "/dev/block/bootdevice/by-name/boot"
# BOARD_BOOTIMAGE_PARTITION_SIZE / BOARD_SYSTEMIMAGE_PARTITION_SIZE /
# BOARD_FLASH_BLOCK_SIZE from device/blackberry/sdm660-common/BoardConfigCommon.mk
ANDROID_BOARD_SYSTEMIMAGE_PARTITION_SIZE = "2684354560"
ANDROID_BOARD_FLASH_BLOCK_SIZE = "262144"

# sdm660.dtsi: aliases serial0 = &uartblsp1dm1, a qcom,msm-uartdm-v1.4 handled
# by drivers/tty/serial/msm_serial.c, which registers ttyMSM.
# UNVERIFIED on hardware - the node is status = "disabled" in the base dtsi and
# a retail KEY2 exposes no debug UART without a jig.
SERIAL_CONSOLE = "115200 ttyMSM0"

# Dual 12 MP on the back, 8 MP on the front. camera-front is what makes
# packagegroup-luneos-extended install luneos-faced; see its CAMERA_RDEPENDS
# block for the camera-rear/camera-front/camera-swivel vocabulary.
MACHINE_FEATURES += "camera-rear camera-front"
