# We have a conf and classes directory, append to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a recipes directory, add to BBFILES
BBFILES += "${LAYERDIR}/recipes*/*/*.bb ${LAYERDIR}/recipes*/*/*.bbappend"

BBFILE_COLLECTIONS += "unihertz-layer"
BBFILE_PATTERN_unihertz-layer := "^${LAYERDIR}/"
BBFILE_PRIORITY_unihertz-layer = "7"

LAYERDEPENDS_unihertz-layer = "core openembedded-layer android-layer"

LAYERSERIES_COMPAT_unihertz-layer = "wrynose"
