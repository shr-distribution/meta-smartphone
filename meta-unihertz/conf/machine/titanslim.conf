#-----------------------------------------------------------------------------
#@TYPE: Machine
#@NAME: Unihertz Titan Slim (codename TitanSlim)
#@DESCRIPTION: Machine configuration for the Unihertz Titan Slim, MediaTek
#              Helio P70 (MT6771)
#
# The Pocket's twin: same SoC, same kernel tree, same branch, same revision and
# a byte-identical dtb. The two differ in eight lines of defconfig and in the
# panel. This machine exists so that difference is expressed once, in
# linux-unihertz-titanslim_git.bb, rather than by forking anything.
#
# See the layer README on whether one boot image could serve both - the answer
# is "probably, and here is the one thing that has to be settled first".
#-----------------------------------------------------------------------------

require conf/machine/include/unihertz-mt6771.inc

PREFERRED_PROVIDER_virtual/kernel ?= "linux-unihertz-titanslim"
MACHINE_KERNEL_PR = "r0"

# Same AW9523 keyboard matrix as the other two - but note that upstream's
# titanslim_defconfig does NOT enable CONFIG_MTK_AW9523, which the Pocket's
# does. The feature is claimed here because the hardware has the keyboard; the
# kernel recipe carries the note about the config gap.
#
# The touchscreen is a CHSC5432 (driver ported from linux-daria-mt6877), not
# the Pocket's Goodix. No keyboard-touch/trackpad: as on the Pocket, this
# tree has no pad driver, unlike the original Titan's synaptics_dsx_pad.
#
# TRUSTKERNEL_TEE_FP_SUPPORT=y in the stock defconfig is what says the
# fingerprint reader is real and TEE-backed. No camera features: upstream's
# defconfig compiles in no image sensor at all (CONFIG_CUSTOM_KERNEL_IMGSENSOR
# is absent, where the Pocket names two), so there is nothing to drive one with
# yet. Add camera-rear/camera-front once a sensor is built and probes.
MACHINE_FEATURES = "apm alsa bluetooth gps usbgadget usbhost phone wifi vfat ext2 keyboard-qwerty touchscreen nfc fingerprint"

# 4.2" 768x1280. sqrt(768^2 + 1280^2) / 4.2 = 355 ppi.
# The only conventionally-shaped panel of the three, and the reason it cannot
# share a build with the Pocket for free: CONFIG_LCM_WIDTH/HEIGHT are single
# strings and the Pocket's are 720/720.
MACHINE_DISPLAY_WIDTH_PIXELS = "768"
MACHINE_DISPLAY_HEIGHT_PIXELS = "1280"
MACHINE_DISPLAY_ORIENTATION = "0"
MACHINE_DISPLAY_PPI = "355"

# Dynamic partitions, as on the Pocket: Android 11 launch, so /system, /vendor
# and /product are logical volumes inside `super`, which nothing here writes to.
