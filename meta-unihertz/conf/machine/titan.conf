#-----------------------------------------------------------------------------
#@TYPE: Machine
#@NAME: Unihertz Titan (codename Titan)
#@DESCRIPTION: Machine configuration for the Unihertz Titan, MediaTek Helio P60
#              (MT6771)
#
# Secondary to titanpocket.conf, and the easier of the two: upstream builds
# this device's kernel from source and ships it, so the tree here is known to
# produce a kernel that boots a glibc/systemd userland on this hardware. It is
# the right device to fall back to if the Pocket's source kernel fights.
#
# Two hardware variants, eMMC and UFS. They used to need separate defconfigs
# and separate images; upstream merged them into one `titan_defconfig` in
# September 2026, so this machine covers both and the only difference left is
# where userdata lives (/dev/mmcblk0p36 vs /dev/sdc36), which the initramfs
# finds by name anyway.
#-----------------------------------------------------------------------------

require conf/machine/include/unihertz-mt6771.inc

PREFERRED_PROVIDER_virtual/kernel ?= "linux-unihertz-titan"
MACHINE_KERNEL_PR = "r0"

# Physical QWERTY on the same AW9523 matrix as the Pocket, and - unlike the
# Pocket - the keys are ALSO a touch surface: the kernel tree clones the
# Synaptics DSX touchscreen driver as synaptics_dsx_pad and feeds it through an
# mtk-pad input device. That is exactly what "keyboard-touch" names on athena,
# and it is what installs kbdscroll (KEYBOARD_RDEPENDS in
# packagegroup-luneos-extended), so a slide over the keys scrolls the screen.
#
# A Synaptics DSX pad reports an absolute surface, which is kbdscroll's
# original path rather than the relative one added for q25 - but confirm with
# `kbdscroll --list` before believing it.
#
# NFC is real here: the tree imports an ST21NFC driver. The fingerprint reader
# is a Chipsailing cs3711, driver imported from the stock kernel; non-functional
# in the UBports port so far.
MACHINE_FEATURES = "apm alsa bluetooth gps usbgadget usbhost phone wifi vfat ext2 keyboard-qwerty keyboard-touch touchscreen nfc fingerprint camera-rear camera-front"

# 4.6" 1430x1440. sqrt(1430^2 + 1440^2) / 4.6 = 441 ppi.
# Near-square again, and the same warning as the Pocket applies: tune the shell
# geometry in the Tier 1 adaptation, not here. VERIFY the panel mode on
# hardware - the LCM driver is named A61Qwerty46 and 4.6" is the marketing
# figure; some sources say 4.5" 1440x1440.
MACHINE_DISPLAY_WIDTH_PIXELS = "1430"
MACHINE_DISPLAY_HEIGHT_PIXELS = "1440"
MACHINE_DISPLAY_ORIENTATION = "0"
MACHINE_DISPLAY_PPI = "441"

# No dynamic partitions: the Titan launched on Android 9, so /system and
# /vendor are real partitions and there is a real `recovery` partition too -
# which is why TWRP exists for this device and not, usefully, for the Pocket.
