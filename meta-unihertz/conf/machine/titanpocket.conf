#-----------------------------------------------------------------------------
#@TYPE: Machine
#@NAME: Unihertz Titan Pocket (codename TitanPocket)
#@DESCRIPTION: Machine configuration for the Unihertz Titan Pocket, MediaTek
#              Helio P70 (MT6771)
#
# PRIMARY target of this layer. See conf/machine/include/unihertz-mt6771.inc
# for everything this shares with titan.conf, and the layer README for the
# state of the kernel tree - which is the one thing about this device that is
# NOT settled: the Ubuntu Touch port still ships the *stock prebuilt* kernel
# here and builds only loadable modules against the source tree. The
# source-built kernel this machine asks for has, as far as anyone has written
# down, never been booted. That is the first milestone, and the README has the
# fallback if it does not come up.
#-----------------------------------------------------------------------------

require conf/machine/include/unihertz-mt6771.inc

PREFERRED_PROVIDER_virtual/kernel ?= "linux-unihertz-titanpocket"
MACHINE_KERNEL_PR = "r0"

# "keyboard-qwerty", not oe-core's plain "keyboard" - athena.conf carries the
# full vocabulary note. The Pocket has a 4-row physical QWERTY on an Awinic
# AW9523 I2C matrix (drivers/misc/mediatek/aw9523, imported from the Astro
# Slide and then reworked against the stock kernel binary) plus a separate
# 3.1" Goodix GT1151QM touchscreen.
#
# NO "keyboard-touch" and no "trackpad": unlike the original Titan, which
# clones the Synaptics DSX driver to drive the keys as a touch surface, the
# Pocket's kernel tree has no pad driver at all. If a Pocket turns out to have
# a touch-sensitive keyboard after all, `kbdscroll --list` on the device is
# what settles it, and the feature to add is keyboard-touch.
#
# NFC and the side fingerprint reader are on Unihertz's own spec sheet. The
# fingerprint sensor is listed as non-functional by the UBports port - that is
# a HAL/driver question, not a reason to drop the feature.
# No camera-rear/camera-front, and that is a kernel fact rather than a hardware
# one: titanpocket_defconfig names ov16880_mipi_raw and ov8865_mipi_raw and
# NEITHER driver exists in the halium-11.0 tree, so no sensor is compiled at
# all (see files/titanpocket-imgsensor.cfg). The hardware obviously has both
# cameras - put the features back the moment the drivers are ported over from
# the Titan's branch, which has imx219 and ov16880.
MACHINE_FEATURES = "apm alsa bluetooth gps usbgadget usbhost phone wifi vfat ext2 keyboard-qwerty touchscreen nfc fingerprint"

# 3.1" 716x720, very nearly square. sqrt(716^2 + 720^2) / 3.1 = 327 ppi.
#
# This is the smallest and the squarest panel LuneOS has targeted - q25 is
# 720x720 at 291 ppi and needed its grid unit and device pixel ratio tuned by
# eye before webOS's fixed-layout Enyo pages fit. Expect the same here and do
# that work in the Tier 1 adaptation (luneos-device-config), not in these
# three variables, which are the panel's own physical numbers.
MACHINE_DISPLAY_WIDTH_PIXELS = "716"
MACHINE_DISPLAY_HEIGHT_PIXELS = "720"
MACHINE_DISPLAY_ORIENTATION = "0"
MACHINE_DISPLAY_PPI = "327"

# Dynamic partitions: the Pocket launched on Android 11, so /system, /vendor
# and /product are logical volumes inside `super`. Nothing here writes to
# them - the GSI travels as android-rootfs.img next to rootfs.img in the Linux
# partition - but mount-android.sh needs the dynparts path, which is already
# generic (bluejay needs it too).
#
# ANDROID_BOARD_SYSTEMIMAGE_PARTITION_SIZE is deliberately unset: there is no
# system partition to size, and no android-system-image recipe for this machine.
