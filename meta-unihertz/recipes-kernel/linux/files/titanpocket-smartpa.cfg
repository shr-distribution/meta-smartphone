# Titan Pocket only: /dev/smartpa_i2c for its FourSemi FS16xx loudspeaker
# amplifier (on the kernel branch). The vendor HAL's libfs1860.so programs the
# amplifier through it; without it the speaker stays silent. The stock kernel
# has its own FourSemi driver built in for the same node. New option, it
# changes no struct.
CONFIG_SND_SOC_MTK_FS16XX_I2C=y
