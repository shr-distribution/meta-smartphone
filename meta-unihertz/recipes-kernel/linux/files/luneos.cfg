# LuneOS / Halium kernel config delta - Unihertz MT6771 (Titan, Titan Pocket,
# Titan Slim).
#
# Merged on top of whichever device defconfig the recipe names
# (UNIHERTZ_DEFCONFIG); later lines win over earlier ones when kconfig reads
# the concatenation.
#
# One fragment for all three machines on purpose. The Titan's kernel branch
# carries an arch/arm64/configs/halium.config of its own and this is a superset
# of it, so there is a single place to change rather than one per branch.
#
# Two things are deliberately NOT taken from that upstream fragment:
#
#   AppArmor (SECURITY_APPARMOR, DEFAULT_SECURITY_APPARMOR)
#       Ubuntu Touch confines applications with AppArmor and LuneOS does not.
#       Enabling it here would fill the LSM slot for no benefit and take the
#       security.selinux xattr handler the Android container wants with it.
#       Their entire LSM-as-a-loadable-module arrangement on the Pocket/Slim
#       exists to serve this requirement and is not ours.
#
#   CONFIG_ANDROID_BINDER_DEVICES
#       waydroid-kernel.inc already writes the full list, anbox nodes included.
#
# NOTE: do NOT write a bare "# CONFIG_FOO=y" in a comment in this file.
# scripts/kconfig/merge_config.sh matches ^(# )?CONFIG_[A-Za-z0-9_][= ] and
# reads such a line as a directive, so a "documentation" comment silently
# overrides the symbol. Reference symbols without the CONFIG_ prefix instead.
#
# Tier B, but NOT free of ABI constraints. We build the kernel, yet the
# Android container still loads the vendor's prebuilt connectivity modules from
# /vendor/lib/modules (wmt_drv, wlan_drv_gen3, bt_drv, gps_drv, fmradio_drv),
# force-loaded past the vermagic check. They were compiled against the stock
# kernel, so any option here that changes the layout of a struct they touch
# corrupts memory. Measured on the Titan Pocket, 2 Oct 2026, from ramoops:
# NETPOLL/NET_POLL_CONTROLLER inserted three pointers into net_device_ops,
# register_netdev() in wlan_drv_gen3 called ndo_bpf through the shifted table
# and jumped to 0x55aa8d704b2800 - a kernel panic 22 s into every boot.
#
# Rule for this file: before turning anything on, check it is not inside
# task_struct, net_device(_ops), sk_buff, sock, inode, file, device or cred.
# Compared against the stock 2024-05-14 kernel's /proc/config.gz (ikconfig):
# with this file as it is, none of those structs differs from stock any more.

# ---------------------------------------------------------------------------
# 1. mer-kernel-check ERRORS - hard requirements
# ---------------------------------------------------------------------------

# systemd: name_to_handle_at()/open_by_handle_at(), used by the mount monitor.
# All three stock defconfigs explicitly disable this ("# CONFIG_FHANDLE is not
# set"), and the upstream halium.config does not turn it back on - so this line
# is the single most load-bearing one in the file.
CONFIG_FHANDLE=y

# No System V IPC. mer-kernel-check still asks for it, but LuneOS stopped
# needing it on 15 Sep 2026, when PmLogLib moved off shmget()/shmat() (checked
# against this tree's halium_arm64 rootfs: libPmLogLib.so.3.3.0 imports no
# shm or sem symbol at all). It also adds sysvsem/sysvshm to task_struct, in
# front of files, nsproxy and signal, which the stock-built vendor modules do
# not expect. IPC_NS goes with it; the container config already keeps the host
# IPC namespace (lxc.namespace.keep = ipc user).
# CONFIG_SYSVIPC is not set

# systemd and the Halium initrd both require a kernel-populated /dev
CONFIG_DEVTMPFS=y
CONFIG_DEVTMPFS_MOUNT=y

# Virtual console. The stock defconfigs set "# CONFIG_VT is not set" - Android
# has no VT at all. LuneOS needs it for the console and for VT switching.
CONFIG_VT=y
CONFIG_VT_CONSOLE=y
CONFIG_CONSOLE_TRANSLATIONS=y
CONFIG_UNIX98_PTYS=y
CONFIG_NULL_TTY=y

# UTF-8 filenames
CONFIG_NLS_UTF8=y

# An empty STATIC_USERMODEHELPER_PATH disables every call_usermodehelper():
# module autoload, core dumps and the firmware fallback loader. Android never
# calls them; LuneOS does.
# CONFIG_STATIC_USERMODEHELPER is not set

# ---------------------------------------------------------------------------
# 2. Namespaces - required by the LXC Android container
# ---------------------------------------------------------------------------
CONFIG_NAMESPACES=y
CONFIG_UTS_NS=y
CONFIG_PID_NS=y
CONFIG_USER_NS=y
CONFIG_NET_NS=y
CONFIG_CHECKPOINT_RESTORE=y

# ---------------------------------------------------------------------------
# 3. cgroups - LXC device whitelisting + systemd resource control
# ---------------------------------------------------------------------------
CONFIG_CGROUPS=y
CONFIG_CGROUP_DEVICE=y
CONFIG_CGROUP_FREEZER=y
CONFIG_CGROUP_SCHED=y
CONFIG_CGROUP_CPUACCT=y
# CGROUP_PERF stays off as on stock: it adds cgroup fields to struct perf_event
# and perf_cpu_context, which the vendor's met.ko profiler dereferences.
# CONFIG_CGROUP_PERF is not set
# CGROUP_NET_PRIO stays off: it adds priomap to struct net_device, which moves
# netdev_priv() for every vendor network driver (see the top of this file).
# BLK_CGROUP stays off as on stock: with MEMCG it switches on CGROUP_WRITEBACK,
# which has no prompt of its own and adds fields to struct inode. systemd only
# loses per-unit block I/O accounting.
# CONFIG_CGROUP_NET_PRIO is not set
# CONFIG_BLK_CGROUP is not set
CONFIG_NET_CLS_CGROUP=y
CONFIG_MEMCG=y
CONFIG_MEMCG_SWAP=y
CONFIG_CPUSETS=y

# ---------------------------------------------------------------------------
# 4. systemd optional-but-recommended
# ---------------------------------------------------------------------------
CONFIG_FANOTIFY=y
CONFIG_FANOTIFY_ACCESS_PERMISSIONS=y
CONFIG_AUTOFS4_FS=y
CONFIG_SECURITY_YAMA=y
CONFIG_TMPFS_XATTR=y
CONFIG_TMPFS_POSIX_ACL=y
CONFIG_SECCOMP=y

# SELinux: keep it built - the Android container needs the labels - but allow
# permissive from the kernel command line during bring-up.
CONFIG_SECURITY_SELINUX=y
CONFIG_SECURITY_SELINUX_DEVELOP=y
CONFIG_SECURITY_SELINUX_BOOTPARAM=y

# ---------------------------------------------------------------------------
# 5. Bluetooth - bluebinder talks to the container HAL over a virtual HCI
# ---------------------------------------------------------------------------
CONFIG_BT=y
CONFIG_BT_HCIVHCI=y
CONFIG_BT_RFCOMM=y
CONFIG_BT_RFCOMM_TTY=y
CONFIG_BT_BNEP=y
CONFIG_BT_BNEP_MC_FILTER=y
CONFIG_BT_BNEP_PROTO_FILTER=y
CONFIG_BT_HIDP=y
CONFIG_RFKILL=y

# HID: BT keyboards/mice via hidraw, and uinput - which on this family is not
# optional trivia. kbdscroll injects a synthetic touch contact through uinput
# so a slide over the keyboard scrolls the shell.
CONFIG_HIDRAW=y
CONFIG_UHID=y
CONFIG_INPUT_UINPUT=y

# ---------------------------------------------------------------------------
# 6. Waydroid / nested containers
# ---------------------------------------------------------------------------
# waydroid-kernel.inc forces VETH, OVERLAY_FS, SW_SYNC, UHID, RT_GROUP_SCHED=n
# and the binder device list; these are the rest.
CONFIG_SQUASHFS=y
CONFIG_SQUASHFS_XATTR=y
CONFIG_SQUASHFS_XZ=y
CONFIG_SQUASHFS_ZLIB=y
CONFIG_TUN=y
CONFIG_NETFILTER_XT_TARGET_CHECKSUM=y
CONFIG_BRIDGE=y

# ---------------------------------------------------------------------------
# 7. Storage / misc userland conveniences
# ---------------------------------------------------------------------------
CONFIG_BLK_DEV_LOOP=y
CONFIG_BLK_DEV_NBD=y
CONFIG_FUSE_FS=y
CONFIG_CUSE=y
CONFIG_IKCONFIG=y
CONFIG_IKCONFIG_PROC=y

# ---------------------------------------------------------------------------
# 8. MediaTek specifics
# ---------------------------------------------------------------------------
# The MTK connectivity stack - wmt_drv, wmt_chrdev_wifi, wlan_drv_gen2,
# bt_drv, gps_drv - exists only as stock vendor modules; the GPL drop has the
# adapter shims and not the drivers. Our config delta shifts module_layout, so
# they can only enter through modprobe --force, which the kernel refuses
# without this. Proven safe on mindphone, the MT6739 sibling.
CONFIG_MODULE_FORCE_LOAD=y

# 4.14 ALPS is a stack-hungry tree and OE's GCC is not the clang it was written
# for. mindphone needed 2048 on MT6739; MT6771 needs more - GCC gives
# mtk_battery_core.c's fg_custom_init_from_header() a 2144-byte frame and the
# vendor Makefiles' -Werror makes -Wframe-larger-than fatal. 4096 keeps the
# check meaningful while clearing the vendor drivers.
CONFIG_FRAME_WARN=4096

# titanpocket_defconfig ships DEBUG_INFO=y (titan_defconfig does not). It roughly
# doubles compile time and inflates the -src package for a kernel we ship
# stripped, and this tree is going to need several build iterations before it
# compiles with GCC at all. Turn it off; turn it back on if a kernel oops ever
# needs decoding.
# CONFIG_DEBUG_INFO is not set

# ---------------------------------------------------------------------------
# 9. Bring-up instrumentation
# ---------------------------------------------------------------------------
# No netconsole. NETPOLL changes struct net_device and net_device_ops, and
# that is exactly what crashed the vendor wlan_drv_gen3 (top of this file). The
# kernel log is reachable without it: ramoops at 0x54410000 survives the warm
# reset of a panic, and the staging kit's dump-expdb.sh reads it out of DRAM
# over the preloader.
# CONFIG_NETCONSOLE is not set
# CONFIG_NETPOLL is not set

# Deliberately NOT enabled here: DEBUG_FS. On mindphone turning it on dragged
# in MediaTek's freqhopping debug code, which calls an FHDBG() the vendor drop
# never defines, and the build stopped at -Werror=implicit-function-declaration.
# That was fixed in the kernel tree there rather than worked around. Whether
# this tree has the same hole is untested; turn it on when suspend or wakeup
# sources need explaining, and expect to fix that first.

# ---------------------------------------------------------------------------
# 10. Deliberate values that differ from mer-kernel-check's advice
# ---------------------------------------------------------------------------
# DUMMY: mer wants it unset (connman can present dummy0 as a wired service).
# Kept =y to match stock and every other port in this tree, where it caused no
# trouble and Android's netd expects dummy0 to exist.
CONFIG_DUMMY=y

# FW_LOADER_USER_HELPER: left at whatever the device defconfig says. mindphone
# turned it off and then flagged it as a suspected MTK wifi/firmware
# regression; not repeated.

# Left as mer warnings on purpose:
#   RTC_DRV_CMOS            - x86 only
#   SECURITY_YAMA_STACKED   - only meaningful on kernels < 4.3
#   NFS*/SUNRPC/LOCKD/CIFS/BTRFS - unused by LuneOS on a handset
#   BT_HCIUART*             - BT goes through bluebinder/vhci, not a UART HCI
