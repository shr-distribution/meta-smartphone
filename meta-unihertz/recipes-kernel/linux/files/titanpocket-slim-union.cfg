# EXPERIMENT, not wired into any machine: one kernel for the Titan Pocket AND
# the Titan Slim.
#
# To try it, in linux-unihertz-titanpocket_git.bb:
#
#     SRC_URI += "file://titanpocket-slim-union.cfg"
#     do_configure:prepend() { ... cat ... titanpocket-slim-union.cfg ... }
#
# or more simply point UNIHERTZ_DEFCONFIG at a union defconfig committed to the
# kernel fork, which is what upstream did for the Titan's eMMC/UFS split.
#
# WHY IT IS PLAUSIBLE
#
# The two devices already share the tree, the branch, the revision and a
# byte-identical dtb. Their defconfigs differ in eight lines, and upstream has
# already settled the one that looks scariest. From TheKit's commit merging the
# Titan's own two variants:
#
#   "ARCH_MTK_PROJECT keeps the eMMC value. The string is inert in this tree:
#    there is no dws file or project directory matching either name, so it
#    selects nothing."
#
# which was independently checked here: no g66v71c2k_dfl_eea or
# g83v71c2k_dfl_eea directory exists anywhere in the tree. That commit is also
# the precedent for the whole idea - it unions two storage stacks into one
# kernel and boots it on both variants, relying on runtime probe order.
#
# And CONFIG_CUSTOM_KERNEL_LCM is genuinely a LIST, not a choice:
#
#   drivers/misc/mediatek/lcm/Makefile:
#     LCM_LISTS := $(subst ",,$(CONFIG_CUSTOM_KERNEL_LCM))
#     obj-$(CONFIG_MTK_LCM) += $(foreach LCM,$(LCM_LISTS),$(LCM)/)
#
# Multi-panel builds are the case MediaTek designed for; shipping one image
# across several panel suppliers is what OEMs do with it.
#
# WHAT IS NOT SETTLED
#
# CONFIG_LCM_WIDTH and CONFIG_LCM_HEIGHT are single strings ("To set LCM
# resolution", per their Kconfig help) and the two devices disagree: 720x720 on
# the Pocket, 768x1280 on the Slim. A union build has to pick one. Whether the
# other device then comes up correctly depends on how far those values reach
# past the boot logo and the early framebuffer reservation, which nobody has
# measured. That single question is the whole experiment; everything below
# unions cleanly.
#
# If it does not work out, the cost of staying split is one extra recipe of
# four lines and one extra boot image - everything else in this layer is
# already shared.

# Both panels. Order is the probe order.
CONFIG_CUSTOM_KERNEL_LCM="R63308_CASCADEMDZ40 R63308_ZMK42"

# Pocket geometry. Flip to 768/1280 to test the Slim from the same image.
CONFIG_LCM_WIDTH="720"
CONFIG_LCM_HEIGHT="720"

# Both touchscreens; each probes its own i2c address and the other is absent.
CONFIG_TOUCHSCREEN_MTK_GT1151=y
CONFIG_GT1151_CONFIG="config0"
CONFIG_TOUCHSCREEN_MTK_CHSC5432=y

# The keyboard matrix, which titanslim_defconfig omits and the Slim plainly has.
CONFIG_MTK_AW9523=y

# The Pocket's camera sensors. The Slim's defconfig names none, so this is a
# union rather than a conflict.
CONFIG_CUSTOM_KERNEL_IMGSENSOR="ov16880_mipi_raw ov8865_mipi_raw"
CONFIG_CUSTOM_KERNEL_CAM_CAL_DRV="BRCB032GWZ_3 GT24c32a cat24c16"

# The Slim's TEE fingerprint support; a different symbol from the Pocket's
# RPMB one, so both can be on.
CONFIG_TRUSTKERNEL_TEE_FP_SUPPORT=y
