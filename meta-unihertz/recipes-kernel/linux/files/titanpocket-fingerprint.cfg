# Titan Pocket only: the Sunwave TEE fingerprint driver (on the kernel branch).
CONFIG_SUNWAVE_FP=y
# Lets the TrustKernel TEE switch the SPI0 clock for the fingerprint trusted
# app: tee_clkmgr creates the SPI clock handle on demand, as stock does
# (kernel commit "tkcore: clkmgr: create SPI clock handles on demand").
# Stock has it on.
CONFIG_TRUSTKERNEL_TEE_FP_SUPPORT=y
