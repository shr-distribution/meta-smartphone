# Titan Pocket only: the Synaptics RMI4 touch surface under the keys, through
# the mainline RMI4 driver and the titanpocket-touchpad glue (on the kernel
# branch). F55 has to stay off: its probe makes the next PDT read fail and the
# whole RMI4 device is torn down (TitanPocket-OpenLinux, docs/drivers/touchpad.md).
# New drivers only, no struct changes.
CONFIG_RMI4_CORE=y
CONFIG_RMI4_I2C=y
CONFIG_RMI4_2D_SENSOR=y
CONFIG_RMI4_F11=y
CONFIG_RMI4_F12=y
CONFIG_INPUT_TITANPOCKET_TOUCHPAD=y
