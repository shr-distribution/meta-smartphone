# Titan Pocket only: the O2Micro OZ8806 fuel gauge (on the kernel branch),
# reported through MediaTek's "battery" supply as the stock kernel does, so
# there is still one battery. Without it the percentage comes from MediaTek's
# gauge counting against a 2946 mAh reference profile; the stock gauge
# configuration puts this pack at 4250 mAh. Stock has the gauge on
# (CONFIG_AGOLD_OZ8806_SUPPORT, a symbol this tree does not have). New driver,
# no struct changes.
CONFIG_BATTERY_OZ8806=y
CONFIG_BATTERY_OZ8806_MTK_FEED=y
