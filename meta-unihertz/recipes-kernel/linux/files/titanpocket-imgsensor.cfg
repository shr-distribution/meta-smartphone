# Titan Pocket only.
#
# The camera sensors, as titanpocket_defconfig (regenerated from the stock
# kernel's /proc/config.gz) already names them. Repeated here because this
# fragment used to blank the list: neither driver existed in this branch and
# the build stopped on the missing ov16880_mipi_raw/Makefile.
#
# Both now come from patch 0010: ov16880 (rear) from TheKit's Titan branch,
# ov8865 (front) from Teracube's 4.4 tree, each checked against the stock
# kernel's own mode table.
#
# CONFIG_CUSTOM_KERNEL_CAM_CAL_DRV is left alone: despite naming three drivers
# this tree lacks, cam_cal's Makefile ignores it and builds a hardcoded list.
# The ov16880 EEPROM entry that list was missing is also in patch 0010.
CONFIG_CUSTOM_KERNEL_IMGSENSOR="ov16880_mipi_raw ov8865_mipi_raw"
