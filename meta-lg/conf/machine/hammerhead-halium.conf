#-----------------------------------------------------------------------------
#@TYPE: Machine
#@NAME: LG Nexus 5 (codename hammerhead)
#@DESCRIPTION: Machine configuration for the LG Nexus 5 (Halium)
#-----------------------------------------------------------------------------

require conf/machine/include/meta-android-halium.inc

TARGET_ARCH = "arm"

PREFERRED_PROVIDER_virtual/kernel ?= "linux-lg-hammerhead-halium"
MACHINE_KERNEL_PR = "r0"

# No "keyboard" (a slab) and no "fingerprint" (the Nexus 5 predates Nexus
# Imprint). NFC is real - a PN544 controller - and stays declared here because
# this is the Halium machine, so nfcd has an Android NFC HAL to talk to. Its
# mainline sibling, hammerhead.conf, does not for that reason.
MACHINE_FEATURES = "kernel26 apm alsa bluetooth gps usbgadget usbhost phone wifi vfat ext2 touchscreen nfc"
MACHINE_DISPLAY_WIDTH_PIXELS = "1920"
MACHINE_DISPLAY_HEIGHT_PIXELS = "1080"
MACHINE_DISPLAY_ORIENTATION = "0"
MACHINE_DISPLAY_PPI = "445"

PREFERRED_VERSION_android-headers-halium = "${@'16.0%' if d.getVar('HAMMERHEAD_ANDROID_SYSTEM') == 'gsi' else '9.0%'}"

# Which Android the device boots: "device" is its own Halium 9 build, "gsi" is the
# 16.0 GSI with a vendor.img derived from that build (see
# android-system-image-legacy-gsi.inc). The headers follow the GSI, not the
# vendor, for the reason spelled out in tissot-halium.conf.
HAMMERHEAD_ANDROID_SYSTEM ?= "device"
VIRTUAL-RUNTIME_android-system-image = "android-system-image-hammerhead-halium${@'-gsi' if d.getVar('HAMMERHEAD_ANDROID_SYSTEM') == 'gsi' else ''}"
HALIUM_LEGACY_GSI = "${@'1' if d.getVar('HAMMERHEAD_ANDROID_SYSTEM') == 'gsi' else '0'}"

PREFERRED_PROVIDER_virtual/xserver = "xserver-xorg"
XSERVER = " \
    xserver-xorg \
    xf86-input-evdev \
    xf86-video-fbdev \
"

# We need fsck.vfat for vfat partitions we need to mount
# Also, include the wlan module for the kernel
MACHINE_EXTRA_RDEPENDS = " \
    android-kernel-bootimg \
    dosfstools \
    kernel-module-bcmdhd \
"

# For Nexus 5, we need to build the dtb together with the zImage
KERNEL_IMAGETYPE = "zImage-dtb"
IMAGE_FSTYPES += "tar.gz"
IMAGE_ROOTFS_EXTRA_SPACE = "200000"

ANDROID_BOARD_BOOTIMAGE_PARTITION = "/dev/block/mmcblk0p19"
ANDROID_BOARD_SYSTEMIMAGE_PARTITION_SIZE = "1073741824"
ANDROID_BOARD_FLASH_BLOCK_SIZE = "131072"

SERIAL_CONSOLE = "115200 ttyHSL0"

require conf/machine/include/arm/armv7a/tune-cortexa8.inc

# 8 MP on the back, 1.3 MP on the front. camera-front is what makes
# packagegroup-luneos-extended install luneos-faced, and the pair is what
# installs the camera app.
MACHINE_FEATURES += "camera-rear camera-front"

# Sharing the host's network namespace ("ipc user net") lets netmgrd configure rmnet0.. and qcril
# bring up a mobile data call (a PDP context becomes active, with an address and DNS), but on the
# hammerhead the downlink then carries no traffic yet and network registration stayed at "searching"
# on 3 of 4 boots, against none without it. Default is therefore to leave it off; set
# ANDROID_LXC_KEEP_NS = "ipc user net" to experiment with mobile data.
#ANDROID_LXC_KEEP_NS = "ipc user net"
