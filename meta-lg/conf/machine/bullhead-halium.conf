#-----------------------------------------------------------------------------
#@TYPE: Machine
#@NAME: LG Nexus 5X (codename bullhead)
#@DESCRIPTION: Machine configuration for the LG Nexus 5X (Halium, 16.0 GSI)
#-----------------------------------------------------------------------------

# The Nexus 5X launched on Android 6 and never got a vendor partition. It runs the
# arm64 16.0 GSI with a vendor.img derived from the LineageOS 21 build of
# github.com/nexus5x-dev (see android-system-image-bullhead-halium.bb), the way
# hammerhead-halium does with its Halium 9 build. Unlike hammerhead there is no
# "device" (own Halium build) variant: nothing but the GSI path exists for this
# machine.

require conf/machine/include/arm/arch-arm64.inc
require conf/machine/include/meta-android-halium.inc

PREFERRED_PROVIDER_virtual/kernel ?= "linux-lg-bullhead-halium"
MACHINE_KERNEL_PR = "r0"

# NFC is an NXP PN548 (the vendor ships nfc_nci.bullhead.so and libnfc-nxp.conf),
# the fingerprint reader an FPC1020 on SPI (fingerprint.bullhead.so, the fpc1020
# nodes init.bullhead.rc sets up). Neither has been tried under LuneOS.
MACHINE_FEATURES = "apm alsa bluetooth gps usbgadget usbhost phone wifi vfat ext2 touchscreen nfc"
MACHINE_FEATURES += "fingerprint"

# The JDI panel of the kernel's device tree is 1080x1920 at 65 x 115 mm
# (qcom,mdss-pan-physical-{width,height}-dimension in dsi-panel-jd35695b-1080p-cmd.dtsi
# and dsi-panel-jdi-fhd-video.dtsi), which is 422 and 424 pixels per inch on the two
# axes. Not checked against a real device.
MACHINE_DISPLAY_WIDTH_PIXELS = "1080"
MACHINE_DISPLAY_HEIGHT_PIXELS = "1920"
MACHINE_DISPLAY_ORIENTATION = "0"
MACHINE_DISPLAY_PPI = "423"

# Tracks the GSI, not the vendor, for the reason spelled out in tissot-halium.conf.
PREFERRED_VERSION_android-headers-halium = "16.0%"

# The droid modules talk to the vendor's audio HAL, so they follow the vendor: this
# one is Android 14 (audio HAL 6.0, android.hardware.audio.service), which is the
# modern tree, as for sargo and halium-arm64. Not tried on the device.
PREFERRED_VERSION_pulseaudio-modules-droid = "17.0.103%"

VIRTUAL-RUNTIME_android-system-image = "android-system-image-bullhead-halium"
ANDROID_HEADERS_DEFINES = "QCOM_BSP QTI_BSP QCOM_HARDWARE"

PREFERRED_PROVIDER_virtual/xserver = "xserver-xorg"
XSERVER = " \
    xserver-xorg \
    xf86-input-evdev \
    xf86-video-fbdev \
"

# The kernel has no loadable modules (CONFIG_MODULES is off in its defconfig, and
# the qcacld-2.0 Wi-Fi driver is built in), so there is no wlan module to name here.
MACHINE_EXTRA_RDEPENDS = " \
    android-kernel-bootimg \
    dosfstools \
"

KERNEL_IMAGETYPE = "Image.gz-dtb"
IMAGE_FSTYPES += "tar.gz"
IMAGE_ROOTFS_EXTRA_SPACE = "200000"

# A 3.10 kernel: no metadata_csum, orphan_file or 64bit on an ext4 it has to mount.
EXTRA_IMAGECMD:ext4:forcevariable = "-i 4096 -O ^64bit,^metadata_csum,^metadata_csum_seed,^orphan_file"

# From the LineageOS device tree (BoardConfig.mk, rootdir/etc/fstab.bullhead):
# boot by name on the eMMC controller, BOARD_SYSTEMIMAGE_PARTITION_SIZE and
# BOARD_FLASH_BLOCK_SIZE.
ANDROID_BOARD_BOOTIMAGE_PARTITION = "/dev/block/platform/soc.0/f9824900.sdhci/by-name/boot"
ANDROID_BOARD_SYSTEMIMAGE_PARTITION_SIZE = "3221225472"
ANDROID_BOARD_FLASH_BLOCK_SIZE = "131072"

SERIAL_CONSOLE = "115200 ttyHSL0"

# A rear and a front camera (camera HAL camera.msm8992.so, 32-bit only:
# BOARD_QTI_CAMERA_32BIT_ONLY). camera-front is what installs luneos-faced, and the
# pair is what installs the camera app. Not tried.
MACHINE_FEATURES += "camera-rear camera-front"
