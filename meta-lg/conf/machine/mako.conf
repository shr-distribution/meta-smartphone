#-----------------------------------------------------------------------------
#@TYPE: Machine
#@NAME: LG Nexus 4 (codename mako)
#@DESCRIPTION: Machine configuration for the LG Nexus 4 on a mainline
#              APQ8064 kernel. No Halium, no Android container.
#-----------------------------------------------------------------------------

TARGET_ARCH = "arm"

PREFERRED_PROVIDER_virtual/kernel ?= "linux-lg-mako"
MACHINE_KERNEL_PR = "r0"

# No "keyboard" (a slab) and no "fingerprint" - the Nexus 4 predates Nexus
# Imprint and has no sensor.
#
# No "nfc", although the hardware IS there (BCM2079x). NFC_RDEPENDS is nfcd plus
# nfcd-binder-plugin, which reach the Android NFC HAL over binder, and this
# mainline machine has no Android container for them to talk to. Same reasoning
# hammerhead.conf gives. Declare it again once something drives the kernel NFC
# netlink interface directly.
MACHINE_FEATURES = "kernel26 apm alsa bluetooth gps usbgadget usbhost phone wifi vfat ext2 touchscreen"
MACHINE_DISPLAY_WIDTH_PIXELS = "768"
MACHINE_DISPLAY_HEIGHT_PIXELS = "1280"
MACHINE_DISPLAY_ORIENTATION = "0"
MACHINE_DISPLAY_PPI = "318"

PREFERRED_PROVIDER_virtual/libgl ?= "mesa"
PREFERRED_PROVIDER_virtual/libgbm ?= "mesa"
PREFERRED_PROVIDER_virtual/egl ?= "mesa"
PREFERRED_PROVIDER_virtual/mesa ?= "mesa"
PREFERRED_PROVIDER_virtual/libgles1 ?= "mesa"
PREFERRED_PROVIDER_virtual/libgles2 ?= "mesa"
PREFERRED_PROVIDER_libgbm ?= "mesa"

# Not using Halium, it's a mainline kernel
VIRTUAL-RUNTIME_android-initramfs-scripts = "initramfs-scripts-android"

PREFERRED_PROVIDER_virtual/xserver = "xserver-xorg"
XSERVER = " \
    xserver-xorg \
    xf86-input-evdev \
    xf86-video-fbdev \
"

# We need fsck.vfat for vfat partitions we need to mount
# Also, include the wlan module for the kernel
MACHINE_EXTRA_RDEPENDS = " \
    android-kernel-bootimg \
    firmware-lg-mako \
    linux-firmware-qcom-adreno-a3xx \
    kernel-modules \
    dosfstools \
"

KERNEL_IMAGETYPE = "zImage"
KERNEL_DEVICETREE = "qcom/qcom-apq8064-lg-nexus4-mako.dtb"
IMAGE_FSTYPES += "tar.gz"
IMAGE_ROOTFS_EXTRA_SPACE = "200000"

ANDROID_BOARD_BOOTIMAGE_PARTITION = "/dev/block/mmcblk0p6"
ANDROID_BOARD_SYSTEMIMAGE_PARTITION_SIZE = "880803840"
ANDROID_BOARD_FLASH_BLOCK_SIZE = "131072"

SERIAL_CONSOLE = "115200 ttyMSM2"

require conf/machine/include/arm/armv7a/tune-cortexa8.inc

# 8 MP on the back and 1.3 MP on the front, but no camera feature is declared:
# the mainline device tree describes no sensor, CSI or CAMSS path for either, so
# the camera app and face unlock (camera-front pulls in luneos-faced and
# TensorFlow Lite) would have nothing to talk to. Declare camera-rear and
# camera-front again once sensors are described in the device tree.
