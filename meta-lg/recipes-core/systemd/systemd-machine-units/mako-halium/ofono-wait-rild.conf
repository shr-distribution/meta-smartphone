[Service]
# rild-wait.sh starts rild once rmnet_usb has bound the modem, about 30 s into the boot, close to when
# ofono starts; the default 30 s wait for IRadio/slot1 is too tight for that. The settle time is
# hammerhead's (ofono-settle.conf there): the same Qualcomm qcril, still bringing the modem up for a
# few seconds after the slot registers. See ofono-binder-wait.sh.
Environment=OFONO_BINDER_WAIT_TIMEOUT=60
Environment=OFONO_BINDER_WAIT_SETTLE=12
