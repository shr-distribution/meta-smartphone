# webos_deploy.sh unpacks the rootfs into /data/luneos, so what the init has to
# mount is the stock userdata partition; mount_root_partition then finds
# $SDCARD_DIR/luneos and bind-mounts it as the root.
#
# By label rather than mmcblk0p23: on a mainline kernel the eMMC does not have to
# enumerate as mmcblk0, and mdev-partlabel.sh creates /dev/disk/by-partlabel/*
# during coldplug regardless.
sdcard_partition="userdata"

# Fallback only, used when no /data/luneos is present.
system_partition="disk/by-partlabel/system"
