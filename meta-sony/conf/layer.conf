# We have a conf and classes directory, append to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a recipes directory, add to BBFILES
BBFILES += "${LAYERDIR}/recipes*/*/*.bb ${LAYERDIR}/recipes*/*/*.bbappend"

BBFILE_COLLECTIONS += "sony-layer"
BBFILE_PATTERN_sony-layer := "^${LAYERDIR}/"
BBFILE_PRIORITY_sony-layer = "7"

LAYERDEPENDS_sony-layer = "core openembedded-layer android-layer"

LAYERSERIES_COMPAT_sony-layer = "wrynose"
