#-----------------------------------------------------------------------------
#@TYPE: Machine
#@NAME: Sony Xperia XA2 (codename pioneer)
#@DESCRIPTION: Machine configuration for the Sony Xperia XA2 (H3113/H3123/H3133 single-SIM, H4113/H4133 dual-SIM), SDM630
#
# Ganges platform (nile-common in LineageOS), Qualcomm SDM630, Adreno 508.
# A/B, recovery-as-boot, no super partition. Tier B: the 4.19 kernel is
# LineageOS/android_kernel_sony_sdm660, and the vendor is the phone's own
# LineageOS vendor (24.0 / Android 17 first, 23.2 / Android 16 as the fallback).
#-----------------------------------------------------------------------------

require conf/machine/include/arm/arch-arm64.inc
require conf/machine/include/meta-android-halium.inc

PREFERRED_PROVIDER_virtual/kernel ?= "linux-sony-pioneer"
MACHINE_KERNEL_PR = "r0"

# The kernel is built with Clang (see its recipe); make-mod-scripts and the
# out-of-tree modules (v4l2loopback) have to be too, see
# kernel-clang-toolchain.bbclass.
KERNEL_TOOLCHAIN = "clang"
INHERIT += "kernel-clang-toolchain"

# NFC (NXP, nq-nci), rear fingerprint reader in the power key, FM radio,
# single rear 23 MP and front 8 MP camera. No "esim".
MACHINE_FEATURES = "apm alsa bluetooth gps usbgadget usbhost phone wifi vfat ext2 touchscreen nfc fingerprint"

# 5.2" 1080x1920 (16:9). sqrt(1080^2+1920^2)/5.2 = 424 ppi.
# nile-common buckets this as TARGET_SCREEN_DENSITY ?= 420.
MACHINE_DISPLAY_WIDTH_PIXELS = "1080"
MACHINE_DISPLAY_HEIGHT_PIXELS = "1920"
MACHINE_DISPLAY_ORIENTATION = "0"
MACHINE_DISPLAY_PPI = "424"

# Tracks the GSI generation (halium-luneos-gsi-16.inc, via halium-gsi-image), not the
# vendor - libhybris gates its per-generation support on ANDROID_VERSION_MAJOR
# from this package. This stays 16.0 even on the Android 17 vendor.
PREFERRED_VERSION_android-headers-halium = "16.0%"

# Treble-era GSI, so the "modern" droid modules.
PREFERRED_VERSION_pulseaudio-modules-droid = "17.0.103%"

# No Android system image in the rootfs: pioneer runs the universal halium-arm64
# rootfs, and the pinned 16.0 GSI travels next to it on userdata as
# android-rootfs.img (halium-gsi-image deploys it; the q25 pattern). The 16.0
# GSI is OLDER than the LineageOS 24.0 (Android 17) vendor - no port had run
# that combination before pioneer. The fallback is the LineageOS 23.2
# (Android 16) vendor, which runs the same kernel commit.
VIRTUAL-RUNTIME_android-system-image = ""

PREFERRED_PROVIDER_virtual/xserver = "xserver-xorg"
XSERVER = " \
    xserver-xorg \
    xf86-input-evdev \
    xf86-video-fbdev \
"

# NOTE: pioneer boots the universal halium-arm64 rootfs, which is built with
# MACHINE=halium-arm64, so nothing in MACHINE_EXTRA_RDEPENDS here reaches the
# device: not android-kernel-bootimg, dosfstools or v4l2loopback below. Anything
# pioneer really needs at runtime has to come from the halium-arm64 side.
#
# fsck.vfat for the vfat firmware partitions the container mounts out of
# fstab.qcom.
MACHINE_EXTRA_RDEPENDS = " \
    android-kernel-bootimg \
    dosfstools \
"

# BOARD_KERNEL_IMAGE_NAME := Image.gz-dtb in nile-common: one appended dtb
# (sdm630-ganges-pioneer, the only one MACH_SONY_PIONEER enables), no dtbo.
KERNEL_IMAGETYPE = "Image.gz-dtb"
IMAGE_FSTYPES += "tar.gz"
IMAGE_ROOTFS_EXTRA_SPACE = "200000"

# A/B, Qualcomm by-name links. Read only by luneos-package's recovery-zip
# updater-script. android-kernel-bootimg ignores it (it looks for
# boot/boot_a under /dev/disk, so it would write boot_a even when the phone
# runs from _b, as the measured unit does), and it is not in the halium-arm64
# rootfs anyway (see MACHINE_EXTRA_RDEPENDS). The flash kit writes both slots.
ANDROID_BOARD_BOOTIMAGE_PARTITION = "/dev/block/bootdevice/by-name/boot_a"
# BOARD_SYSTEMIMAGE_PARTITION_SIZE / BOARD_FLASH_BLOCK_SIZE from
# device/sony/nile-common/BoardConfigCommon.mk
ANDROID_BOARD_SYSTEMIMAGE_PARTITION_SIZE = "3036676096"
ANDROID_BOARD_FLASH_BLOCK_SIZE = "262144"

# sdm660 family: msm_serial registers ttyMSM. UNVERIFIED on hardware - a retail
# XA2 exposes no debug UART. pstore/ramoops (Sony's common.config) and the USB
# gadget are the real debug channels.
SERIAL_CONSOLE = "115200 ttyMSM0"

MACHINE_FEATURES += "camera-rear camera-front"

# v4l2loopback: kernel half of droidcam2v4l2; only nameable on a machine that
# builds its own kernel.
MACHINE_EXTRA_RDEPENDS += "v4l2loopback"
