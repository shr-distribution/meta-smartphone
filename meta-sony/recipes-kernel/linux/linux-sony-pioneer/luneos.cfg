# LuneOS / Halium kernel config delta — Sony Xperia XA2 (pioneer, SDM630)
#
# Merged on top of the three fragments LineageOS selects in
# device/sony/pioneer/BoardConfig.mk (TARGET_KERNEL_CONFIG):
#   vendor/sdm660-perf_defconfig + vendor/sony/common.config + vendor/sony/pioneer.config
# from LineageOS/android_kernel_sony_sdm660 (lineage-23.2 == lineage-24.0, 4.19.325).
#
# Modelled on athena's fragment (meta-blackberry), the other SDM660-family 4.19
# port. What Sony's common.config already provides is NOT repeated here:
# INITRAMFS_IGNORE_SKIP_FLAG (recovery-as-boot A/B device: the bootloader passes
# skip_initramfs), PSTORE_RAM + PSTORE_CONSOLE (ramoops, the crash channel athena
# lacked), the appended-dtb Image.gz-dtb, and a built-in qcacld-3.0 (no wlan.ko to
# CRC-match).
#
# NOTE: do NOT write bare "# CONFIG_FOO=y" in comments in this file.
# scripts/kconfig/merge_config.sh matches ^(# )?CONFIG_[A-Za-z0-9_][= ] and
# treats such a line as a directive. Reference symbols without the CONFIG_ prefix.

# ---------------------------------------------------------------------------
# 1. mer-kernel-check ERRORS — hard requirements
# ---------------------------------------------------------------------------

# systemd: name_to_handle_at()/open_by_handle_at(), used by the mount monitor
CONFIG_FHANDLE=y

# systemd and the Halium initrd both require a kernel-populated /dev
CONFIG_DEVTMPFS=y
CONFIG_DEVTMPFS_MOUNT=y

# Virtual console, for the console and VT switching.
CONFIG_VT=y
CONFIG_VT_CONSOLE=y
CONFIG_CONSOLE_TRANSLATIONS=y
CONFIG_UNIX98_PTYS=y

# UTF-8 filenames
CONFIG_NLS_UTF8=y

# Stock sets STATIC_USERMODEHELPER with an empty path, which disables every
# call_usermodehelper(): request_module(), core dumps, the firmware fallback.
# CONFIG_STATIC_USERMODEHELPER is not set

# The initramfs's mdev writes /sys/kernel/uevent_helper; without it late
# hotplug events are lost.
CONFIG_UEVENT_HELPER=y
CONFIG_UEVENT_HELPER_PATH=""

# SysV IPC is NOT needed by LuneOS (kernel-porting.md § The config delta), so it
# is left at whatever the defconfig says and IPC_NS is not requested; the
# shared LXC config keeps the IPC namespace.

# ---------------------------------------------------------------------------
# 2. Namespaces — required by the LXC Android container
# ---------------------------------------------------------------------------
CONFIG_NAMESPACES=y
CONFIG_UTS_NS=y
CONFIG_PID_NS=y
CONFIG_USER_NS=y
CONFIG_NET_NS=y
CONFIG_CHECKPOINT_RESTORE=y

# ---------------------------------------------------------------------------
# 3. cgroups — LXC device whitelisting + systemd resource control
# ---------------------------------------------------------------------------
CONFIG_CGROUPS=y
CONFIG_CGROUP_DEVICE=y
CONFIG_CGROUP_FREEZER=y
CONFIG_CGROUP_SCHED=y
CONFIG_CGROUP_CPUACCT=y
CONFIG_CGROUP_PERF=y
CONFIG_CGROUP_NET_PRIO=y
CONFIG_NET_CLS_CGROUP=y
CONFIG_BLK_CGROUP=y
CONFIG_MEMCG=y
CONFIG_MEMCG_SWAP=y
CONFIG_CPUSETS=y

# ---------------------------------------------------------------------------
# 4. systemd optional-but-recommended
# ---------------------------------------------------------------------------
CONFIG_FANOTIFY=y
CONFIG_FANOTIFY_ACCESS_PERMISSIONS=y
CONFIG_AUTOFS4_FS=y
CONFIG_SECURITY_YAMA=y
CONFIG_TMPFS_XATTR=y
CONFIG_TMPFS_POSIX_ACL=y
CONFIG_SECCOMP=y

# SELinux stays built and enabled: pass only androidboot.selinux=permissive,
# never selinux=0 (kernel-porting.md § selinux=0; on athena's 4.19 it made every
# block-backed mount return ENOENT). BOOTPARAM keeps selinux= usable for A/B tests.
CONFIG_SECURITY_SELINUX=y
CONFIG_SECURITY_SELINUX_DEVELOP=y
CONFIG_SECURITY_SELINUX_BOOTPARAM=y

# ---------------------------------------------------------------------------
# 5. Bluetooth — bluebinder talks to the container HAL over a virtual HCI
# ---------------------------------------------------------------------------
CONFIG_BT=y
CONFIG_BT_HCIVHCI=y
CONFIG_BT_RFCOMM=y
CONFIG_BT_RFCOMM_TTY=y
CONFIG_BT_BNEP=y
CONFIG_BT_BNEP_MC_FILTER=y
CONFIG_BT_BNEP_PROTO_FILTER=y
CONFIG_BT_HIDP=y
CONFIG_RFKILL=y

# HID: BT keyboards/mice via hidraw, and uinput
CONFIG_HIDRAW=y
CONFIG_UHID=y
CONFIG_INPUT_UINPUT=y

# ---------------------------------------------------------------------------
# 6. Waydroid / nested containers
# ---------------------------------------------------------------------------
CONFIG_SQUASHFS=y
CONFIG_SQUASHFS_XATTR=y
CONFIG_SQUASHFS_XZ=y
CONFIG_SQUASHFS_ZLIB=y
CONFIG_VETH=y
CONFIG_TUN=y
CONFIG_NETFILTER_XT_TARGET_CHECKSUM=y
CONFIG_BRIDGE=y

# ---------------------------------------------------------------------------
# 7. Storage / misc
# ---------------------------------------------------------------------------
CONFIG_BLK_DEV_LOOP=y
CONFIG_BLK_DEV_NBD=y
CONFIG_FUSE_FS=y
CONFIG_CUSE=y
CONFIG_IKCONFIG=y
CONFIG_IKCONFIG_PROC=y

# ---------------------------------------------------------------------------
# 8. Deliberate values that differ from mer-kernel-check's advice
# ---------------------------------------------------------------------------
# DUMMY: kept =y to match stock; Android's netd expects dummy0.
CONFIG_DUMMY=y

# FW_LOADER_USER_HELPER: kept at the stock value (athena, mindphone).
CONFIG_FW_LOADER_USER_HELPER=y
CONFIG_FW_LOADER_USER_HELPER_FALLBACK=y

# ---------------------------------------------------------------------------
# 9. Bring-up debug channels
# ---------------------------------------------------------------------------
# netconsole over the USB gadget network (nc -ul 6666 on the host). Safe on this
# Tier B kernel only while no prebuilt vendor network module loads: qcacld-3.0
# is built in (common.config), so nothing CRC-sensitive sits on struct net_device.
# RE-CHECK if the device survey finds .ko files under /vendor/lib/modules.
CONFIG_NETCONSOLE=y
CONFIG_NETCONSOLE_DYNAMIC=y

# ACM serial console on the debug gadget (/dev/ttyGS0); athena's defconfig
# lacked it and the function silently never appeared.
CONFIG_USB_CONFIGFS_ACM=y

# Framebuffer console: did nothing on athena (mdss fb, same family); kept for a
# cheap retry, do not rely on the panel as a debug channel.
CONFIG_FRAMEBUFFER_CONSOLE=y
CONFIG_FRAMEBUFFER_CONSOLE_DETECT_PRIMARY=y
CONFIG_FONT_SUPPORT=y
CONFIG_FONT_8x16=y

# ---------------------------------------------------------------------------
# 10. Staying inside the kernel size proven on this bootloader
# ---------------------------------------------------------------------------
# The shipped LineageOS 24.0 Image.gz-dtb is 19,927,413 B and already runs 3 MB
# past its own ramdisk address; xboot copes, but nothing larger has been shown
# to boot. With this fragment the bitbake build came out at 20,148,609 B, 221 KB
# over, and the recipe's do_deploy check refused it.
#
# IKHEADERS embeds an xz tarball of the kernel headers for Android's eBPF
# tooling. LuneOS does not use it, and being xz already it does not shrink in
# Image.gz - the largest single lever (boot-images.md § The kernel/ramdisk
# window). IKCONFIG stays: /proc/config.gz is how the running config is checked.
# CONFIG_IKHEADERS is not set

# ---------------------------------------------------------------------------
# 11. LSE atomics: deliberately NOT touched
# ---------------------------------------------------------------------------
# athena turns them off because its reference ROM's clang marked the assembler
# broken and never enabled them. Here the reference is the opposite: the
# shipping LineageOS 24.0 kernel (Android clang 22.0.2) has ARM64_LSE_ATOMICS
# on, read out of its IKCONFIG. Diffing our merged .config against that IKCONFIG
# left this as the only difference the fragment did not ask for, so the
# defconfig's value stands. Rule (kernel-porting.md § LSE atomics): match the
# reference ROM *for this device*, not another device's.
