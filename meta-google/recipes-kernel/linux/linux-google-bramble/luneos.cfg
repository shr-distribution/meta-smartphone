# LuneOS/Halium config delta for bramble (Pixel 4a 5G, SM7250/lito).
#
# READ THIS BEFORE ADDING A LINE.
#
# Unlike every other Tier B device here, this fragment is not "what LuneOS
# needs" - it is "what LuneOS needs that does not move an exported symbol's
# CRC". redbull_defconfig sets CONFIG_MODVERSIONS=y and the device loads 329
# stock modules from the untouched vendor_boot, including its UFS, clock,
# pinctrl and display drivers. An option that changes a core struct makes all
# of them refuse to load, and this device does not have storage without them.
#
# The omissions are the point, so they are listed first:
#
#   CONFIG_IPC_NS                   poison on bluejay's KMI, and only needed to
#                                   *unshare* IPC, which LXC can be told not to
#                                   do (lxc.namespace.keep = ipc user).
#   CONFIG_FANOTIFY                 poison on bluejay's KMI (1214 symbols).
#                                   systemd runs without it.
#   CONFIG_NET_L3_MASTER_DEV        poison on bluejay's KMI.
#
# MEASURED on this KMI, 22 Sep 2026, not assumed: with the whole delta below
# applied on top of a config that matches the shipped kernel (see
# stockmatch.cfg), kmi-crc-check reports **218 modules checked, 0 would fail to
# load** - the same score as the stock-config baseline. So every option here,
# CONFIG_SYSVIPC included, is KMI-clean on 4.19/redbull, and the three omissions
# above are inherited caution from bluejay rather than a demonstrated need.
# Re-run the gate (the recipe header says how) after touching this file.
#
# Everything below was KMI-clean on bluejay (zero drift, 201/203 modules still
# loading) and is the same set panther reused unchanged.

# systemd will not start without name_to_handle_at(); stock says
# "# CONFIG_FHANDLE is not set".
CONFIG_FHANDLE=y

# udev populates /dev; Android leaves that to ueventd.
CONFIG_DEVTMPFS=y
CONFIG_DEVTMPFS_MOUNT=y

# LXC. NAMESPACES, NET_NS and UTS_NS are already on in stock; PID_NS is not,
# and it was explicitly re-tested on bluejay as KMI-clean (round 4 of the
# bisect put it back with zero drift).
CONFIG_PID_NS=y
CONFIG_USER_NS=y
CONFIG_CGROUP_DEVICE=y

# A text console on /dev/tty0 - "# CONFIG_VT is not set" in stock.
CONFIG_VT=y
CONFIG_VT_CONSOLE=y

# systemd's mount machinery and label storage. 4.19 still spells autofs as
# AUTOFS4_FS.
CONFIG_AUTOFS4_FS=y
CONFIG_TMPFS_XATTR=y
CONFIG_TMPFS_POSIX_ACL=y

# An escape hatch for bisecting ONE driver by hand, not a strategy. Forcing a
# module whose struct layouts really moved corrupts memory, and on this device
# the modules in question are the storage stack - see the recipe header.
CONFIG_MODULE_FORCE_LOAD=y

#-----------------------------------------------------------------------------
# CONFIG_SYSVIPC stays off, and the patch that used to make it survivable is
# gone with it.
#
# It was not optional until 15 Sep 2026: libPmLogLib.so called shmget()/
# shmat(), so with SysV IPC off every PmLogCtl blocked forever on
# com.webos.pmlogd. surface-manager.sh calls PmLogCtl on its first line, above
# any logging of its own, so the symptom was a black screen with nothing in the
# journal (measured on MP01, 15 Sep 2026).
#
# PmLog now uses POSIX shared memory: libPmLogLib imports only
# shm_open@GLIBC_2.34, and a scan of the rootfs finds no SysV import on the
# LuneOS boot path. So the option goes off, and
# 0001-sched-keep-CONFIG_SYSVIPC-out-of-the-ABI-genksyms-co.patch - which hid
# the two task_struct members under #ifndef __GENKSYMS__ because this tree has
# only slot 8 free and needs three - is deleted rather than carried.
#
# This is the device where that matters most: enabling it normally moves every
# CRC (344 of 344 stock modules refused to load on MP01), and here the casualty
# would be the storage stack from the untouched vendor_boot. Now nothing in the
# fragment touches task_struct at all.
#
# Before re-enabling it on some future rootfs, check first:
#   readelf --dyn-syms /usr/lib/libPmLogLib.so.3.3.0 | grep -E 'shm|sem'
#
# IPC_NS stays off as before: it depends on SYSVIPC, and LXC can be told not to
# unshare IPC (lxc.namespace.keep = ipc user).
#-----------------------------------------------------------------------------
# CONFIG_SYSVIPC is not set
