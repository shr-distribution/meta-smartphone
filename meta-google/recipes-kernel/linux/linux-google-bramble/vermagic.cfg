# Make our vermagic match what the LineageOS 23.2 vendor_boot modules demand.
#
# All 221 modules in that build's vendor_boot ramdisk ask for:
#
#   vermagic=4.19.325-cip135-st19-ga0096400123a SMP preempt mod_unload modversions aarch64
#
# Three of those parts come for free from the pinned SRCREV: "4.19.325" is the
# Makefile's SUBLEVEL, and "-cip135" and "-st19" are the localversion-cip and
# localversion-st files in the tree, which scripts/setlocalversion collects on
# its own. Only the "-ga0096400123a" has to be stated, because kbuild would
# otherwise derive it from a git checkout an OE build does not reliably have.
#
# LOCALVERSION_AUTO off, and the recipe truncates .scmversion, for the same
# reason: with AUTO off setlocalversion still appends a bare "+" when the tree
# looks like a dirty git checkout - which ours is, the moment do_patch applies
# the SYSVIPC patch - and one character is enough to miss the match.
#
# This matters more here than on most devices. bramble's storage drivers live in
# the vendor_boot ramdisk, so a vermagic mismatch is not a lost feature, it is a
# device that cannot find its own rootfs.
CONFIG_LOCALVERSION="-ga0096400123a"
# CONFIG_LOCALVERSION_AUTO is not set
