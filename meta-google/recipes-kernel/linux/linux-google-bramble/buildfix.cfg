# Config this tree needs in order to build here at all, as opposed to config
# LuneOS wants. Kept separate from luneos.cfg because the recipe's
# LUNEOS_KERNEL_FRAGMENT = "0" switch exists to build the *stock* baseline - the
# thing you compare CRCs against before blaming your own delta - and a baseline
# that does not compile is no use. This file is merged either way.

# Nothing is disabled here any more.
#
# This file used to carry "# CONFIG_INPUT_VD6281 is not set", because at the
# stock revision this recipe was pinned to (7b0944645172) techpack/ held only
# Kbuild and stub/ - the camera, display, video and audio subtrees are separate
# repos in Google's manifest - and vd6281_module.c fails to compile without
# techpack/camera/include/uapi/media/cam_sensor.h.
#
# LineageOS's lineage-23.2 tree, which this recipe now follows, has
# techpack/{audio,camera,dataipa,display,video} populated in the kernel repo
# itself. So vd6281 builds, and so do the three other modules the stock revision
# could not produce: msm_drm.ko (display), msm-vidc.ko and the fts touch driver.
# That closes the gap between what we build and the 221 modules LineageOS ships.
#
# Kept as a file rather than deleted so the next person who wonders why a
# techpack module will not build has the answer in one place.
