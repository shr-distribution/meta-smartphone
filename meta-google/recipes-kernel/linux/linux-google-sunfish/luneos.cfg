# LuneOS/Halium config delta for sunfish (Google Pixel 4a, SM7125).
#
# Applied on top of arch/arm64/configs/sunfish_defconfig, which is an Android
# defconfig and therefore omits things a general-purpose Linux userspace takes
# for granted. Every line below is something that defconfig either turns off
# explicitly or leaves at a default LuneOS cannot live with; nothing here is a
# preference.
#
# Deliberately short. The UBports and Droidian "required config" lists are
# longer, and most of what they add is already on in this tree (SECCOMP, TUN,
# BRIDGE, OVERLAY_FS, ANDROID_BINDERFS, VETH, F2FS, EXT4 with ACLs and
# security xattrs). Options that are already right are left alone so that the
# diff against stock stays readable.
#
# Note on CRCs: this tree sets CONFIG_MODVERSIONS, and several symbols below
# (SYSVIPC, the namespaces) change structures the exported symbols carry, so
# the stock vendor .ko files will not match a kernel built with this fragment.
# That is accepted on a Tier B device - there is no KMI to preserve here - and
# is why MODULE_FORCE_LOAD is switched on at the end. See the module notes in
# linux-google-sunfish_git.bb.

# systemd will not start without name_to_handle_at(); the stock defconfig
# explicitly turns it off ("# CONFIG_FHANDLE is not set").
CONFIG_FHANDLE=y

# udev/systemd populate /dev themselves - Android leaves that to ueventd, so
# an Android defconfig has no reason to carry devtmpfs.
CONFIG_DEVTMPFS=y
CONFIG_DEVTMPFS_MOUNT=y

# SysV IPC is NOT optional on LuneOS, whatever an Android defconfig thinks:
# libPmLogLib.so used to call shmget()/shmat(), and without SysV IPC every
# PmLogCtl blocked forever waiting for com.webos.pmlogd. surface-manager.sh
# calls PmLogCtl on its first line, above any logging of its own, so the
# failure was a black screen with nothing in the journal (measured on MP01,
# 15 Sep 2026: five units dead on 90 s timeouts).
#
# PmLog moved to POSIX shared memory - libPmLogLib imports only
# shm_open@GLIBC_2.34 and nothing on the LuneOS boot path imports SysV IPC - so
# the option goes off and 0003-sched-keep-CONFIG_SYSVIPC-out-of-the-ABI-
# genksyms-co.patch is dropped rather than carried.
#
# It also takes one source of CRC drift out of the force-load story: SYSVIPC
# was the option that added sysvsem/sysvshm to task_struct. The namespaces
# below still move CRCs, so the stock modules still need force-loading - see
# the recipe - but one less struct is being reshaped.
#
# Check before ever re-enabling it:
#   readelf --dyn-syms /usr/lib/libPmLogLib.so.3.3.0 | grep -E 'shm|sem'
# CONFIG_SYSVIPC is not set

# LXC. The android container is unshared into its own namespaces, and
# CONFIG_PID_NS is off in the stock defconfig. IPC_NS depends on SYSVIPC, which
# is off above, so it goes too - it is only needed to *unshare* IPC, which LXC
# can be told not to do (lxc.namespace.keep = ipc user).
CONFIG_NAMESPACES=y
CONFIG_PID_NS=y
CONFIG_UTS_NS=y
CONFIG_NET_NS=y
CONFIG_USER_NS=y

# Kept, unlike FANOTIFY above, although it is also KMI-poison (118 of 164 sampled
# CRCs: SUBSYS(devices) bumps CGROUP_SUBSYS_COUNT, which dimensions arrays inside
# struct css_set and struct cgroup). It is kept because it does something real -
# 7 units in the shipped rootfs carry DeviceAllow=/DevicePolicy=, bluebinder and
# systemd-logind among them - and because dropping it buys nothing on its own:
# the CRC drift is a max over the poison options, not a sum, and even a fully
# CRC-clean build still fails 5 of LineageOS's 41 modules (wlan.ko included), so
# the vendor-module overlay is required either way. If it ever has to go, note
# that it cannot be hidden with the #ifndef __GENKSYMS__ trick the way a struct
# member can: it changes an array dimension in the MIDDLE of css_set/cgroup, so
# hiding it from genksyms would leave the CRC claiming an offset layout the
# kernel does not have.
CONFIG_CGROUP_DEVICE=y

# A text console on /dev/tty0. "# CONFIG_VT is not set" in stock, because
# Android has no use for one; with no VT there is nowhere for an early
# userspace message to land on a device with no accessible UART.
CONFIG_VT=y
CONFIG_VT_CONSOLE=y

# systemd's mount/automount machinery.
CONFIG_AUTOFS4_FS=y
CONFIG_TMPFS_XATTR=y

# FANOTIFY was set here, on the assumption systemd wants it. It does not, and it
# is the single worst option in this fragment for the KMI: it adds
# fanotify_listeners to struct user_struct, which struct cred points at and which
# nearly every core type reaches, so it moves 143 of 164 sampled exported-symbol
# CRCs on its own - as much as SYSVIPC did.
#
# Evidence it is not needed, in order of strength:
#   - bluejay, panther, tangorpro and mindphone boot the SAME halium-arm64 rootfs
#     with "# CONFIG_FANOTIFY is not set" (meta-android's shared GKI fragment
#     lists it as KMI-poison and leaves it out). Same systemd build, no fallout.
#   - scanning every file in the shipped rootfs for "fanotify" finds only syscall
#     name tables - strace, valgrind, gdb's syscalls/*.xml, libseccomp, libc's own
#     wrapper, perfetto - plus libsystemd-shared, which does not need the kernel
#     side to be present. No LuneOS component calls it.
#
# Where it came from: the Mer/SFOS kernel config checker, which lists
#     CONFIG_FANOTIFY    y,!    # optional, required for systemd readahead.
# and whose own notation says "!" = "Failure will be warned, not errored". Never a
# requirement, and systemd-readahead was removed upstream in v217 (2014) - this
# rootfs ships systemd 257 with no readahead unit or binary at all.
#
# STILL =y ON PURPOSE, pending one control test. sunfish is at a friend's house and
# the GKI devices are not a full-stack proof, so the check is being run on sargo,
# which has a complete working stack:
#     MACHINE=sargo bitbake -R <conf with LUNEOS_TEST_NO_FANOTIFY=1> linux-google-sargo
#   or, no rebuild needed, on a booted sargo:
#     staging/sargo-staging/check-fanotify-users.sh   (counts live fanotify fds)
# When that comes back clean, delete the line below and uncomment the one under it.
CONFIG_FANOTIFY=y
#   the replacement line, kept out of kconfig's reach until the test passes:
#   "# CONFIG_FANOTIFY is not set"

# Qualcomm's remote-debug driver. This was off while the kernel was built with
# GCC, because rdbg.c trips -Werror=designated-init (a positional initialiser for
# a struct carrying the 'designated_init' attribute) and the top Makefile adds
# that flag via cc-option, so CONFIG_CC_WERROR=n does not reach it.
#
# GCC only. clang has no -Werror=designated-init, so cc-option never adds it, and
# since this kernel moved to the tree's own clang r416183b the file compiles with
# no warning at all - measured by building drivers/char/rdbg.o on its own.
#
# It is back on because it is worth a module: rdbg.ko is the ONLY one of
# LineageOS's 41 vendor modules that this kernel did not build, and the
# vendor-module overlay can only override what it has. With this on, the overlay
# supplies all 41 and no prebuilt vendor module is loaded at all, which is what
# makes the __versions CRC drift against the vendor's modules a non-issue here
# (see the KMI note in the recipe). Measured KMI cost of this option: zero CRCs
# move.
CONFIG_MSM_RDBG=m

# LTO and CFI are deliberately LEFT AS sunfish_defconfig SETS THEM (both =y).
#
# An earlier revision turned them off to match the config the *stock Google*
# kernel carries in its IKCONFIG. That was the wrong reference: this device
# does not run Google's vendor, it runs LineageOS's - its /vendor starts
# vendor.lineage.health-service, vendor.lineage.livedisplay@2.0-service-sdm and
# vendor.lineage.touch@1.0-service.pixel - so the vendor modules we have to
# keep loadable were built by LineageOS from arch/arm64/configs/sunfish_defconfig
# in this very tree, which sets:
#
#   CONFIG_LTO_CLANG=y
#   CONFIG_CFI_CLANG=y
#
# Turning CFI off broke them outright, and the device said so:
#
#   snd_event_dlkm: Unknown symbol __cfi_slowpath (err 0)
#   swr_dlkm: Unknown symbol __cfi_slowpath (err 0)
#
# __cfi_slowpath only exists in a CFI kernel, so a module referencing it was
# compiled against one. Audio (the whole techpack DLKM stack), wifi (wlan.ko)
# and the sensor path all ride on those modules, which is exactly the list of
# things that did not work.
#
# Note this file therefore says nothing about LTO or CFI at all - the defconfig
# is the authority. Keeping the kernel within the boot window is handled where
# it belongs, on the ramdisk load address in the recipe.

# Do not treat every compiler warning as an error.
#
# sunfish_defconfig sets CONFIG_CC_WERROR=y, and the top Makefile turns that
# into a blanket "KBUILD_CFLAGS += -Werror" (twice, lines 735 and 739 - a merge
# artifact). The vendor set it for the Clang they shipped in 2020; this tree is
# built with OE's GCC, which is many releases newer and warns about things that
# compiler did not:
#
#   arch/arm64/kernel/process.c:202  -Werror=format=
#   security/pfe/pfk_ice.c:155       -Werror=misleading-indentation
#   kernel/profile.c:346,383,413     -Werror=address
#   kernel/sched/core.c:6629         -Werror=address
#
# None of those is a bug in this kernel - "the address of prof_cpu_mask will
# never be NULL" is a true statement about code that has been shipping for a
# decade - and patching each site is the six-round treadmill mindphone went
# through. Kconfig has CC_WERROR "default n" (lib/Kconfig.debug 2121), so
# turning it off restores the upstream default; the targeted
# -Werror=implicit-int, -Werror=strict-prototypes and
# -Werror=incompatible-pointer-types the Makefile adds unconditionally stay on,
# and those are the ones that catch real breakage.
#
# bramble keeps its CC_WERROR: it builds with the Clang the tree was written
# for, so the vendor's setting means there what it was meant to mean.
# CONFIG_CC_WERROR is not set

# The 32-bit vDSO, which the stock defconfig turns on and this build cannot
# produce. arch/arm64/Makefile hard-errors under CONFIG_COMPAT_VDSO unless
# CROSS_COMPILE_ARM32 names a real 32-bit ARM compiler:
#
#   arch/arm64/Makefile:75: *** CROSS_COMPILE_ARM32 not defined or empty,
#   the compat vDSO will not be built.  Stop.
#
# and it checks with "which $(CROSS_COMPILE_ARM32)$(cc-name)", so a triple
# alone will not do. There is no arm32 cross-gcc in this recipe's sysroot, and
# none on the host either. q25 and mp01 keep their compat vDSO by passing
# CROSS_COMPILE_COMPAT, but those build with LLVM=1, where clang needs only
# the triple and no GNU cross-binutils exist to be missing; this recipe builds
# with OE's aarch64 GCC, like sargo, tissot and mindphone - and mindphone's
# fragment turns the option off for exactly this reason.
#
# Kconfig has it "default n" with nothing selecting it (arch/arm64/Kconfig
# 1495), so switching it off here sticks. The cost is that 32-bit processes in
# the container get no vDSO and fall back to real syscalls for gettimeofday and
# clock_gettime - measurably slower in a tight loop, invisible otherwise, and
# there are 32-bit processes here: sunfish's vendor is a TARGET_2ND_ARCH := arm
# build.
# CONFIG_COMPAT_VDSO is not set

# Let the stock vendor modules load against a kernel whose CRCs have moved.
# Proven on mindphone, where force-loading the stock MTK combo-chip drivers
# brought up wifi, BT and GPS; this is the Tier B analogue of the Tier A KMI
# discipline.
CONFIG_MODULE_FORCE_LOAD=y

# Bluetooth. bluebinder talks to the container's HIDL bluetooth HAL and feeds
# the result to BlueZ through a virtual HCI, so /dev/vhci is the whole
# interface between the two halves:
#
#   bluebinder: Connected to HIDL bluetooth service
#   bluebinder: Failed to open /dev/vhci deviceUnable to open virtual device
#   systemd: bluebinder.service: Failed with result 'protocol'.  (x6, then
#            "Start request repeated too quickly")
#
# measured on 22 Sep 2026. The HAL side was already working - it is only the
# kernel end that is missing.
#
# BT_BREDR and BT_LE are the part that is specific to this device. They are
# "default y" in net/bluetooth/Kconfig and every other LuneOS fragment
# therefore just lists the protocols, but sunfish_defconfig turns both off
# explicitly:
#
#   CONFIG_BT=y
#   # CONFIG_BT_BREDR is not set
#   # CONFIG_BT_LE is not set
#
# and RFCOMM, BNEP and HIDP all "depends on BT_BREDR", so listing them without
# it would leave every one of them off and look like the fragment had no
# effect. BNEP is the one bluetoothd names out loud when it is absent:
#
#   bluetoothd: bnep.c:bnep_init() kernel lacks bnep-protocol support
CONFIG_BT_BREDR=y
CONFIG_BT_LE=y
CONFIG_BT_HCIVHCI=y
CONFIG_BT_RFCOMM=y
CONFIG_BT_RFCOMM_TTY=y
CONFIG_BT_BNEP=y
CONFIG_BT_BNEP_MC_FILTER=y
CONFIG_BT_BNEP_PROTO_FILTER=y
CONFIG_BT_HIDP=y
#
# BT_HS is "default y" under BT_BREDR and would come along for free. It is the
# 802.11 AMP offload path (A2MP) and nothing on this device uses it, so it is
# turned off rather than carried - the boot window on sunfish is tight enough
# that unneeded options are worth their bytes.
#
# Measured, so the next person does not have to guess what Bluetooth costs:
#
#   before this block   kernel 15712152 B, 1032296 B of headroom
#   after it            kernel 15779218 B,  965230 B of headroom
#
# i.e. BREDR + LE + RFCOMM + BNEP + HIDP, minus BT_HS, is 67066 bytes lz4'd.
# If the boot-window check ever does fail, BT_RFCOMM_TTY and BT_HIDP are the
# next two to give up: nothing in LuneOS needs a serial port or a HID device
# over Bluetooth to get an adapter working.
# CONFIG_BT_HS is not set
