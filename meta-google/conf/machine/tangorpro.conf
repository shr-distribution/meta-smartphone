#-----------------------------------------------------------------------------
#@TYPE: Machine
#@NAME: Google Pixel Tablet (codename tangorpro)
#@DESCRIPTION: Machine configuration for the Google Pixel Tablet, Tensor G2 gs201
#
# This machine exists to build the *boot image*, the way halium-arm64.conf says
# a device machine should: the rootfs comes from halium-arm64 and the GSI is
# chosen at install time. Two things come out of here:
#
#   MACHINE=tangorpro bitbake initramfs-android-image  the Halium initramfs
#   MACHINE=tangorpro bitbake luneos-bootimg-gki       boot-tangorpro-luneos.img,
#                                                      init_boot-tangorpro-luneos.img
#                                                      (+ the -debug variant)
#
# Sibling of panther: same SoC (gs201), same boot layout, same HAL surface. The
# stock boot.img kernel is byte-identical across bluejay, panther and tangorpro
# (sha256 2be4a595a21371800d989059ae2bb2085ca8df45d44fa86f0d9ab79629ca2ceb) -
# one GKI per KMI, shipped unchanged on gs101 and gs201 - so the Tier A kernel
# linux-halium-gki builds here is a drop-in with no rebuild. Verified against
# tangorpro bp4a.251205.006: all 194 stock vendor modules pass the KMI CRC
# check against our Module.symvers, 0 mismatches.
#
# Tier A: the kernel is the Android Common Kernel android14-6.1 built with the
# clang the KMI was frozen with, plus the LuneOS defconfig fragment. It is not,
# and cannot be, built with the OE toolchain: that would move the exported
# symbol CRCs under CONFIG_MODVERSIONS and the tablet's own stock vendor
# modules would stop loading. Point GKI_KERNEL_IMAGE at a prebuilt Image to
# override the in-tree build.
#-----------------------------------------------------------------------------

require conf/machine/include/arm/arch-arm64.inc
require conf/machine/include/meta-android-halium.inc

# This machine builds GKI boot images; luneos-bootimg-gki (now in meta-android,
# next to gki_bootimg.bbclass) is gated on this rather than on a list of device
# names.
GKI_BOOTIMG = "1"

# android14-6.1, now that a second KMI (android12-5.10, for the MediaTek q25)
# also provides linux-halium-gki.
PREFERRED_VERSION_linux-halium-gki = "6.1%"

# No kernel is built here (see above), but virtual/kernel still has to resolve.
PREFERRED_PROVIDER_virtual/kernel = "linux-dummy"
MACHINE_ESSENTIAL_EXTRA_RDEPENDS = ""
MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS = ""

# No "phone", no "gps", no "nfc": unlike panther this is a Wi-Fi-only tablet.
# Read from the stock vendor.img, not from a spec sheet - /vendor/bin/hw has no
# IRadio service of any kind (only vendor.google.radioext@1.0-service, a Google
# side-channel), no GNSS HAL and no NFC HAL, and /vendor/etc/vintf/manifest
# carries no entry for any of the three.
MACHINE_FEATURES = "apm alsa bluetooth usbgadget usbhost wifi vfat ext2 keyboard"

# 10.95" 1600x2560. These are the panel's *native* numbers, decoded from the
# drm_display_mode in the stock panel driver (panel-boe-ts110f5mlg0.ko, and
# identically in the csot-ppa957db2d alternative):
#
#   clock 309,246 kHz  h: 1600 1692 1758 1850  v: 2560 2586 2590 2786  -> 60.0 Hz
#   width_mm 147, height_mm 236
#
# So the panel scans out PORTRAIT and the tablet is used with it rotated - the
# 2560 axis is the physical long edge. hypot(147,236) = 278.0 mm = 10.95", and
# hypot(1600,2560)/10.95 = 275.8 -> 276 ppi, which is exactly what Google
# publishes for the Pixel Tablet. Single mode: 60 Hz, no high-refresh mode.
#
# The numbers below are the orientation the tablet is USED in - landscape,
# width > height - following the convention the existing LuneOS tablets set:
# tenderloin and tenderloin-halium (HP TouchPad) both declare 1024x768 with
# ORIENTATION = "0", and tenderloin-halium is a hwcomposer/Halium machine, so it
# is the direct precedent for this one rather than a mainline outlier. The
# panel's own portrait scanout is recorded above, not here.
#
# pinetab2 is the closest analogue for the rotated-panel part specifically (its
# U-Boot menu is built CMD_TMENU_ROTATED); it declares no MACHINE_DISPLAY_* at
# all. Note that nothing in the tree currently reads these variables - they are
# documentation - so the choice costs nothing either way.
#
# The stock Android stack rotates in the compositor
# (ro.surface_flinger.primary_display_orientation=ORIENTATION_0 plus
# debug.sf.ignore_hwc_physical_display_orientation=true, and display_settings.xml
# sets ignoreOrientationRequest="true"), so what hwcomposer hands libhybris is
# the portrait buffer and something on our side has to turn it. UNVERIFIED on
# hardware - expect to revisit this, the device pixel ratio (as sargo needed),
# and the sensorfw [accelerometer] transformation_matrix that pinetab2 and
# tenderloin-halium each carry.
MACHINE_DISPLAY_WIDTH_PIXELS = "2560"
MACHINE_DISPLAY_HEIGHT_PIXELS = "1600"
MACHINE_DISPLAY_ORIENTATION = "0"
MACHINE_DISPLAY_PPI = "276"

# Tracks the GSI generation, not the Android 16 vendor: libhybris gates its
# per-generation support on ANDROID_VERSION_MAJOR, which comes from this
# package. Same reasoning as sargo.conf, which spells it out at length.
PREFERRED_VERSION_android-headers-halium = "16.0%"

# Treble-era GSI, so the modern droid modules rather than the jb2q ones the
# halium include defaults to.
PREFERRED_VERSION_pulseaudio-modules-droid = "17.0.103%"

# No GSI baked in, as on halium-arm64: rootfs.img and android-rootfs.img sit
# side by side in userdata and the GSI is picked at install time from the
# device's vendor API level. The flash kit ships the Halium 16 one.
VIRTUAL-RUNTIME_android-system-image = ""

# Deliberately no XSERVER: this machine builds no rootfs, and the stack here is
# hwcomposer-based, which xf86-video-fbdev does not serve.

IMAGE_FSTYPES += "tar.gz"
IMAGE_ROOTFS_EXTRA_SPACE = "200000"

# Boot image: header v4, and tangorpro is an Android-13-launch device, so the
# kernel is alone in boot and the generic ramdisk has its own init_boot
# partition - only 0x800000 (8 MB), against 64 MB for boot. Verified against the
# stock bp4a.251205.006 images (boot.img: kernel 16,565,921 B, ramdisk size 0;
# init_boot.img: kernel 0, ramdisk 2,657,143 B) and against
# device/google/gs201/BoardConfig-common.mk, which tangorpro shares with panther
# (BOARD_INIT_BOOT_IMAGE_PARTITION_SIZE := 0x800000,
# BOARD_BOOTIMAGE_PARTITION_SIZE := 0x04000000, both header version 4). The
# kernel modules are in yet another partition here, vendor_kernel_boot; it and
# vendor_boot stay stock and the bootloader merges them underneath our ramdisk,
# so /lib/modules is there for the initramfs module loader.
#
# v4 has no page size, dtb, second or tags field: the device tree is in
# vendor_kernel_boot (886,583 B, byte-identical to panther's - it is the gs201
# SoC dtb, the board differences live in dtbo) and the load addresses are the
# bootloader's business.
ANDROID_BOOTIMG_HEADER_VERSION = "4"
ANDROID_BOOTIMG_INIT_BOOT = "1"

# Empty on purpose. The kernel command line comes from vendor_boot, which stays
# stock, and a Pixel bootloader takes only the arguments it already knows from
# the boot image - verified on sargo, where even a canary never reached
# /proc/cmdline. Anything LuneOS needs goes into CONFIG_CMDLINE instead; see
# halium-kernel.inc.
ANDROID_BOOTIMG_CMDLINE = ""

# From the stock vendor_boot command line: console=ttySAC0,115200.
# UNVERIFIED on hardware - a retail Pixel exposes no debug UART.
SERIAL_CONSOLE = "115200 ttySAC0"
