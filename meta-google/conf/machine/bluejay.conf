#-----------------------------------------------------------------------------
#@TYPE: Machine
#@NAME: Google Pixel 6a (codename bluejay)
#@DESCRIPTION: Machine configuration for Google Pixel 6a (Tensor GS101)
#-----------------------------------------------------------------------------

require conf/machine/include/arm/arch-arm64.inc
require conf/machine/include/meta-android-halium.inc

# bluejay's real kernel is not built through this recipe at all - it's built
# externally via Bazel/Kleaf from the achunt2143/luneos-bootimg-bluejay repo
# (real AOSP GKI kernel build, ACK pinned to android14-6.1, LuneOS defconfig
# fragment) and flashed as its own boot.img. This provider only exists so
# bitbake's virtual/kernel dependency resolves to *something* buildable;
# whatever it produces is never used. Pointed at sargo's kernel recipe
# rather than left unset, matching the same harmless-stand-in role sargo
# itself has been playing for this whole machine until now.
PREFERRED_PROVIDER_virtual/kernel ?= "linux-google-sargo"
MACHINE_KERNEL_PR = "r0"

MACHINE_FEATURES = "apm alsa bluetooth gps usbgadget usbhost phone wifi vfat ext2 keyboard nfc"
MACHINE_DISPLAY_WIDTH_PIXELS = "1080"
MACHINE_DISPLAY_HEIGHT_PIXELS = "2400"
MACHINE_DISPLAY_ORIENTATION = "0"
MACHINE_DISPLAY_PPI = "429"

# Real Android 16 headers, not the 9.0 default. Needed for libhybris's
# ANDROID_VERSION_MAJOR>=16 code paths (system/window.h, system/graphics.h,
# vndk/hardware_buffer.h all genuinely differ from 11.0 on the libhybris <->
# vendor-EGL interop surface). Halium's own halium-16.0 branch is a dead
# end (byte-identical tree to halium-11.0, still declares major version 11)
# - the real Android 16 headers are on Herrie's herrie/halium-16.0 branch,
# which is what android-headers-halium_16.0.bb (this layer) actually builds.
# This override used to live hacked into sargo.conf, since this machine had
# no conf of its own yet - moved here now that it does; sargo.conf reverted
# to its real Pixel 3a defaults.
PREFERRED_VERSION_android-headers-halium = "16.0%"

# No android-system-image-bluejay recipe exists (unlike sargo's, which
# downloads a prebuilt halium-luneos-9.0 tarball from a GitHub release -
# entirely Pixel 3a-specific packaging). bluejay's android-rootfs.img /
# vendor.img are prepared by this project's own device-image scripts from
# the real device's factory image, not through this recipe path - leaving
# VIRTUAL-RUNTIME_android-system-image unset here rather than pointing it
# at sargo's image.

PREFERRED_PROVIDER_virtual/xserver = "xserver-xorg"
XSERVER = " \
    xserver-xorg \
    xf86-input-evdev \
    xf86-video-fbdev \
"

# We need fsck.vfat for vfat partitions we need to mount
MACHINE_EXTRA_RDEPENDS = " \
    dosfstools \
"

KERNEL_IMAGETYPE = "Image.gz-dtb"
IMAGE_FSTYPES += "tar.gz"
IMAGE_ROOTFS_EXTRA_SPACE = "200000"

# No ANDROID_BOARD_*_PARTITION / SERIAL_CONSOLE here, unlike sargo's conf:
# those are real Pixel 3a values (eMMC mmcblk0 partition naming, a Qualcomm
# ttyMSM0 UART) that would be actively wrong for this device, not just
# unused. bluejay is UFS-based (its userdata partition is /dev/sda27, see
# luneos-bootimg-bluejay/build-bootimg.sh's CMDLINE) and has no serial
# console at all - all debugging on this device is pstore/ramoops-only
# (see bluejay-pstore-ramoops-debugging in project memory). Boot image
# assembly and flashing both live entirely in the separate
# luneos-bootimg-bluejay repo, independent of these OE variables.
