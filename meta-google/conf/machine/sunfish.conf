#-----------------------------------------------------------------------------
#@TYPE: Machine
#@NAME: Google Pixel 4a (codename sunfish)
#@DESCRIPTION: Machine configuration for the Google Pixel 4a, SM7125 (sm7150)
#
# This machine exists to build the *boot image*, the way halium-arm64.conf says
# a device machine should: the rootfs comes from MACHINE=halium-arm64 and the
# GSI is chosen at install time from the device's vendor API level. What comes
# out of here is:
#
#   MACHINE=sunfish bitbake initramfs-android-image   the Halium initramfs
#   MACHINE=sunfish bitbake linux-google-sunfish      boot.img (kernel + initrd)
#
# Tier B: SM7125 is a 4.14 msm tree that predates GKI, so the kernel is built
# per device - see linux-google-sunfish_git.bb, which also requires
# waydroid-kernel.inc for the binder/veth/overlayfs options.
#
# Modelled on sargo.conf (Pixel 3a), the closest thing in the tree: same
# vendor, same Qualcomm/Adreno libhybris path, same A/B + boot-header-v2
# arrangement. The differences worth knowing before touching anything here:
#
#   - Storage is UFS, not eMMC: partitions are /dev/sd*, and the by-name
#     directory is /dev/block/platform/soc/1d84000.ufshc/by-name/.
#   - Dynamic partitions are the *real* thing, not sargo's retrofit: sunfish
#     launched on Android 10, so there is a genuine `super` partition holding
#     system/vendor/product/system_ext. mount-android.sh takes its normal
#     path here - the retrofit code (metadata on `system`, extents spanning
#     two devices) is not exercised.
#   - BOARD_USES_RECOVERY_AS_BOOT: the boot partition *is* recovery on this
#     device. Flashing a LuneOS boot.img therefore replaces recovery as well;
#     keep the stock boot.img from the factory image to get it back.
#   - The vendor loads roughly 40 kernel modules at init time
#     (init.insmod.sunfish.cfg) and the stock defconfig has CONFIG_MODVERSIONS.
#     A rebuilt kernel moves those CRCs, so the stock .ko files will not load
#     as-is. See the module notes in linux-google-sunfish_git.bb; this is the
#     single biggest open risk in this port and the first thing to check on
#     hardware.
#
# UNVERIFIED: no Pixel 4a has run this yet. Everything here is derived from
# LineageOS's device tree (lineage-22.2) and kernel tree, not from a booted
# device. Values that came out of those trees are marked where they matter.
#-----------------------------------------------------------------------------

require conf/machine/include/arm/arch-arm64.inc
require conf/machine/include/meta-android-halium.inc

PREFERRED_PROVIDER_virtual/kernel ?= "linux-google-sunfish"
MACHINE_KERNEL_PR = "r0"

# No rootfs is built for this machine (see above), so nothing is pulled in for
# one. Same arrangement as sargo.conf and bluejay.conf.
MACHINE_ESSENTIAL_EXTRA_RDEPENDS = ""
MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS = ""

MACHINE_FEATURES = "apm alsa bluetooth gps usbgadget usbhost phone wifi vfat ext2 keyboard nfc"

# 5.81" 1080x2340 OLED. Kept for reference only - geometry comes from the
# runtime adaptation, not from the build: luneos-device-config ships
# adaptations/sunfish/deviceinfo. sqrt(1080^2+2340^2)/5.81 = 443.5, which is
# also the number Google publishes.
MACHINE_DISPLAY_WIDTH_PIXELS = "1080"
MACHINE_DISPLAY_HEIGHT_PIXELS = "2340"
MACHINE_DISPLAY_ORIENTATION = "0"
MACHINE_DISPLAY_PPI = "443"

# Tracks the GSI generation pinned for this device, not the Android 13 vendor
# it runs against. libhybris gates its per-generation support on
# ANDROID_VERSION_MAJOR, which comes from this package, so the two have to move
# together - sargo.conf spells out at length what breaks when they do not.
PREFERRED_VERSION_android-headers-halium = "16.0%"

# Treble-era GSI, so the "modern" droid modules rather than the jb2q ones the
# halium include defaults to.
PREFERRED_VERSION_pulseaudio-modules-droid = "17.0.103%"

# No GSI baked in, as on halium-arm64, sargo and bluejay: rootfs.img and
# android-rootfs.img sit side by side in userdata and the GSI is picked at
# install time from the device's vendor API level. A Pixel 4a on its final OTA
# is Android 13, which reports vndk 33.
VIRTUAL-RUNTIME_android-system-image = ""

# Deliberately no XSERVER: this machine builds no rootfs, and the stack here is
# hwcomposer-based, which xf86-video-fbdev does not serve.

IMAGE_FSTYPES += "tar.gz"
IMAGE_ROOTFS_EXTRA_SPACE = "200000"

# lz4, because that is what the stock boot.img carries: its kernel starts
# 04 22 4d 18, and LineageOS builds sunfish the same way
# (BOARD_KERNEL_IMAGE_NAME := Image.lz4). sargo's gzip image proves a Pixel
# ABL of the previous generation decompresses gzip, but nothing proves it for
# this bootloader, and an image the bootloader cannot unpack is the one class
# of mistake that gives no diagnostics at all. The "-dtb" half is the same
# appended-dtb shape sargo uses; kernel_android.bbclass splits it back out
# into the v2 dtb section.
KERNEL_IMAGETYPE = "Image.lz4-dtb"

# A/B device. The boot partition is addressed by name rather than by number
# here (sargo hardcodes mmcblk0p13 because its by-name symlinks live under a
# platform path); the *active slot* suffix still has to be appended by whatever
# flashes it - fastboot does this itself, which is how the flash kit installs.
ANDROID_BOARD_BOOTIMAGE_PARTITION = "/dev/block/platform/soc/1d84000.ufshc/by-name/boot"
ANDROID_BOARD_FLASH_BLOCK_SIZE = "131072"

# From the stock kernel command line (BoardConfig-common.mk). A retail Pixel
# exposes no debug UART, so this is only useful with a serial adapter on the
# USB-C sidechannel - it is here because the kernel console is on it.
SERIAL_CONSOLE = "115200 ttyMSM0"

#-----------------------------------------------------------------------------
# Where the per-device bits live, so they can be found from here:
#
#   display scaling, key devices   luneos-device-config, Tier 1:
#                                  adaptations/sunfish/deviceinfo
#   udev device-node permissions   70-sunfish.rules, shipped by the *generic*
#                                  rootfs (this machine builds none). It cannot
#                                  be Tier 2: udev rules must exist before the
#                                  coldplug, and that service runs after it.
#   Android services to stub       stubbed-services.d/sunfish, picked by
#                                  codename at container pre-start, same reason.
#   kernel config delta            linux-google-sunfish/luneos.cfg
#-----------------------------------------------------------------------------
