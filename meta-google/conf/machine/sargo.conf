#-----------------------------------------------------------------------------
#@TYPE: Machine
#@NAME: Google Pixel 3a (codename sargo)
#@DESCRIPTION: Machine configuration for Google Pixel 3a
#-----------------------------------------------------------------------------

require conf/machine/include/arm/arch-arm64.inc
require conf/machine/include/meta-android-halium.inc

PREFERRED_PROVIDER_virtual/kernel ?= "linux-google-sargo"
MACHINE_KERNEL_PR = "r0"

MACHINE_FEATURES = "apm alsa bluetooth gps usbgadget usbhost phone wifi vfat ext2 keyboard nfc"
MACHINE_DISPLAY_WIDTH_PIXELS = "1080"
MACHINE_DISPLAY_HEIGHT_PIXELS = "2220"
MACHINE_DISPLAY_ORIENTATION = "0"
MACHINE_DISPLAY_PPI = "403"

# Tracks the GSI generation pinned in android-system-image-sargo.bb, not the
# Android 12L vendor this device runs against. libhybris gates its per-generation
# support on ANDROID_VERSION_MAJOR, which comes from this package, so the two
# have to move together:
#
# Android 11 moved bionic into the runtime APEX - the 11.0 GSI has no
# /system/lib64/libc.so at all, only /apex/com.android.runtime/lib64/bionic -
# and libhybris only builds hybris/common/q, which knows about /apex, when the
# headers say 10.0 or newer. Against 9.0 headers everything Android-side dies
# with 'library "libc.so" not found', android-system.service's getprop poll
# never succeeds, and systemd tears the mounts back down.
#
# 16.0 has the same shape one generation on: the A16 half of
# hybris/common/q/bionic/libc/bionic/bionic_elf_tls.cpp compiles out below 16,
# while linker_finalize_static_tls() still calls into it, so q.so links with
# StaticTlsLayout::finish_layout() undefined and every hybris consumer fails at
# dlopen with "Failed to load hybris linker for Android SDK version 36".
PREFERRED_VERSION_android-headers-halium = "16.0%"

# Treble-era GSI, so the "modern" droid modules rather than the jb2q ones the
# halium include defaults to.
PREFERRED_VERSION_pulseaudio-modules-droid = "17.0.103%"
VIRTUAL-RUNTIME_android-system-image = "android-system-image-sargo"

PREFERRED_PROVIDER_virtual/xserver = "xserver-xorg"
XSERVER = " \
    xserver-xorg \
    xf86-input-evdev \
    xf86-video-fbdev \
"

# We need fsck.vfat for vfat partitions we need to mount
# Also, include the wlan module for the kernel
MACHINE_EXTRA_RDEPENDS = " \
    android-kernel-bootimg \
    dosfstools \
"

#kernel-module-wlan

KERNEL_IMAGETYPE = "Image.gz-dtb"
IMAGE_FSTYPES += "tar.gz"
IMAGE_ROOTFS_EXTRA_SPACE = "200000"

ANDROID_BOARD_BOOTIMAGE_PARTITION = "/dev/block/mmcblk0p13"
ANDROID_BOARD_SYSTEMIMAGE_PARTITION_SIZE = "1757077504"
ANDROID_BOARD_FLASH_BLOCK_SIZE = "131072"

SERIAL_CONSOLE = "115200 ttyMSM0"


