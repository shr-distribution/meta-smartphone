#-----------------------------------------------------------------------------
#@TYPE: Machine
#@NAME: Google Pixel 3a (codename sargo)
#@DESCRIPTION: Machine configuration for the Google Pixel 3a, SDM670
#
# This machine exists to build the *boot image*, the way halium-arm64.conf says
# a device machine should: the rootfs comes from MACHINE=halium-arm64 and the
# GSI is chosen at install time from the device's vendor API level. What comes
# out of here is:
#
#   MACHINE=sargo bitbake initramfs-android-image   the Halium initramfs
#   MACHINE=sargo bitbake linux-google-sargo        boot.img (kernel + initrd)
#
# Tier B: SDM670 predates GKI, so the kernel is built per device from the
# 4.9 vendor tree - see linux-google-sargo_git.bb, which also requires
# waydroid-kernel.inc for the binder/veth/overlayfs options.
#
# It used to build a complete rootfs of its own, and that is how a sargo image
# shipped without Waydroid: packagegroup-luneos-extended appends waydroid for
# halium-arm64, and a MACHINE=sargo rootfs picked up none of it. The pieces
# that really were device-specific moved out rather than being deleted -
# see the notes at the bottom of this file.
#-----------------------------------------------------------------------------

require conf/machine/include/arm/arch-arm64.inc
require conf/machine/include/meta-android-halium.inc

PREFERRED_PROVIDER_virtual/kernel ?= "linux-google-sargo"
MACHINE_KERNEL_PR = "r0"

# No rootfs is built for this machine (see above), so nothing is pulled in for
# one. Same arrangement as surya.conf and bluejay.conf.
MACHINE_ESSENTIAL_EXTRA_RDEPENDS = ""
MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS = ""

MACHINE_FEATURES = "apm alsa bluetooth gps usbgadget usbhost phone wifi vfat ext2 keyboard nfc"

# 5.6" 1080x2220. Kept for reference only - geometry now comes from the runtime
# adaptation, not from the build: luneos-device-config ships
# adaptations/sargo/deviceinfo with the measured display_dpi of 441 and the
# device_pixel_ratio of 2.4 that webOS's fixed-layout Enyo pages need. The
# "natural" density/160 of 2.75 inflates and clips them.
MACHINE_DISPLAY_WIDTH_PIXELS = "1080"
MACHINE_DISPLAY_HEIGHT_PIXELS = "2220"
MACHINE_DISPLAY_ORIENTATION = "0"
MACHINE_DISPLAY_PPI = "403"

# Tracks the GSI generation pinned for this device, not the Android 12L vendor
# it runs against. libhybris gates its per-generation support on
# ANDROID_VERSION_MAJOR, which comes from this package, so the two have to move
# together:
#
# Android 11 moved bionic into the runtime APEX - the 11.0 GSI has no
# /system/lib64/libc.so at all, only /apex/com.android.runtime/lib64/bionic -
# and libhybris only builds hybris/common/q, which knows about /apex, when the
# headers say 10.0 or newer. Against 9.0 headers everything Android-side dies
# with 'library "libc.so" not found', android-system.service's getprop poll
# never succeeds, and systemd tears the mounts back down.
#
# 16.0 has the same shape one generation on: the A16 half of
# hybris/common/q/bionic/libc/bionic/bionic_elf_tls.cpp compiles out below 16,
# while linker_finalize_static_tls() still calls into it, so q.so links with
# StaticTlsLayout::finish_layout() undefined and every hybris consumer fails at
# dlopen with "Failed to load hybris linker for Android SDK version 36".
PREFERRED_VERSION_android-headers-halium = "16.0%"

# Treble-era GSI, so the "modern" droid modules rather than the jb2q ones the
# halium include defaults to.
PREFERRED_VERSION_pulseaudio-modules-droid = "17.0.103%"

# No GSI baked in, as on halium-arm64, surya and bluejay: rootfs.img and
# android-rootfs.img sit side by side in userdata and the GSI is picked at
# install time from the device's vendor API level. sargo reports vndk 32, so
# HALIUM_13.
VIRTUAL-RUNTIME_android-system-image = ""

# Deliberately no XSERVER: this machine builds no rootfs, and the stack here is
# hwcomposer-based, which xf86-video-fbdev does not serve.

IMAGE_FSTYPES += "tar.gz"
IMAGE_ROOTFS_EXTRA_SPACE = "200000"

KERNEL_IMAGETYPE = "Image.gz-dtb"

# A/B device, but the boot slot is addressed by fixed partition number here -
# sargo's by-name symlinks live under the platform path, and this is the value
# luneos-package.inc has always used for it.
ANDROID_BOARD_BOOTIMAGE_PARTITION = "/dev/block/mmcblk0p13"
ANDROID_BOARD_FLASH_BLOCK_SIZE = "131072"

# Not consumed by any image built here any more - VIRTUAL-RUNTIME_android-system-image
# is empty - but android-system-image-sargo.bb is still COMPATIBLE_MACHINE = "sargo"
# and android_image_types.bbclass passes this to make_ext4fs, so the recipe stays
# buildable on its own to produce the GSI the flash kit ships.
ANDROID_BOARD_SYSTEMIMAGE_PARTITION_SIZE = "1757077504"

SERIAL_CONSOLE = "115200 ttyMSM0"

#-----------------------------------------------------------------------------
# Where the old sargo rootfs bits went, so the next port can find them:
#
#   display scaling, key devices   luneos-device-config, Tier 1:
#                                  adaptations/sargo/deviceinfo
#   /etc/libncicore.conf (NFC)     luneos-device-config, Tier 2:
#                                  adaptations/sargo/sparse/etc/
#   udev device-node permissions   70-sargo.rules, now trimmed to what
#                                  65-android.rules does not cover and shipped
#                                  by the generic rootfs. It cannot be Tier 2:
#                                  udev rules must exist before the coldplug,
#                                  and that service runs after it.
#   Android services to stub       stubbed-services.d/sargo, picked by codename
#                                  at container pre-start for the same reason.
#   NFC, fingerprint, eSIM, Waydroid
#                                  already appended for halium-arm64 in
#                                  packagegroup-luneos-extended; the duplicate
#                                  :sargo lines were dropped.
#-----------------------------------------------------------------------------
