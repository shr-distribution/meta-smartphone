#-----------------------------------------------------------------------------
#@TYPE: Machine
#@NAME: Google Pixel 4a (5G) (codename bramble)
#@DESCRIPTION: Machine configuration for the Pixel 4a 5G, SM7250 (lito)
#
# This machine exists to build the *boot image*, the way halium-arm64.conf says
# a device machine should: the rootfs comes from MACHINE=halium-arm64 and the
# GSI is chosen at install time. What comes out of here is:
#
#   MACHINE=bramble bitbake initramfs-android-image   the Halium initramfs
#   MACHINE=bramble bitbake luneos-bootimg-gki        boot-bramble-luneos.img
#
# The second builds linux-google-bramble on the way, the way it builds
# linux-halium-gki for bluejay. The kernel is Clang-built and this machine
# therefore needs GKI_CLANG_DIR:bramble in local.conf - see the recipe.
#
# Despite sharing a vendor and a generation with sunfish, bramble is a
# different machine in almost every way that matters, and it is worth reading
# this before assuming sunfish.conf transfers. Verified against the stock
# images of UP1A.231105.001.B2 (see ~/webos/LuneOS/bramble/stock):
#
#   - Boot header v3, not v2. boot.img is kernel + generic ramdisk with an
#     EMPTY command line (11,726,538 B lz4 kernel, 2,045,806 B ramdisk). This
#     is the bluejay/panther shape, and kernel_android.bbclass routes
#     header_version >= 3 to lib/halium/bootimg.py for it.
#   - There is a vendor_boot partition, and it holds everything that would
#     have been in boot on sunfish: the device tree (405,231 B at 0x1f00000),
#     the real kernel command line, and a 30 MB vendor ramdisk. It stays
#     STOCK - nothing here writes it.
#   - No init_boot: that is the Android-13-launch layout, and bramble launched
#     on Android 11, so ANDROID_BOOTIMG_INIT_BOOT stays "0" as on bluejay.
#   - The device is *modular* in a way sunfish is not: device/google/redbull's
#     modules.load has 329 entries, and they include ufs_qcom, ufshcd-core,
#     pinctrl-lito, clk-qcom, msm_drm and msm_adreno. Storage, clocks, pinctrl
#     and display are all modules. See linux-google-bramble_git.bb - keeping
#     them loadable is the whole game on this device, not a nice-to-have.
#
# Tier: formally Tier B (the 4.19 redbull tree is not GKI), but it has to be
# run with Tier A discipline, because the stock vendor modules must keep
# loading against our kernel. The KMI-poison rules in kernel-porting.md apply
# directly.
#
# UNVERIFIED: no Pixel 4a 5G has run this. Everything is derived from
# LineageOS's trees and the stock factory images, not from a booted device.
#-----------------------------------------------------------------------------

require conf/machine/include/arm/arch-arm64.inc
require conf/machine/include/meta-android-halium.inc

# The kernel is built by linux-google-bramble, which does not inherit
# kernel.bbclass (it builds with Google's Clang, not OE's GCC - the recipe says
# why), so it does not provide virtual/kernel. That still has to resolve, and
# nothing here wants an OE kernel: same arrangement as q25.conf.
PREFERRED_PROVIDER_virtual/kernel = "linux-dummy"
MACHINE_KERNEL_PR = "r0"

# No rootfs is built for this machine (see above), so nothing is pulled in for
# one. Same arrangement as sargo.conf, sunfish.conf and bluejay.conf.
MACHINE_ESSENTIAL_EXTRA_RDEPENDS = ""
MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS = ""

MACHINE_FEATURES = "apm alsa bluetooth gps usbgadget usbhost phone wifi vfat ext2 keyboard nfc"

# 6.24" 1080x2340. sqrt(1080^2+2340^2)/6.24 = 413, which is also the number
# Google publishes. Reference only - geometry comes from the runtime
# adaptation, adaptations/bramble/deviceinfo.
MACHINE_DISPLAY_WIDTH_PIXELS = "1080"
MACHINE_DISPLAY_HEIGHT_PIXELS = "2340"
MACHINE_DISPLAY_ORIENTATION = "0"
MACHINE_DISPLAY_PPI = "413"

# Tracks the GSI generation, not the Android 14 vendor this device ends on.
# sargo.conf spells out at length what breaks when the two diverge.
PREFERRED_VERSION_android-headers-halium = "16.0%"

# Treble-era GSI, so the modern droid modules rather than the jb2q ones the
# halium include defaults to.
PREFERRED_VERSION_pulseaudio-modules-droid = "17.0.103%"

# No GSI baked in: rootfs.img and android-rootfs.img sit side by side in
# userdata and the GSI is picked at install time from the vendor API level.
# bramble's last OTA is Android 14, so it reports vndk 34.
VIRTUAL-RUNTIME_android-system-image = ""

IMAGE_FSTYPES += "tar.gz"
IMAGE_ROOTFS_EXTRA_SPACE = "200000"

# This machine builds a GKI-shaped boot image: kernel plus the Halium
# initramfs, header v3, no dtb section - the device tree stays in the stock
# vendor_boot. Same class as bluejay and panther, except that the kernel is
# built here rather than out of tree, so the provider is named.
# Ship our own build of the vendor's kernel modules inside the initramfs, and
# therefore inside the boot image.
#
# bramble keeps its kernel modules in the vendor_boot ramdisk - 221 of them,
# including ufs_qcom.ko, ufshcd-core.ko and ufshcd-pltfrm.ko. The bootloader
# merges that ramdisk before ours, so init.sh's load_kernel_modules() finds them
# at /lib/modules and modprobes them before looking for userdata. That makes a
# module mismatch fatal rather than inconvenient: no storage, no rootfs, no boot.
#
# The LuneOS config delta moves exported-symbol CRCs, so LineageOS's prebuilt
# modules cannot load into our kernel. Ours, built from their tree at their
# revision, match by construction - and because the boot ramdisk is layered on
# top of vendor_boot's, our /lib/modules/*.ko simply override theirs while their
# modules.load and modules.dep keep deciding what loads. No bind-mount is needed
# here, unlike sunfish.
ANDROID_INITRAMFS_KERNEL_MODULES = "1"

GKI_BOOTIMG = "1"
GKI_KERNEL_PROVIDER = "linux-google-bramble"
# Stock's kernel is lz4 (magic 04 22 4d 18), as LineageOS also builds it
# (BOARD_KERNEL_IMAGE_NAME := Image.lz4). No "-dtb" suffix: a v3 header has no
# dtb section, so an appended tree would be dead weight the bootloader never
# looks at.
GKI_KERNEL_IMAGE_NAME = "Image.lz4"

# Read out of the stock boot.img of UP1A.231105.001.B2: header v3, empty
# command line (the real one is vendor_boot's), and no init_boot partition -
# that is the Android-13-launch layout and bramble launched on Android 11.
ANDROID_BOOTIMG_HEADER_VERSION = "3"
ANDROID_BOOTIMG_INIT_BOOT = "0"
ANDROID_BOOTIMG_CMDLINE = ""
# = Android 14, patch 2023-11, which is what UP1A.231105.001.B2 is.
ANDROID_BOOTIMG_OS_VERSION = "0x1c00017b"

# A/B device on UFS. fastboot appends the slot suffix itself.
ANDROID_BOARD_BOOTIMAGE_PARTITION = "/dev/block/platform/soc/1d84000.ufshc/by-name/boot"
ANDROID_BOARD_FLASH_BLOCK_SIZE = "131072"

# From the stock vendor_boot command line. As on bluejay this is only reachable
# with a serial adapter; the kernel console is on it either way.
SERIAL_CONSOLE = "115200 ttyMSM0"

#-----------------------------------------------------------------------------
# Where the per-device bits live:
#
#   display scaling, key devices   luneos-device-config, Tier 1:
#                                  adaptations/bramble/deviceinfo
#   udev device-node permissions   none of its own. Everything redbull's
#                                  ueventd.rc grants is already in the generic
#                                  65-android.rules; the 17 remaining entries
#                                  are Airbrush/face-auth/charger-logbuffer
#                                  nodes nothing in LuneOS reads.
#   Android services to stub       stubbed-services.d/bramble, picked by
#                                  codename at container pre-start.
#   kernel config delta            linux-google-bramble/luneos.cfg - and read
#                                  its header before adding anything.
#-----------------------------------------------------------------------------

# luneos-faced needs a usable camera. This used to be added to every aarch64
# machine unconditionally; it is a feature now so a device without one can drop
# it rather than ship a daemon that reports available=false.
MACHINE_FEATURES += "faceunlock"
