# The sdcard's partition, for example mmcblk1p1
sdcard_partition="not-set-in-machine.conf"

# The android system partition, for example mmcblk0p8
system_partition="not-set-in-machine.conf"

# The type of the root filesystem image, for example ext2
rootfs_type="ext2"

# The E Ink frontlight. lk turns it on at full for the boot logo and leds_mtk
# probes it at 32 of 80, which is what the device then shows until
# LunaDisplayManager applies the user's setting. 3 is where LunaDisplayManager
# puts it with the default 40% setting in ordinary indoor light.
boot_backlight_node="/sys/class/leds/lcd-backlight/brightness"
boot_backlight_level="3"
