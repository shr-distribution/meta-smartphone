#-----------------------------------------------------------------------------
#@TYPE: Machine
#@NAME: Minimal Phone MP01 (vendor codename Z10)
#@DESCRIPTION: Machine configuration for The Minimal Company's MP01, MediaTek
#              Helio G99 (MT6789), 4.3" 600x800 E Ink, physical QWERTY
#
# Same shape as q25.conf, bluejay.conf and panther.conf: this machine exists to
# build the *boot image*. The rootfs comes from halium-arm64 and the GSI is
# chosen at install time. Two things come out of here:
#
#   MACHINE=mp01 bitbake initramfs-android-image   the Halium initramfs
#   MACHINE=mp01 bitbake luneos-bootimg-gki        boot-mp01-luneos.img
#                                                  (+ the -debug variant)
#
# Read meta-zinwa/conf/machine/q25.conf alongside this. The MP01 is the same
# SoC and the same MediaTek "mgk" android12-5.10 kernel as the Q25 - same KMI
# generation (android12-9), same Clang (r416183b), same 64 MiB boot, same
# 9216 MiB super, same unused init_boot - and the two stock kernel configs
# differ by 85 options out of 2,665, every one of them a board-level driver.
# Where this file repeats q25.conf it is because the fact genuinely is the
# same, and where it differs the comment says why.
#-----------------------------------------------------------------------------

require conf/machine/include/arm/arch-arm64.inc
require conf/machine/include/meta-android-halium.inc

# No kernel in the rootfs sense - the kernel is built by linux-minimal-mp01 and
# consumed directly by luneos-bootimg-gki - but virtual/kernel still has to
# resolve.
PREFERRED_PROVIDER_virtual/kernel = "linux-dummy"
MACHINE_ESSENTIAL_EXTRA_RDEPENDS = ""
MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS = ""

# This machine builds GKI boot images; see meta-android's
# recipes-bsp/gki-bootimg/luneos-bootimg-gki_1.0.bb, which is gated on this
# rather than on a list of device names.
GKI_BOOTIMG = "1"

# The kernel comes from the device's own config on the Q25's tree, not from
# ACK. MediaTek does not ship pure GKI on MT6789 - the stock kernel is their
# "mgk" flavour and the stock modules' CRCs follow it - which the Q25 port
# established by measurement (344 of 344 stock modules failed to load against
# an ACK build). The MP01's stock config confirms the same shape:
# CONFIG_ARCH_MEDIATEK=y and the same out-of-tree option set.
#
# The one thing that is *not* inherited from the Q25 is source: Minimal has
# published no GPL kernel source, so linux-minimal-mp01 builds the xelex
# MT6789 tree against the MP01's own stock .config. That substitution is only
# legitimate if the CRCs come out matching - see the recipe's DESCRIPTION, and
# gate on /home/herrie/webos/LuneOS/MP01/check-kmi.sh before flashing anything.
GKI_KERNEL_PROVIDER = "linux-minimal-mp01"

# Verified against the stock boot.img: its kernel payload is gzip
# (1f 8b 08 ...), 19,652,970 bytes, "Linux version
# 5.10.233-android12-9-00062-g49c66df526b8-ab13101360". So Image.gz, as on the
# Q25 - MediaTek lk takes the gzip one.
GKI_KERNEL_IMAGE_NAME = "Image.gz"

# Match the stock ramdisk compression. Both of this device's stock ramdisks -
# boot.img's generic one and vendor_boot's - are LZ4 *legacy* format (magic
# 02 21 4c 18, confirmed with xxd on the factory image), and the bootloader
# hands the kernel the two concatenated. AOSP requires the compression to match
# across that concatenation; LuneOS's initramfs-android-image produces cpio.gz,
# so without this the generic ramdisk would be the only gzip link in an
# otherwise all-lz4 chain.
GKI_RAMDISK_COMPRESSION = "lz4-legacy"

# Vendor modules are NOT embedded in our initramfs - deliberately, and this
# cost most of a night to establish.
#
# Embedding all 180 (5.5 MB compressed) took the ramdisk from 6.6 MB to 14.8 MB
# and the boot image from 28 MB to 31.6 MB. After that our init STOPPED RUNNING
# ENTIRELY: no kmsg, no panic, nothing in expdb, on any of the six images built
# after it. The last record of our initramfs executing is from the 28 MB image.
# MediaTek's lk evidently will not load the larger boot image - which is of a
# piece with its other habits here (it eats the first 20 cmdline characters and
# does not expose vbmeta_system).
#
# The 64 MiB partition is not the constraint; the combined ramdisk the kernel
# has to decompress is (ours plus vendor_boot's 22.5 MB).
#
# So we go back to relying on the bootloader concatenating vendor_boot's
# ramdisk, which puts its /lib/modules in place for init.sh's
# load_kernel_modules. Whether that actually happens on this device is STILL
# UNVERIFIED - the embedding was meant to sidestep the question and instead
# masked it, because every "no modules loaded" observation afterwards was
# really "init never ran".
#
# If /lib/modules does turn out to be missing, embed a *minimal* set (storage +
# USB + watchdog, a few hundred KB) rather than all 180, and check the boot
# image stays near 28 MB.

# Physical QWERTY. NFC is real here (ro.hardware.nfc_nci=pn8x, and
# nxp_nfc_i2c.ko is in the stock module set). No "apm": MediaTek PMIC with the
# Android power HAL behind it.
#
# No "gps" omission and no trackpad: unlike the Q25 the MP01 has a capacitive
# touchscreen (FocalTech, focaltech_touch.ko), so touch is the pointer.
MACHINE_FEATURES = "alsa bluetooth gps usbgadget usbhost phone wifi vfat ext2 keyboard nfc touchscreen"

# 4.3" E Ink, 800x600. MEASURED on hardware, not taken from the spec sheet:
#
#   /sys/class/drm/card0-DSI-1  status=connected  modes=800x600
#   luneos-device-config: compositorGeometry=800x600+0+0r0s1 devicePixelRatio=1.78
#
# Press coverage says "600x800" and an earlier version of this file believed it.
# The panel scans 800x600; the device is physically portrait, so the panel is
# mounted rotated and the shell needs a 90-degree rotation rather than a
# different mode. Do not "fix" this back to 600x800.
#
# sqrt(800^2 + 600^2) / 4.3 = 232.6 ppi, which is unchanged by the swap.
#
# The panel is electrophoretic, driven by a Pango CPLD over I2C behind a normal
# MIPI-DSI interface. Refresh behaviour is four plain sysfs files on that CPLD
# (/sys/devices/platform/soc/11f00000.i2c/i2c-7/7-004b/):
#   refresh_mode         the waveform selector - Minimal's Slow/Fast/Ultra
#   eink_cpld_registers  screen firmware version (36 as shipped; 25 is faster)
#   ntc_registers        panel temperature - waveforms are temp-compensated
#   vcom_registers       VCOM bias
# Nothing in LuneOS drives them yet; the compositor does not need them to paint.
MACHINE_DISPLAY_WIDTH_PIXELS = "800"
MACHINE_DISPLAY_HEIGHT_PIXELS = "600"
MACHINE_DISPLAY_ORIENTATION = "0"
MACHINE_DISPLAY_PPI = "233"

# Tracks the GSI generation, not the vendor: libhybris gates its
# per-generation support on ANDROID_VERSION_MAJOR, which comes from this
# package.
#
# VERIFIED from the stock firmware's own vendor partition
# (Z10_20251226_user_smr6.zip, super.img -> vendor_a -> /build.prop):
#   ro.vndk.version=31, ro.board.first_api_level=31,
#   ro.vendor.build.version.sdk=31, ro.board.platform=mt6789
# i.e. an Android 12 vendor, exactly as on the Q25 - and consistent with what
# Minimal's own developer has said publicly, that MediaTek only gives them the
# A12 vendor code for this chipset. The Android 14 (and soon 15) build
# fingerprint on system/product is the platform, not the vendor.
#
# So the generic halium_arm64 16.0 GSI, which carries com.android.vndk.v31,
# serves this device - the same tarball sargo and q25 run. No VNDK snapshot
# work of the kind mindphone needed.
PREFERRED_VERSION_android-headers-halium = "16.0%"

# Treble-era GSI, so the modern droid modules rather than the jb2q ones the
# halium include defaults to.
PREFERRED_VERSION_pulseaudio-modules-droid = "17.0.103%"

# No GSI baked in, as on halium-arm64 and q25: rootfs.img and android-rootfs.img
# sit side by side and the GSI is picked at install time from the device's
# vendor API level.
VIRTUAL-RUNTIME_android-system-image = ""

# Deliberately no XSERVER: this machine builds no rootfs, and the stack here is
# hwcomposer-based (ro.hardware.hwcomposer=mtk_common), which xf86-video-fbdev
# does not serve.

IMAGE_FSTYPES += "tar.gz"
IMAGE_ROOTFS_EXTRA_SPACE = "200000"

# Boot image: header v4, and no init_boot - so the ramdisk rides in boot next
# to the kernel.
#
# Verified against the stock boot.img itself with unpack_bootimg: header
# version 4, kernel 19,652,970 B, ramdisk 1,380,093 B - a *non-zero* ramdisk,
# which is what says the generic ramdisk rides in boot. init_boot_a/init_boot_b
# do exist in the MT6789 scatter (8 MiB each) but are declared
# "file_name: NONE, is_download: false" and the factory image ships no
# init_boot.img at all: the partitions are there and unused, exactly as on the
# Q25. Do not set ANDROID_BOOTIMG_INIT_BOOT from the partition table.
#
# boot is 64 MiB and A/B, so there is room and a spare slot.
ANDROID_BOOTIMG_HEADER_VERSION = "4"
ANDROID_BOOTIMG_INIT_BOOT = "0"

# (os_version << 11) | os_patch_level, packed as the v3/v4 header wants it.
# unpack_bootimg on the stock boot.img reports "os version: 12.0.0 /
# os patch level: 2099-12", so:
#   os_version      = 12<<14            = 0x30000
#   os_patch_level  = (99<<4) | 12      = 0x63C
#   (0x30000 << 11) | 0x63C             = 0x1800063C
# which reproduces the stock header field for field.
#
# The 2099-12 is not a typo and not ours: Minimal ship a deliberately far-future
# patch level, presumably so AVB rollback never trips on it. Reproduce it rather
# than "correcting" it - never write a *lower* value than what is already
# flashed.
ANDROID_BOOTIMG_OS_VERSION = "0x1800063C"

# The twenty question marks are not decoration. MediaTek's Helio G99 lk drops
# the first 20 characters of the boot image command line before handing it to
# the kernel (established by the Droidian MT6789 work), so anything real has to
# start at offset 20.
#
# The stock boot.img cmdline is *empty* (verified with unpack_bootimg) and
# bootopt=64S3,32N2,64N2 lives in vendor_boot's cmdline, which stays stock - so
# nothing is being displaced here. gki_defconfig sets CONFIG_CMDLINE_EXTEND, so
# what survives is appended to the fragment's CONFIG_CMDLINE rather than
# replacing it.
#
# printk.devkmsg=on keeps the dmesg replay out of the ratelimiter, which is how
# early-boot evidence is collected. On this device that matters more than most:
# there is no debug UART and the panel is E Ink, so there may be no early
# console at all.
# initcall_debug=0 loglevel=4 undo what vendor_boot's own (stock, unmodified)
# command line turns on. Its "loglevel=8 ... initcall_debug=1" lands between the
# kernel's CONFIG_CMDLINE and this string, so these later copies win. The
# combination costs about twelve thousand journal lines per boot - one pair per
# initcall - which buries everything else and makes the journal useless for
# working out what a boot actually did. Raise them again, per boot, by editing
# the image rather than by shipping a device that shouts.
ANDROID_BOOTIMG_CMDLINE = "????????????????????log_buf_len=4M printk.devkmsg=on initcall_debug=0 loglevel=4"

# MediaTek on GKI uses the 8250 driver - 8250_mtk.ko is in the stock
# vendor_boot module set here too - so ttyS0. UNVERIFIED as a usable console.
SERIAL_CONSOLE = "115200 ttyS0"

# Diagnostic debug image: skip the watchdog driver so a hang during the
# module walk actually RESETS the SoC, raising the exception that makes
# MediaTek write expdb - which is the only way to read the kmsg trace on a
# device with no console and no USB. See init.sh load_modules_until_udc.
# Remove initrd_no_wdt once the shell comes up and is wanted persistent.
ANDROID_BOOTIMG_DEBUG_CMDLINE = "enable_adb"

# Put the patched display driver into the initramfs, where it replaces the
# vendor's mediatek-drm.ko. Without it the vendor hwcomposer cannot initialise
# DRM and the compositor never starts - see the recipe's do_install and
# mp01-notes.md.
ANDROID_EXTRA_INITRAMFS_IMAGE_INSTALL = "linux-minimal-mp01"

# Build the kernel with ThinLTO rather than the stock full LTO.
#
# The stock config uses CONFIG_LTO_CLANG_FULL, whose final link is single
# threaded and takes the best part of twenty minutes on a 32-core host; ThinLTO
# brings that down to a few minutes and parallelises. It is KMI-neutral - CRCs
# come from genksyms on preprocessed source, not from codegen - and check-kmi.sh
# is the gate that proves it per build.
KERNEL_LTO_THIN = "1"
