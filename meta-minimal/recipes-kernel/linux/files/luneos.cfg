# LuneOS delta for the Minimal Phone MP01's kernel (MediaTek mgk android12-5.10).
#
# Merged on top of mp01-stock.config - the device's own fully resolved stock
# config, shipped loose as merged/.config in Minimal's factory image. That is
# the baseline the stock vendor modules' CRCs were computed against, so
# everything here is a *deviation from it*, and every deviation is a chance to
# break the KMI.
#
# Build with LUNEOS_KERNEL_FRAGMENT = "0" first to prove the baseline
# reproduces, then add this and measure again with check-kmi.sh. On this device
# that gate matters more than usual: the display is a stock vendor module
# (panel-z10-eink-i2c.ko), so a CRC regression is a blank E Ink panel with no
# way to see why.
#
# Sections are ordered by how likely they are to move a CRC, most dangerous
# last, so bisecting means deleting from the bottom.
#
# This started as a copy of meta-zinwa's luneos.cfg. That is defensible rather
# than lazy: same SoC (MT6789), same MediaTek mgk 5.10 kernel, same KMI
# generation (android12-9), and the two stock configs agree on every option
# this fragment touches - including all four of the ones the Q25's bisect
# identified as poison. Read meta-zinwa's copy for the full reasoning; the
# measured claims below are repeated here because they have to be re-measured
# on this device before they can be relied on.

# ---------------------------------------------------------------------------
# 1. Behavioural only - no struct touched, no CRC can move
# ---------------------------------------------------------------------------

# systemd/udev hard requirements. Stock has none of these.
CONFIG_DEVTMPFS=y
CONFIG_DEVTMPFS_MOUNT=y
CONFIG_FHANDLE=y
CONFIG_TMPFS_XATTR=y
CONFIG_TMPFS_POSIX_ACL=y
CONFIG_AUTOFS_FS=y
CONFIG_QUOTA_NETLINK_INTERFACE=y

# Virtual terminal. Stock has CONFIG_VT unset.
#
# On the Q25 this was also "the only console there is". Here it is less clear -
# the MP01's panel is an E Ink display behind an FPGA, so whether a VT console
# is legible on it at all is unknown and will stay unknown until hardware. Turn
# it on regardless: it costs nothing, and if it does paint it is the only
# early-boot evidence this device can produce.
CONFIG_VT=y
CONFIG_VT_CONSOLE=y

# request_module() autoloading. Stock sets STATIC_USERMODEHELPER=y with an
# empty path, which disables the usermode helper outright.
# CONFIG_STATIC_USERMODEHELPER is not set

# Hotplug events to the initramfs's mdev. Without it late hotplug events are
# lost and /dev/disk/by-partlabel can come up empty. mer wants the path to
# default empty.
CONFIG_UEVENT_HELPER=y
CONFIG_UEVENT_HELPER_PATH=""

# bluebinder feeds the Android BT HAL into a virtual HCI, so vhci is its kernel
# prerequisite; the rest is the bluez profile set. Stock has none of them.
CONFIG_BT_HCIVHCI=y
CONFIG_BT_RFCOMM=y
CONFIG_BT_RFCOMM_TTY=y
CONFIG_BT_HIDP=y
CONFIG_BT_BNEP=y
CONFIG_BT_BNEP_MC_FILTER=y
CONFIG_BT_BNEP_PROTO_FILTER=y

# Waydroid wants its own binder trio however the nodes are created, plus veth
# and the checksum target for its networking. LuneOS mounts binderfs on the
# host and binds it into the container, which is orthogonal to this list.
CONFIG_ANDROID_BINDER_DEVICES="binder,hwbinder,vndbinder,anbox-binder,anbox-hwbinder,anbox-vndbinder"
CONFIG_VETH=y
CONFIG_NETFILTER_XT_TARGET_CHECKSUM=y

# ---------------------------------------------------------------------------
# 2. Netfilter / ofono / VPN. These add modules and match extensions rather
#    than members of core structs, but a few netfilter options do reach into
#    struct net - so they come before the namespace block, not with section 1.
# ---------------------------------------------------------------------------
CONFIG_INET_AH=y
CONFIG_INET_IPCOMP=y
CONFIG_INET6_AH=y
CONFIG_INET6_IPCOMP=y
CONFIG_NF_LOG_IPV4=y
CONFIG_NF_LOG_IPV6=y
CONFIG_IP_NF_MATCH_AH=y
CONFIG_IP_NF_MATCH_RPFILTER=y
CONFIG_IP6_NF_MATCH_RPFILTER=y
CONFIG_NETFILTER_XT_MATCH_RECENT=y
CONFIG_NETFILTER_XT_MATCH_SCTP=y

# PPP stack (ofono dialup / DUN)
CONFIG_PPP=y
CONFIG_PPP_ASYNC=y
CONFIG_PPP_SYNC_TTY=y
CONFIG_PPP_FILTER=y
CONFIG_PPP_MULTILINK=y
CONFIG_PPP_DEFLATE=y
CONFIG_PPP_BSDCOMP=y
CONFIG_PPPOE=y

# L2TP (VPN)
CONFIG_L2TP=y
CONFIG_L2TP_V3=y
CONFIG_L2TP_IP=y

# NET_L3_MASTER_DEV stays off deliberately: it adds l3mdev_ops to struct
# net_device, which every vendor wifi module touches. ofono does not need VRF.
# Same for FANOTIFY, NF_TABLES, HUGETLBFS, POSIX_MQUEUE and CGROUP_PIDS, all of
# which the Droidian MT6789 port marks ABI-breaking.

# ---------------------------------------------------------------------------
# 3. Namespaces - and the KMI-poison list
#
# Held out here on the Q25's measurement, not yet on this device's. The Q25
# bisect (13 Sep 2026, 344 stock modules) found that enabling CONFIG_SYSVIPC
# (with SYSVIPC_SYSCTL and IPC_NS) and CONFIG_USER_NS moved module_layout and
# every other CRC with it: 344 of 344 would fail. PID_NS and CHECKPOINT_RESTORE
# were clean - the same answer bluejay's bisect gave on android14-6.1.
#
# The MP01's stock config agrees with the Q25's on all four options (SYSVIPC,
# USER_NS and PID_NS all unset), and it is the same SoC and the same mgk
# kernel, so the same result is expected. Expected is not measured: confirm
# with check-kmi.sh against this device's own 345 stock modules before
# flashing.
#
# Userland consequences, and they are real:
#   - No SysV IPC. Watch Qt's QSharedMemory / QSystemSemaphore, which fall back
#     to POSIX only on some platforms. POSIX shm and semaphores are unaffected.
#   - LXC must not unshare the IPC or user namespaces. PID_NS is available.
#
# The escape hatch was needed, 15 Sep 2026. SysV IPC turned out to be
# load-bearing: libPmLogLib calls shmget()/shmat(), and with SYSVIPC off every
# PmLogCtl call blocks forever waiting for com.webos.pmlogd to answer. That is
# not a logging inconvenience - surface-manager.sh calls PmLogCtl on its first
# line, before it logs anything, so the compositor never starts and the screen
# never comes on. db8-maindb, db8-mediadb, bluebinder and camera-droid-heal die
# the same way, all on a 90s timeout with no output of their own. The same
# userland is fine on sargo, tissot and MindPhone, whose kernels have
# CONFIG_SYSVIPC=y; this is the one place where holding the option out is
# visible from userspace.
#
# So SYSVIPC is on, with 0001-GKI-park-SYSVIPC-task_struct-fields-in-ABI-padding.patch
# doing what that Halium commit does: sysvsem/sysvshm move into the reserved
# ANDROID_KABI padding, genksyms still sees "u64 android_kabi_reservedN", and
# the CRCs do not move. Verify with check-kmi.sh before flashing - the whole
# point of the patch is that the 345 stock modules still load.
#
# IPC_NS stays OFF. It is not needed for shmget(), it reaches into different
# structures, and LXC is already told not to unshare it
# (lxc.namespace.keep = ipc user). Enable one thing at a time.
CONFIG_PID_NS=y
CONFIG_CHECKPOINT_RESTORE=y
# CONFIG_USER_NS is not set
CONFIG_SYSVIPC=y
# CONFIG_SYSVIPC_SYSCTL is deliberately left unset: it only adds /proc/sys/kernel
# ipc knobs, and every extra option is another chance to move a struct.
# CONFIG_IPC_NS is not set

# ---------------------------------------------------------------------------
# 4. Command line
#
# The first five tokens are the stock value, verbatim - the MP01's stock
# CONFIG_CMDLINE is character-for-character the Q25's. Added: selinux=0,
# console=tty0, and the cgroup v1 pair, which the Android container needs and
# systemd reads off /proc/cmdline. There is no other route to get them there:
# the boot image's own cmdline is at the mercy of a MediaTek lk that eats its
# first 20 characters.
#
# CONFIG_CMDLINE_EXTEND is already y in stock, so whatever the bootloader does
# supply is appended to this rather than replacing it.
# ---------------------------------------------------------------------------
CONFIG_CMDLINE="stack_depot_disable=on kasan.stacktrace=off kvm-arm.mode=protected cgroup_disable=pressure cgroup.memory=nokmem selinux=0 console=tty0 systemd.unified_cgroup_hierarchy=0 SYSTEMD_CGROUP_ENABLE_LEGACY_FORCE=1"
CONFIG_CMDLINE_EXTEND=y

# ---------------------------------------------------------------------------
# 5. USB device controller, built in
#
# MEASURED, not assumed: with CONFIG_USB_MTU3=m (as stock) there is no UDC at
# all. /sys/class/udc stays empty even after loading the vendor's Type-C chain
# (tcpc_class, tcpc_mt6375, tcpci_late_sync - which the working Droidian MT6789
# port says USB setup requires). Confirmed on hardware via a reboot-loop probe,
# the only signalling channel this device has.
#
# The reason: stock sets CONFIG_USB_MTU3=m but **ships no mtu3.ko**, in neither
# the vendor_boot ramdisk nor vendor_dlkm - checked across all 345 modules.
# Nothing in the vendor set can create a UDC, so on stock the gadget must come
# from something we do not have.
#
# drivers/usb/mtu3 IS in the xelex tree, so build it in. Then the UDC exists
# from boot with no dependency on any vendor module, and the initramfs debug
# channel - adb, telnet, acm - comes up before anything else can go wrong. On a
# device with no UART and an E Ink panel, that channel is the difference
# between debugging and guessing.
CONFIG_USB_MTU3=y
CONFIG_USB_MTU3_GADGET=y

# ---------------------------------------------------------------------------
# 6. Framebuffer console - TRIED AND IMPOSSIBLE, do not retry
#
# The idea was sound: this device has no UART, no working USB gadget and no
# usable expdb, but it does have a DRM panel, and E Ink *holds its last image*
# after a hang - which would make the screen the best post-mortem channel
# available. CONFIG_VT=y is already set; it paints nowhere because stock leaves
# CONFIG_FB and DRM_FBDEV_EMULATION unset (Android needs no text console).
#
# Turning them on does not work, for two independent reasons:
#
#  1. MediaTek's own drivers/gpu/drm/mediatek/mediatek_v2/mtk_drm_fbdev.c does
#     not compile. It is dead code in stock, and has bitrotted against its own
#     driver: "no member named 'fbdev_bo' in 'struct mtk_drm_private'",
#     "conflicting types for 'mtk_drm_lcm_is_connect'", "redefinition of
#     'tag_videolfb'".
#  2. Even patched, it would not help. CONFIG_DRM_MEDIATEK=m and we run the
#     *stock* mediatek-drm.ko, which was built without fbdev emulation - so no
#     /dev/fb0 appears at runtime regardless of what our tree compiles.
#
# A console on this panel would require shipping our own mediatek-drm.ko, which
# means abandoning the keep-stock-vendor-modules arrangement the whole port
# rests on. Not worth it.
#
# (CONFIG_TOUCHSCREEN_HIMAX_CHIPSET was disabled in tree-fixup.cfg for the same
# experiment - that one is harmless and can stay, the MP01 uses FocalTech.)

# ---------------------------------------------------------------------------
# 7. ThinLTO, because Full LTO makes every build a 20-minute wall
#
# The stock config sets CONFIG_LTO_CLANG_FULL, which links the whole kernel as
# one translation unit. ld.lld then runs essentially single-threaded - measured
# here at 93.6% of one core with nlwp=1 - so a 32-core/64-thread machine builds
# no faster than a laptop, and every kernel iteration costs ~20 minutes.
#
# ThinLTO parallelises the link across cores for the same optimisation class.
# Measured on this device: 6m04s vs ~20min, for an identical result.
#
# No KMI risk: LTO affects codegen, not struct layout, and genksyms computes
# CRCs from the source types. Verified by check-kmi.sh either way - run it
# after changing this, like any other kernel change.
# CONFIG_LTO_CLANG_FULL is not set
CONFIG_LTO_CLANG_THIN=y
