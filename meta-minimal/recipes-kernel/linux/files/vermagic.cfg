# Make our kernel's vermagic string match the stock modules' exactly.
#
# This is not cosmetic. On this device the *storage* and *USB* controllers are
# vendor modules (CONFIG_SCSI_UFS_MEDIATEK=m -> ufs-mediatek-mod.ko,
# CONFIG_MMC_MTK=m -> mtk-mmc.ko, musb_hdrc.ko), so the initramfs has to insmod
# them before it can find userdata or bring up an adb gadget. The initramfs has
# only **busybox** insmod/modprobe, which cannot pass MODULE_INIT_IGNORE_VERMAGIC,
# and CONFIG_MODULE_FORCE_LOAD is not set in the stock config either - so the
# vermagic has to genuinely match or nothing loads.
#
# Stock modules carry:
#   5.10.233-android12-9-gdeb4d30d3489 SMP preempt mod_unload modversions aarch64
#
# Everything after the release string already matches (same SMP, PREEMPT,
# MODULE_UNLOAD and MODVERSIONS settings, since we build the stock config). Only
# the release differs, and it has two parts:
#
#   5.10.233   the Makefile's SUBLEVEL - see the recipe, which rewrites it
#   -android12-9-gdeb4d30d3489   this, plus LOCALVERSION_AUTO off so kbuild does
#                                not append its own "-g<sha>" or a "+"
#
# This used to need an honesty note, because the source was really 5.10.198 (the
# Q25's tree) and `uname -r` overstated the sublevel by 35 stable releases. Since
# the switch to minimalcompany/mp01-kernel the tree is genuinely 5.10.233 and the
# sublevel needs no rewriting at all; only CONFIG_LOCALVERSION below is still
# required, to reproduce the "-android12-9-gdeb4d30d3489" suffix and to stop
# kbuild appending its own. check-kmi.sh remains the gate either way.
#
# The alternative was CONFIG_MODULE_FORCE_LOAD=y plus kmod in the initramfs so
# `insmod --force-vermagic` could be used. Rejected: it needs two changes rather
# than one, and force-loading permanently disables the check, so a *real* future
# mismatch would stop being caught.
CONFIG_LOCALVERSION="-android12-9-gdeb4d30d3489"
# CONFIG_LOCALVERSION_AUTO is not set
