# Reconcile the MP01's stock config with the tree we are building it on.
#
# This is NOT part of the LuneOS delta and is applied unconditionally, including
# for the LUNEOS_KERNEL_FRAGMENT = "0" baseline. It exists only because this
# recipe builds the *xelex* MT6789 tree against the *MP01's* stock .config (see
# the recipe's DESCRIPTION), and a handful of MediaTek config options are not
# booleans but **strings naming source subdirectories to descend into**.
# olddefconfig cannot drop those the way it silently drops unknown symbols: the
# symbol exists in this tree, only the directories it names do not, so kbuild
# gets as far as "No rule to make target .../focaltech_touch/Makefile" and dies.
#
# Both options below build *modules* and neither affects a struct layout, so
# rewriting them cannot move an exported-symbol CRC - which is what makes this
# safe to do before the KMI check rather than something the KMI check has to
# forgive. And we do not lose the drivers: they come from the MP01's own stock
# vendor .ko set, which is the entire arrangement here.
#
# The list is closed, not open-ended. The MP01 and Q25 stock configs differ in
# value on exactly four shared options, and the Q25 already builds on this tree,
# so any option carrying the Q25's value is proven fine. Of the four, two are
# these; the other two are CONFIG_USB_NET_AX88179_178A and CONFIG_USB_NET_AX8817X
# (y here, m on the Q25), which are ordinary tristates and need nothing.

# Stock: "GT9886 GT9896S NT36672C focaltech_touch"
#
# The xelex tree's drivers/input/touchscreen has GT9886, GT9896S and NT36672C
# but no focaltech_touch - the Q25 uses Synaptics DSX and a Q20-specific driver
# instead. The MP01's panel is FocalTech (CONFIG_TOUCHSCREEN_FTS=m,
# focaltech_touch.ko, the i2c 0x38 device behind the fts_* sysfs attributes), and
# that module ships in vendor_dlkm, so dropping it here costs nothing.
CONFIG_TOUCHSCREEN_MTK_TOUCH="GT9886 GT9896S NT36672C"

# Stock: "s5k3p3sp_mipi_raw bf2553l_mipi_raw"
#
# Neither sensor directory exists in this tree (it carries 42 others, including
# the Q25's imx111/s5kjn1 pair, but not these two). Emptied rather than
# substituted: building some *other* device's sensor drivers would be worse than
# building none, and the real ones are in the stock module set like everything
# else.
CONFIG_CUSTOM_KERNEL_IMGSENSOR=""

# The Himax touchscreen driver does not compile with CONFIG_FB=y.
#
#   drivers/input/touchscreen/hxchipset/himax_common.h:107:9:
#       error: 'HX_CONFIG_FB' macro redefined
#
# It defines its own HX_CONFIG_FB when CONFIG_FB is unset, and redefines it when
# the kernel provides one - harmless on stock, where Android never enables the
# framebuffer, and fatal for us because we need CONFIG_FB for a console on the
# E Ink panel (see luneos.cfg section 6).
#
# Safe to drop: the MP01's touchscreen is FocalTech (focaltech_touch.ko,
# CONFIG_TOUCHSCREEN_FTS), and himax is a module in stock anyway, so the device
# keeps whatever it actually uses from its own vendor set. This only stops us
# building a driver for hardware this phone does not have.
# CONFIG_TOUCHSCREEN_HIMAX_CHIPSET is not set
