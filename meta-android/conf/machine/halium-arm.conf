#-----------------------------------------------------------------------------
#@TYPE: Machine
#@NAME: Generic Halium arm
#@DESCRIPTION: One LuneOS rootfs for every 32-bit arm Treble-capable device.
#
# The 32-bit sibling of halium-arm64.conf - see that file for the split
# between what lands here (the rootfs) and what a device machine builds
# instead (the boot image). The same generic-rootfs-qa check applies.
#
# Unlike halium-arm64, there is no device in this tree that only exists to
# feed this machine a boot image the way sargo does for halium-arm64: the
# 32-bit devices here (mindphone, and the much older hammerhead-halium and
# tenderloin-halium) each still build their own complete, self-contained
# image. mindphone is the intended first consumer - it is Treble (MT6739,
# Android 11) where hammerhead and tenderloin predate Treble entirely, which
# is why it shares the "halium-arm" override (see mindphone.conf).
#
# On cortexa8 deliberately, not a fully generic armv7a tune: mindphone,
# hammerhead-halium and tenderloin-halium are already pinned there for sstate
# reuse among themselves, and putting this machine on the same tune extends
# that sharing instead of starting a second, incompatible one. A future
# 32-bit Treble device on a different core would not get free sstate reuse
# from this either way, so there is nothing this loses by not being generic.
# waydroid.bb's PACKAGE_ARCH:mindphone exists because of this - see there.
#-----------------------------------------------------------------------------

require conf/machine/include/arm/armv7a/tune-cortexa8.inc

TARGET_ARCH = "arm"

require conf/machine/include/meta-android-halium.inc

# No kernel. virtual/kernel still has to resolve for the image to build, so
# point it at the stub rather than any device's tree.
PREFERRED_PROVIDER_virtual/kernel = "linux-dummy"
MACHINE_ESSENTIAL_EXTRA_RDEPENDS = ""
MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS = ""

# No GSI either, same reasoning as halium-arm64: the vendor pairing is a
# runtime property of whichever device boots this rootfs.
VIRTUAL-RUNTIME_android-system-image = ""

MACHINE_FEATURES = "alsa bluetooth gps usbgadget usbhost phone wifi vfat ext2 keyboard nfc"

# Deliberately no MACHINE_DISPLAY_*, no XSERVER: same reasoning as
# halium-arm64 - geometry and the display stack are read at runtime, not
# baked into a rootfs meant to boot on more than one device.

IMAGE_FSTYPES = "ext4 tar.gz"
IMAGE_ROOTFS_EXTRA_SPACE = "200000"

# Carried over from halium-arm64's headers pin - the libhybris
# bionic_elf_tls.cpp gate that forces 16.0 there is generic bionic code, not
# arm64-specific. Confirmed on mindphone (32-bit, cortexa8): 16.0 is right
# there too, so this isn't just carried over by analogy from arm64 hardware.
PREFERRED_VERSION_android-headers-halium = "16.0%"

# Treble-era GSI assumption, same as sargo and mindphone: the "modern" droid
# modules rather than the jb2q ones the halium include defaults to.
PREFERRED_VERSION_pulseaudio-modules-droid = "17.0.103%"

# Machine-check the genericity claim - see generic-rootfs-qa.bbclass.
IMAGE_CLASSES += "generic-rootfs-qa"
