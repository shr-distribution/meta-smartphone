#-----------------------------------------------------------------------------
#@TYPE: Machine
#@NAME: Generic Halium arm64
#@DESCRIPTION: One LuneOS rootfs for every arm64 Treble device.
#
# This machine builds the rootfs and nothing else. The two other pieces of a
# LuneOS install are separate products:
#
#   boot image   per device - a GKI kernel repacked for it (Tier A), or its
#                vendor kernel (Tier B). Built from a device machine such as
#                sargo.conf, which keeps its kernel for exactly that reason.
#   system.img   the Halium GSI, chosen at install time from the device's
#                vendor API level. Not baked in here - see below.
#
# The point of it is the package feed. A rootfs is only universal if nothing in
# it is MACHINE_ARCH, so anything landing in tmp/deploy/ipk/halium-arm64/ that
# is not an OpenEmbedded machine-config package (base-files, opkg-arch-config,
# systemd-conf, packagegroup-*, ...) is a porting bug: it belongs in the
# adaptation data instead.
#-----------------------------------------------------------------------------

require conf/machine/include/arm/arch-arm64.inc
require conf/machine/include/meta-android-halium.inc

# No kernel. virtual/kernel still has to resolve for the image to build, so
# point it at the stub rather than any device's tree.
PREFERRED_PROVIDER_virtual/kernel = "linux-dummy"
MACHINE_ESSENTIAL_EXTRA_RDEPENDS = ""
MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS = ""

# No GSI either. packagegroup-luneos-extended is the only consumer of this, so
# leaving it empty keeps system.img out of the rootfs - the split the target
# architecture wants, where rootfs.img and system.img sit side by side in
# userdata and the GSI can be swapped without rebuilding the rootfs.
VIRTUAL-RUNTIME_android-system-image = ""

MACHINE_FEATURES = "alsa bluetooth gps usbgadget usbhost phone wifi vfat ext2 keyboard nfc"

# Deliberately no MACHINE_DISPLAY_*: geometry has to be read from the device at
# runtime. Until that service exists the packages that consume these will still
# be MACHINE_ARCH, and the feed check above is what keeps that visible.

# Deliberately no XSERVER: the device machines carry xserver-xorg and
# xf86-video-fbdev, which a hwcomposer-based stack does not use.

IMAGE_FSTYPES = "ext4 tar.gz"
IMAGE_ROOTFS_EXTRA_SPACE = "200000"

# One headers version for the whole rootfs, where a device machine sets its
# own. 11.0 rather than the 13.0 the plan suggested: 11.0 is the only version
# with libhybris verified on hardware, currently against a 12L vendor, and
# changing the machine and the HAL headers in one step would make any failure
# ambiguous. Bumping it is a separate, testable change.
PREFERRED_VERSION_android-headers-halium = "11.0%"
