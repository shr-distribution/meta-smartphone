# We have a conf and classes directory, append to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a recipes directory, add to BBFILES
BBFILES += "${LAYERDIR}/recipes*/*/*.bb ${LAYERDIR}/recipes*/*/*.bbappend"

BBFILE_COLLECTIONS += "android-layer"
BBFILE_PATTERN_android-layer := "^${LAYERDIR}/"
BBFILE_PRIORITY_android-layer = "7"

LAYERDEPENDS_android-layer = "core openembedded-layer"

LAYERSERIES_COMPAT_android-layer = "wrynose"

# lib/halium/bootimg.py, shared by kernel_android.bbclass and
# gki_bootimg.bbclass. Modern bitbake does not put a layer's lib/ on sys.path
# by itself - without this the classes fail at runtime with
# "ModuleNotFoundError: No module named 'halium'".
addpylib ${LAYERDIR}/lib halium

SIGGEN_EXCLUDERECIPES_ABISAFE += "libhybris"

FREESMARTPHONE_GIT = "git://github.com/freesmartphone"

# The initramfs debug shells (root with no password: telnetd -l /bin/sh, a
# getty -l /bin/sh, adbd, /bin/sh on a failed boot, busybox telnetd in the
# image) are for debug builds only. Set INITRAMFS_DEBUG_SHELL = "1" to have
# them; a LUNEOS_ENABLE_ADB = "1" debug boot image (see the Halium kernel
# recipes) turns them on too, since that is what it is built for. Kept the
# same in meta-android and meta-mainline: a weak default, the last parsed wins.
INITRAMFS_DEBUG_SHELL ??= "${@'1' if d.getVar('LUNEOS_ENABLE_ADB') == '1' else '0'}"
