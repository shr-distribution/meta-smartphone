# Select deep (suspend-to-RAM) rather than s2idle when the system suspends.
#
# Halium kernels that expose /sys/power/mem_sleep tend to default to s2idle,
# the shallow suspend-to-idle state that leaves clocks and rails powered and
# saves very little on this class of hardware; the Android these devices
# shipped with used real suspend-to-RAM. The "w-" form makes the write a no-op
# rather than an error on kernels that predate mem_sleep or lack a deep state.
# A machine that genuinely wants s2idle can shadow this fragment by shipping
# its own mem-sleep.conf.
w- /sys/power/mem_sleep - - - - deep
