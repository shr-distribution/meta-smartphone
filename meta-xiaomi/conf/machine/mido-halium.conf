#-----------------------------------------------------------------------------
#@TYPE: Machine
#@NAME: Xiaomi Redmi Note 4 (Snapdragon) (codename mido) 
#@DESCRIPTION: Machine configuration for the Xiaomi Redmi Note 4 (Snapdragon) (Halium)
#-----------------------------------------------------------------------------

require conf/machine/include/arm/arch-arm64.inc
require conf/machine/include/meta-android-halium.inc

PREFERRED_PROVIDER_virtual/kernel ?= "linux-xiaomi-mido-halium"
MACHINE_KERNEL_PR = "r1"

MACHINE_FEATURES = "apm alsa bluetooth gps usbgadget usbhost phone wifi vfat ext2 keyboard nfc"
MACHINE_DISPLAY_WIDTH_PIXELS = "1080"
MACHINE_DISPLAY_HEIGHT_PIXELS = "1920"
MACHINE_DISPLAY_ORIENTATION = "0"
MACHINE_DISPLAY_PPI = "403"

PREFERRED_VERSION_android-headers-halium = "9.0%"
VIRTUAL-RUNTIME_android-system-image = "android-system-image-mido-halium"
ANDROID_HEADERS_DEFINES = "QCOM_BSP QTI_BSP QCOM_HARDWARE"

PREFERRED_PROVIDER_virtual/xserver = "xserver-xorg"
XSERVER = " \
    xserver-xorg \
    xf86-input-evdev \
    xf86-video-fbdev \
"

# We need fsck.vfat for vfat partitions we need to mount
# Also, include the wlan module for the kernel
# connman's wireguard VPN plugin talks the kernel's WireGuard netlink family
# directly rather than shelling out to wg-quick, so it needs a kernel-side
# WireGuard. This kernel predates 5.6, where WireGuard became an in-tree
# driver, so it comes from the wireguard-linux-compat backport that
# wireguard-module builds out-of-tree. Nothing pulls that in on its own - the
# generic Halium rootfs cannot, having no kernel at all - and this machine
# builds its own complete image, so it is named here.
#
# Name the recipe's meta package, not kernel-module-wireguard. The split
# package only gains RPROVIDES:kernel-module-wireguard inside
# split_kernel_module_packages during do_package, so that name has no
# parse-time provider from this recipe (neither module.bbclass nor
# kernel-module-split.bbclass sets PACKAGES_DYNAMIC). The only recipe claiming
# it at parse time is the kernel, via PACKAGES_DYNAMIC "^kernel-module-.*" in
# kernel.bbclass - and this pre-5.6 kernel has no WireGuard to build, so the
# ask resolved to a package nobody ever produced and do_rootfs died with "No
# candidates to install kernel-module-wireguard". wireguard-module is a real
# package name at parse time (module.bbclass sets KERNEL_MODULES_META_PACKAGE
# = "${PN}", and kernel-module-split makes it RDEPEND on every module the
# recipe splits out), so it resolves straight to the recipe.
MACHINE_EXTRA_RDEPENDS = " \
    android-kernel-bootimg \
    dosfstools \
    kernel-module-wlan \
    wireguard-module \
"

KERNEL_IMAGETYPE = "Image.gz-dtb"
IMAGE_FSTYPES += "tar.gz"
IMAGE_ROOTFS_EXTRA_SPACE = "200000"

ANDROID_BOARD_BOOTIMAGE_PARTITION = "/dev/block/mmcblk0p21"
ANDROID_BOARD_SYSTEMIMAGE_PARTITION_SIZE = "3221225472"
ANDROID_BOARD_FLASH_BLOCK_SIZE = "131072"

SERIAL_CONSOLE = "115200 ttyHSL0"


