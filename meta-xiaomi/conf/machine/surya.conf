#-----------------------------------------------------------------------------
#@TYPE: Machine
#@NAME: Xiaomi POCO X3 NFC (codename surya)
#@DESCRIPTION: Machine configuration for the POCO X3 NFC / POCO X3, SM7150
#
# This machine exists to build the *boot image*, the way halium-arm64.conf says
# a device machine should: the rootfs comes from MACHINE=halium-arm64 and the
# GSI is chosen at install time from the device's vendor API level. What comes
# out of here is:
#
#   MACHINE=surya bitbake initramfs-android-image   the Halium initramfs
#   MACHINE=surya bitbake linux-xiaomi-surya        boot.img (kernel + initrd)
#
# Tier B: SM7150 predates GKI, so the kernel is built per device from the
# LineageOS 4.14 tree the /e/OS build on this phone already runs - see
# linux-xiaomi-surya_git.bb.
#
# Target vendor is /e/OS A15 (community, lineage-22.x), i.e. vendor API level
# 35 - not stock MIUI. surya's last MIUI is V14.0.x on Android 12; the port
# assumes the /e/OS vendor because that is what the device runs.
#
# Layout facts, all read out of the shipping /e/OS boot.img
# (e-4.2-a15-20260816663279-community-surya), not out of a BoardConfig:
# header v2, 4096 byte pages, A-only (a real recovery partition, no slot
# suffix), a real 8 GB `super` with dynamic partitions - launched on Android 10,
# so no retrofit - and a separate dtbo.img. No vendor_boot and no init_boot:
# the ramdisk rides in boot, so there is exactly one image to flash.
#-----------------------------------------------------------------------------

require conf/machine/include/arm/arch-arm64.inc
require conf/machine/include/meta-android-halium.inc

PREFERRED_PROVIDER_virtual/kernel ?= "linux-xiaomi-surya"
MACHINE_KERNEL_PR = "r0"

# No rootfs is built for this machine (see above), so nothing is pulled in for
# one. Same arrangement as bluejay.conf.
MACHINE_ESSENTIAL_EXTRA_RDEPENDS = ""
MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS = ""

MACHINE_FEATURES = "apm alsa bluetooth gps usbgadget usbhost phone wifi vfat ext2 nfc"

# 6.67" 1080x2400 (20:9). sqrt(1080^2+2400^2)/6.67 = 395 ppi.
# The LineageOS device tree buckets this as TARGET_SCREEN_DENSITY := 440.
# VERIFY on hardware before trusting the scaling - sargo needed a device pixel
# ratio well away from the "natural" one.
MACHINE_DISPLAY_WIDTH_PIXELS = "1080"
MACHINE_DISPLAY_HEIGHT_PIXELS = "2400"
MACHINE_DISPLAY_ORIENTATION = "0"
MACHINE_DISPLAY_PPI = "395"

# Tracks the GSI generation, not the vendor: libhybris gates its per-generation
# support on ANDROID_VERSION_MAJOR, which comes from this package. Same
# reasoning as sargo.conf, which spells it out at length.
PREFERRED_VERSION_android-headers-halium = "16.0%"

# Treble-era GSI, so the modern droid modules rather than the jb2q ones the
# halium include defaults to.
PREFERRED_VERSION_pulseaudio-modules-droid = "17.0.103%"

# No GSI baked in, as on halium-arm64 and bluejay: rootfs.img and
# android-rootfs.img sit side by side in userdata and the GSI is picked at
# install time from the device's vendor API level.
VIRTUAL-RUNTIME_android-system-image = ""

# Deliberately no XSERVER: this machine builds no rootfs, and the stack here is
# hwcomposer-based, which xf86-video-fbdev does not serve.

IMAGE_FSTYPES += "tar.gz"
IMAGE_ROOTFS_EXTRA_SPACE = "200000"

# BOARD_KERNEL_IMAGE_NAME := Image.gz in the LineageOS BoardConfig, with
# BOARD_INCLUDE_DTB_IN_BOOTIMG := true - the device tree is a header-v2 dtb
# section, not appended to the kernel (that is what the athena/tissot
# Image.gz-dtb machines do). Confirmed on the /e/OS image: the kernel section
# has no trailing FDT and the dtb section holds one.
KERNEL_IMAGETYPE = "Image.gz"

# A-only, Qualcomm, so by-name symlinks exist. Read by luneos-package.inc when
# an image package wants to name the boot partition; there is no in-tree
# consumer of a boot partition *size*, so the 128 MB from the BoardConfig is
# recorded in the kernel recipe as a comment instead of an unused variable.
ANDROID_BOARD_BOOTIMAGE_PARTITION = "/dev/block/bootdevice/by-name/boot"

# sdmmagpie.dtsi: aliases serial0 = &qupv3_se8_2uart, a qcom,msm-geni-console
# handled by drivers/tty/serial/msm_geni_serial.c, which registers ttyMSM.
# UNVERIFIED on hardware - a retail POCO X3 exposes no debug UART without a jig.
SERIAL_CONSOLE = "115200 ttyMSM0"
