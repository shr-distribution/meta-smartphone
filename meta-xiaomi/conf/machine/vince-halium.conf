#-----------------------------------------------------------------------------
#@TYPE: Machine
#@NAME: Xiaomi Redmi 5 Plus / Redmi Note 5 (codename vince)
#@DESCRIPTION: Machine configuration for the Xiaomi Redmi 5 Plus (Halium, 16.0 GSI)
#-----------------------------------------------------------------------------

# Same SoC as tissot and mido (msm8953), but not the same Android half: those two
# keep an Android 9 vendor from their own Halium 9 builds and patch the Treble gaps
# into it. vince has no Halium build. Its vendor comes from LineageOS 18.1
# (android_device_xiaomi_vince and msm8953-common, branch lineage-18.1), which is a
# real Treble vendor with BOARD_VNDK_VERSION := current, so VNDK 30, and it goes
# under the 16.0 GSI unchanged. See android-system-image-vince-halium.bb.
#
# Everything here is read from those trees and from the kernel's device tree.
# Nothing has been read off a phone yet.

require conf/machine/include/arm/arch-arm64.inc
require conf/machine/include/meta-android-halium.inc

PREFERRED_PROVIDER_virtual/kernel ?= "linux-xiaomi-vince-halium"
MACHINE_KERNEL_PR = "r0"

# No "nfc": the vendor has no NFC HAL or blobs and the LineageOS device trees never
# name one. The nq@28 node in the built device tree comes from Qualcomm's QRD
# reference dtsi, not from anything vince adds. No "keyboard": a slab, with side
# keys rather than a physical keyboard.
MACHINE_FEATURES = "apm alsa bluetooth gps usbgadget usbhost phone wifi vfat ext2 touchscreen"

# 1080x2160 (qcom,mdss-dsi-panel-{width,height} in both panels of the device tree,
# nt36672 and td4310). The PPI is the one the LineageOS device README gives ("5.9,
# ~401 PPI"). The panels' own physical dimensions are no use for it: 69 x 122 mm
# gives 398 and 450 pixels per inch, the height being a 16:9 panel's.
MACHINE_DISPLAY_WIDTH_PIXELS = "1080"
MACHINE_DISPLAY_HEIGHT_PIXELS = "2160"
MACHINE_DISPLAY_ORIENTATION = "0"
MACHINE_DISPLAY_PPI = "401"

# Tracks the GSI, not the vendor, for the reason spelled out in tissot-halium.conf.
PREFERRED_VERSION_android-headers-halium = "16.0%"

# The droid modules talk to the vendor's audio HAL, so they follow the vendor: this
# one is Android 11, which is the modern tree, not the jb2q one tissot and mido take
# for their Android 9 vendors.
PREFERRED_VERSION_pulseaudio-modules-droid = "17.0.103%"

# As on tissot, vendor.img travels inside the rootfs: LineageOS keeps /vendor on the
# cust partition (fstab.qcom), and the install should not depend on what a given
# phone has there.
VIRTUAL-RUNTIME_android-system-image = "android-system-image-vince-halium"
ANDROID_HEADERS_DEFINES = "QCOM_BSP QTI_BSP QCOM_HARDWARE"

PREFERRED_PROVIDER_virtual/xserver = "xserver-xorg"
XSERVER = " \
    xserver-xorg \
    xf86-input-evdev \
    xf86-video-fbdev \
"

# The Wi-Fi driver is a module (luneos.cfg), as on tissot, so that
# wifi-module-load.service can bring it up once the container is running.
# wireguard-module and v4l2loopback are out-of-tree: see tissot-halium.conf for why
# the recipes' meta packages are named rather than kernel-module-*.
MACHINE_EXTRA_RDEPENDS = " \
    android-kernel-bootimg \
    dosfstools \
    kernel-module-wlan \
    wireguard-module \
    v4l2loopback \
"

KERNEL_IMAGETYPE = "Image.gz-dtb"
IMAGE_FSTYPES += "tar.gz ext4 userdataimg"
IMAGE_ROOTFS_EXTRA_SPACE = "200000"

# luneos-dev-fastboot-package: the first install through a TWRP zip stopped with a
# truncated tarball on /data, and the zip's script checks neither the mount nor the
# copy. A userdata image needs no recovery and leaves userdata plain ext4 whatever
# was on it. One boot partition, and the LineageOS board configuration has no AVB,
# so no vbmeta. See meta-android's classes/userdataimg.bbclass.
IMAGE_CLASSES += "userdataimg"
FASTBOOT_BOOT_PARTITIONS = "boot"
FASTBOOT_VBMETA_PARTITION = ""

# From the LineageOS device trees: the fstab names partitions under
# /dev/block/bootdevice/by-name (no phone was at hand to read a partition number
# from), BoardConfigCommon.mk gives the sizes.
ANDROID_BOARD_BOOTIMAGE_PARTITION = "/dev/block/bootdevice/by-name/boot"
ANDROID_BOARD_SYSTEMIMAGE_PARTITION_SIZE = "3221225472"
ANDROID_BOARD_FLASH_BLOCK_SIZE = "131072"

SERIAL_CONSOLE = "115200 ttyHSL0"

# A rear-mounted reader: the device tree has both a Goodix and an FPC node, and the
# vendor's android.hardware.biometrics.fingerprint@2.1-service.xiaomi_msm8953 picks.
MACHINE_FEATURES += "fingerprint"

# 12 MP on the back, 5 MP on the front (the LineageOS device README).
MACHINE_FEATURES += "camera-rear camera-front"

# Infrared transmitter: a Peel chip on SPI (compatible "peel_ir" in vince-qrd.dtsi),
# as on tissot, reached through the vendor's android.hardware.ir@1.0-service.
MACHINE_FEATURES += "ir-blaster"
