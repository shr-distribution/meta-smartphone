#-----------------------------------------------------------------------------
#@TYPE: Machine
#@NAME: Xiaomi MiMax 2 (codename oxygen)
#@DESCRIPTION: Machine configuration for the Xiaomi Mi Max 2
#-----------------------------------------------------------------------------

require conf/machine/include/arm/arch-arm64.inc
require conf/machine/include/meta-android-halium.inc

PREFERRED_PROVIDER_virtual/kernel ?= "linux-xiaomi-oxygen"
MACHINE_KERNEL_PR = "r0"

# No "nfc": the Mi Max 2 has no NFC controller. No "keyboard" either - a slab,
# with side keys rather than a physical keyboard. The rear-mounted fingerprint
# reader is real, and this is a Halium machine, so biomd has a HAL to reach.
MACHINE_FEATURES = "apm alsa bluetooth gps usbgadget usbhost phone wifi vfat ext2 touchscreen fingerprint"
MACHINE_DISPLAY_WIDTH_PIXELS = "1080"
MACHINE_DISPLAY_HEIGHT_PIXELS = "1920"
MACHINE_DISPLAY_ORIENTATION = "0"
MACHINE_DISPLAY_PPI = "342"

PREFERRED_VERSION_android-headers-halium = "7.1%"
VIRTUAL-RUNTIME_android-system-image = "android-system-image-oxygen"
ANDROID_HEADERS_DEFINES = "QCOM_BSP QTI_BSP QCOM_HARDWARE"

PREFERRED_PROVIDER_virtual/xserver = "xserver-xorg"
XSERVER = " \
    xserver-xorg \
    xf86-input-evdev \
    xf86-video-fbdev \
"

# We need fsck.vfat for vfat partitions we need to mount
# Also, include the wlan module for the kernel
MACHINE_EXTRA_RDEPENDS = " \
    android-kernel-bootimg \
    dosfstools \
    kernel-module-wlan \
"

KERNEL_IMAGETYPE = "Image.gz-dtb"
IMAGE_FSTYPES += "tar.gz"
IMAGE_ROOTFS_EXTRA_SPACE = "200000"

ANDROID_BOARD_BOOTIMAGE_PARTITION = "/dev/block/mmcblk0p59"
ANDROID_BOARD_SYSTEMIMAGE_PARTITION_SIZE = "3221225472"
ANDROID_BOARD_FLASH_BLOCK_SIZE = "131072"

SERIAL_CONSOLE = "115200 ttyHSL0"

# 12 MP on the back, 5 MP on the front. camera-front is what installs
# luneos-faced, and the pair is what installs the camera app.
MACHINE_FEATURES += "camera-rear camera-front"
