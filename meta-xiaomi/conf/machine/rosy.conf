#-----------------------------------------------------------------------------
#@TYPE: Machine
#@NAME: Xiaomi Redmi 5 (Snapdragon) (codename rosy)
#@DESCRIPTION: Machine configuration for the Xiaomi Redmi 5 (Snapdragon)
#-----------------------------------------------------------------------------

require conf/machine/include/arm/arch-arm64.inc

PREFERRED_PROVIDER_virtual/kernel ?= "linux-xiaomi-rosy"
MACHINE_KERNEL_PR = "r0"

# No "nfc": the Redmi 5 has no NFC controller. No "keyboard" either - a slab,
# with side keys rather than a physical keyboard.
#
# No "fingerprint", and that one IS present as hardware: a rear-mounted reader.
# This is a mainline-kernel machine with no Android container, and
# FINGERPRINT_RDEPENDS is biomd, which reaches the Android fingerprint HAL
# through libgbinder. Nothing answers it here.
MACHINE_FEATURES = "apm alsa bluetooth gps usbgadget usbhost phone wifi vfat ext2 touchscreen"
MACHINE_DISPLAY_WIDTH_PIXELS = "1080"
MACHINE_DISPLAY_HEIGHT_PIXELS = "1920"
MACHINE_DISPLAY_ORIENTATION = "0"
MACHINE_DISPLAY_PPI = "403"

PREFERRED_PROVIDER_virtual/libgl ?= "mesa"
PREFERRED_PROVIDER_virtual/libgbm ?= "mesa"
PREFERRED_PROVIDER_virtual/egl ?= "mesa"
PREFERRED_PROVIDER_virtual/mesa ?= "mesa"
PREFERRED_PROVIDER_virtual/libgles1 ?= "mesa"
PREFERRED_PROVIDER_virtual/libgles2 ?= "mesa"
PREFERRED_PROVIDER_libgbm ?= "mesa"

# Not using Halium, it's a mainline kernel
VIRTUAL-RUNTIME_android-initramfs-scripts = "initramfs-scripts-android"

PREFERRED_PROVIDER_virtual/xserver = "xserver-xorg"
XSERVER = " \
    xserver-xorg \
    xf86-input-evdev \
    xf86-video-fbdev \
"

# We need fsck.vfat for vfat partitions we need to mount
# Also, include the wlan module for the kernel
MACHINE_EXTRA_RDEPENDS = " \
    msm-firmware-loader \
    firmware-xiaomi-rosy \
    kernel-modules \
    dosfstools \
"

#KERNEL_IMAGETYPE = "Image.gz-dtb"
KERNEL_IMAGETYPE = "Image.gz"
KERNEL_DEVICETREE = "qcom/sdm450-xiaomi-rosy.dtb"
IMAGE_FSTYPES += "tar.gz"
IMAGE_ROOTFS_EXTRA_SPACE = "200000"

ANDROID_BOARD_BOOTIMAGE_PARTITION = "/dev/block/mmcblk0p21"
ANDROID_BOARD_SYSTEMIMAGE_PARTITION_SIZE = "3221225472"
ANDROID_BOARD_FLASH_BLOCK_SIZE = "131072"

SERIAL_CONSOLE = "115200 ttyMSM0"

# 12 MP on the back, 5 MP on the front. Unlike nfcd and biomd the camera half
# of packagegroup-luneos-extended is the camera app plus v4l-utils, which go
# through V4L2 rather than binder, so the topology is worth declaring on a
# mainline machine too.
MACHINE_FEATURES += "camera-rear camera-front"
