# tissot's vendor is Android 9 (VNDK 28) and its audio HAL,
# /vendor/lib64/hw/audio.primary.msm8953.so, needs set_sched_policy - a symbol
# the Android 16 GSI's libcutils no longer exports, having moved it to
# libprocessgroup. Without this the HAL cannot be dlopened:
#
#   cannot locate symbol "set_sched_policy" referenced by
#     "/android/vendor/lib64/hw/audio.primary.msm8953.so"
#   droid-util.c: Failed to load audio hw module audio.primary : Invalid argument
#
# module-droid-card then never loads, module-droid-hidl aborts the daemon, and
# audiod - which requires this unit - never starts either.
#
# HYBRIS_PREFER_VNDK makes hybris resolve on behalf of /vendor callers out of
# the VNDK APEX named by /vendor/etc/selinux/plat_sepolicy_vers.txt (28.0 here,
# injected by android-system-image-tissot).
#
# Deliberately shipped per-machine rather than in the shared pulseaudio unit,
# which documents why it must not be global: on sargo the same variable breaks
# the daemon outright, because /apex/com.android.vndk.v32's libbinder does not
# export android::binder::os::get_trace_enabled_tags() that the GSI's
# libbinder_ndk requires. That is a v32 problem and does not apply to v28.
# pulseaudio is aarch64-halium, not MACHINE_ARCH, so a bbappend there would be
# shared with sargo - hence a machine unit package instead.
#
# Verified on device: pulseaudio active, 33 sinks, module-droid-card loaded.
[Service]
Environment=HYBRIS_PREFER_VNDK=1
