# LuneOS / Halium kernel config delta - Xiaomi POCO X3 NFC (surya, SM7150)
#
# Merged on top of arch/arm64/configs/surya_defconfig
# (LineageOS/android_kernel_xiaomi_surya, lineage-22.2, 4.14.356-openela-rc1).
#
# Sized against the config extracted with IKCONFIG from the shipping /e/OS
# kernel (e-4.2-a15-20260816663279-community-surya): mer_verify_kernel_config
# scores that config 8 errors / 54 warnings. Every entry below is either one of
# those errors or a known-required item for the LuneOS stack; accepted
# deviations are documented at the bottom.
#
# Note on this device: CONFIG_QCA_CLD_WLAN=y - wifi (qcacld-3.0) is built into
# the kernel, and the stock config carries exactly one loadable module
# (MMC_TEST=m). There are therefore no stock vendor kernel modules whose
# vermagic/CRCs a rebuild could break, so this port needs neither the Tier A
# KMI discipline nor mindphone's CONFIG_MODULE_FORCE_LOAD workaround.

# ---------------------------------------------------------------------------
# 1. mer-kernel-check ERRORS - hard requirements
# ---------------------------------------------------------------------------

# systemd: name_to_handle_at()/open_by_handle_at(), used by the mount monitor
CONFIG_FHANDLE=y

# SysV IPC is deliberately NOT enabled, which reverses the earlier call here.
#
# mer-kernel-check asks for it, and the MP01 (MT6789) bring-up found it was not
# optional: libPmLogLib called shmget()/shmat(), so with SYSVIPC off every
# PmLogCtl blocked forever, surface-manager-daemon never started and the screen
# stayed dark with nothing in the journal. That is fixed at the source now -
# checked against this tree's own rootfs
# (luneos-dev-image-halium-arm64 20260924122732) rather than assumed:
#
#   readelf --dyn-syms usr/lib/libPmLogLib.so.3.3.0 | grep shm
#     -> UND shm_open@GLIBC_2.34     (POSIX shm, needs no SysV IPC)
#
# and no shmget/shmat/semget import anywhere in it. A full scan of usr/{lib,bin,
# sbin,libexec} finds real callers only in libc itself, libasound, libdevmapper,
# libcrypto, libperl, ntpd and the util-linux/valgrind IPC tools - nothing on
# the LuneOS boot path. The only QSharedMemory users are the two Qt Wayland
# shm-emulation-server plugins, which the hwcomposer path does not use.
#
# So this now matches the GKI devices, where SYSVIPC is KMI-poison and has to
# stay off, instead of diverging from them for no benefit.
#
# Consequence to keep in mind: IPC_NS goes with it (it depends on SYSVIPC), so
# LXC must not unshare the IPC namespace - "lxc.namespace.keep = ipc user", the
# same arrangement bluejay and panther run with.
# CONFIG_SYSVIPC is not set

# systemd and the Halium initrd both require a kernel-populated /dev
CONFIG_DEVTMPFS=y
CONFIG_DEVTMPFS_MOUNT=y

# Virtual console. Stock Android has no VT at all; LuneOS needs it for the
# console and for VT switching.
CONFIG_VT=y
CONFIG_VT_CONSOLE=y
CONFIG_CONSOLE_TRANSLATIONS=y
CONFIG_UNIX98_PTYS=y

# UTF-8 filenames
CONFIG_NLS_UTF8=y

# Stock sets CONFIG_STATIC_USERMODEHELPER=y with STATIC_USERMODEHELPER_PATH=""
# - an empty path disables *every* call_usermodehelper(), i.e. request_module(),
# core dumps and the firmware fallback loader. Android never calls them; LuneOS
# does.
# CONFIG_STATIC_USERMODEHELPER is not set

# ---------------------------------------------------------------------------
# 2. Namespaces - required by the LXC Android container
# ---------------------------------------------------------------------------
CONFIG_NAMESPACES=y
CONFIG_UTS_NS=y
# IPC_NS depends on SYSVIPC, which is off above - kconfig would drop this line
# anyway. Stated as a comment so the omission reads as deliberate.
CONFIG_PID_NS=y
CONFIG_USER_NS=y
CONFIG_NET_NS=y
CONFIG_CHECKPOINT_RESTORE=y

# ---------------------------------------------------------------------------
# 3. cgroups - LXC device whitelisting + systemd resource control
#
# CGROUP_DEVICE in particular is off in the stock config and LXC needs it to
# apply lxc.cgroup.devices.* for the Android container.
# ---------------------------------------------------------------------------
CONFIG_CGROUPS=y
CONFIG_CGROUP_DEVICE=y
CONFIG_CGROUP_FREEZER=y
CONFIG_CGROUP_SCHED=y
CONFIG_CGROUP_CPUACCT=y
CONFIG_CGROUP_PERF=y
CONFIG_CGROUP_NET_PRIO=y
CONFIG_NET_CLS_CGROUP=y
CONFIG_BLK_CGROUP=y
CONFIG_MEMCG=y
CONFIG_MEMCG_SWAP=y
CONFIG_CPUSETS=y

# ---------------------------------------------------------------------------
# 4. systemd optional-but-recommended
# ---------------------------------------------------------------------------
CONFIG_FANOTIFY=y
CONFIG_FANOTIFY_ACCESS_PERMISSIONS=y
CONFIG_AUTOFS4_FS=y
CONFIG_SECURITY_YAMA=y
CONFIG_TMPFS_XATTR=y
CONFIG_TMPFS_POSIX_ACL=y
CONFIG_SECCOMP=y

# SELinux: keep it built (the Android container needs the labels) but allow
# selinux=0 / permissive from the kernel command line during bring-up. The
# stock config has SECURITY_SELINUX_DEVELOP but not the boot parameter.
CONFIG_SECURITY_SELINUX=y
CONFIG_SECURITY_SELINUX_DEVELOP=y
CONFIG_SECURITY_SELINUX_BOOTPARAM=y

# ---------------------------------------------------------------------------
# 5. Bluetooth - bluebinder talks to the container HAL over a virtual HCI
# ---------------------------------------------------------------------------
CONFIG_BT=y
CONFIG_BT_HCIVHCI=y
CONFIG_BT_RFCOMM=y
CONFIG_BT_RFCOMM_TTY=y
CONFIG_BT_BNEP=y
CONFIG_BT_BNEP_MC_FILTER=y
CONFIG_BT_BNEP_PROTO_FILTER=y
CONFIG_BT_HIDP=y
CONFIG_RFKILL=y

# HID: BT keyboards/mice via hidraw, and uinput. Already set in the stock
# config; repeated so this fragment states the whole requirement rather than
# depending on the Android defconfig keeping them.
CONFIG_HIDRAW=y
CONFIG_UHID=y
CONFIG_INPUT_UINPUT=y

# ---------------------------------------------------------------------------
# 6. Waydroid / nested containers
# ---------------------------------------------------------------------------
CONFIG_SQUASHFS=y
CONFIG_SQUASHFS_XATTR=y
CONFIG_SQUASHFS_XZ=y
CONFIG_SQUASHFS_ZLIB=y
CONFIG_VETH=y
CONFIG_TUN=y
CONFIG_NETFILTER_XT_TARGET_CHECKSUM=y
CONFIG_BRIDGE=y

# ---------------------------------------------------------------------------
# 7. connman / ofono networking bits left off by the Android defconfig
# ---------------------------------------------------------------------------
CONFIG_NETFILTER_XT_MATCH_RECENT=y
CONFIG_NETFILTER_XT_MATCH_SCTP=y
CONFIG_NETFILTER_NETLINK_ACCT=y
CONFIG_NETFILTER_XT_MATCH_NFACCT=y

# ---------------------------------------------------------------------------
# 8. Storage / misc userland conveniences
# ---------------------------------------------------------------------------
CONFIG_BLK_DEV_LOOP=y
CONFIG_BLK_DEV_NBD=y
CONFIG_FUSE_FS=y
CONFIG_CUSE=y
CONFIG_ISO9660_FS=y
CONFIG_UDF_FS=y
CONFIG_IKCONFIG=y
CONFIG_IKCONFIG_PROC=y

# ---------------------------------------------------------------------------
# 9. Deliberate values that differ from mer-kernel-check's advice
# ---------------------------------------------------------------------------
# NOTE: do NOT write bare "# CONFIG_FOO=y" in comments in this file. Both
# kconfig and merge_config.sh read a line of that shape as a directive, so a
# "documentation" comment silently overrides the symbol. Reference symbols
# without the CONFIG_ prefix below.

# DUMMY: mer wants it unset (connman can present dummy0 as a wired service).
# Kept =y to match stock and the athena/mindphone ports, where =y caused no
# trouble and Android's netd expects dummy0 to exist. This is the one
# deliberate mer ERROR.
CONFIG_DUMMY=y

# FW_LOADER_USER_HELPER: kept at the stock value. Qualcomm firmware is loaded
# directly from the filesystem, so the fallback path is inert. mindphone turned
# this off and flagged it as a suspected wifi/firmware regression - not
# repeated.
CONFIG_FW_LOADER_USER_HELPER=y
CONFIG_FW_LOADER_USER_HELPER_FALLBACK=y

# Left as mer warnings on purpose:
#   RTC_DRV_CMOS            - x86 only, not available on arm64
#   SECURITY_YAMA_STACKED   - only meaningful on kernels < 4.3
#   NFS*/SUNRPC/LOCKD/CIFS/BTRFS/ECRYPT_FS - unused by LuneOS on a handset
#   BT_HCIUART*             - BT goes through bluebinder/vhci, not a UART HCI
#   LBDAF                   - always-on for 64-bit

# netconsole: stream kmsg to the host over the USB gadget network (UDP 6666,
# listen with: nc -ul 6666). Dynamic so the initramfs attaches it after the
# gadget comes up. This device has no accessible debug UART, so this and the
# initramfs adb shell are the only channels for early boot output.
CONFIG_NETCONSOLE=y
CONFIG_NETCONSOLE_DYNAMIC=y

# ---------------------------------------------------------------------------
# 10. Image size - the kernel/ramdisk window
# ---------------------------------------------------------------------------
# The header gives the kernel a budget, not just an address: the bootloader
# writes the ramdisk at base+ramdisk_offset, so anything past
# ramdisk_offset - kernel_offset = 0x01000000 - 0x8000 = 16,744,448 B is at
# risk of being overwritten.
#
# surya is the device that shows the rule does not bind everywhere: the
# shipping /e/OS kernel is 17,781,272 B, i.e. 1.0 MiB PAST that line, and it
# boots. A header-v2 ABL relocates rather than honouring the offsets the way
# aboot did. The image is still worth keeping small, so take athena's levers -
# but do not move ramdisk_offset, and do not read an overrun here as a cause.
#
# IKHEADERS is the embedded kernel-headers tarball (for on-device eBPF
# tooling); Android-only and the single largest item. KALLSYMS_ALL adds
# non-function symbols to the in-kernel table.
# CONFIG_IKHEADERS is not set
# CONFIG_KALLSYMS_ALL is not set

# Keep IKCONFIG: /proc/config.gz is how mer_verify_kernel_config gets run
# against the config the device is actually running.
CONFIG_IKCONFIG=y
CONFIG_IKCONFIG_PROC=y
