# LuneOS / Halium kernel config delta - Xiaomi Redmi 5 Plus (vince, MSM8953)
#
# Merged on top of arch/arm64/configs/vince_defconfig
# (xiaomi-msm8953-devs/temp_android_kernel_xiaomi_vince, lineage-18.1, 4.9.251).
#
# The list follows fajita's fragment, the other 4.9 tree, plus what tissot's
# defconfig changed for this SoC. Each entry was checked against vince_defconfig.
#
# NOTE: do NOT write a bare "# CONFIG_FOO=y" in a comment here. kconfig and
# merge_config.sh read a line of that shape as a directive.

# The tree's own suffix is a non-ASCII kernel name, which ends up in /lib/modules.
CONFIG_LOCALVERSION=""

# ---------------------------------------------------------------------------
# 1. Hard requirements of systemd and the Halium initrd
# ---------------------------------------------------------------------------
CONFIG_FHANDLE=y
CONFIG_DEVTMPFS=y
CONFIG_DEVTMPFS_MOUNT=y
CONFIG_VT=y
CONFIG_VT_CONSOLE=y
CONFIG_CONSOLE_TRANSLATIONS=y
CONFIG_UNIX98_PTYS=y
CONFIG_NLS_UTF8=y
# CONFIG_STATIC_USERMODEHELPER is not set

# SysV IPC stays off, as on the other current ports: libPmLogLib uses POSIX shm.
# LXC keeps the IPC namespace ("lxc.namespace.keep = ipc user").
# CONFIG_SYSVIPC is not set

# ---------------------------------------------------------------------------
# 2. Namespaces, for the LXC Android container
# ---------------------------------------------------------------------------
CONFIG_NAMESPACES=y
CONFIG_UTS_NS=y
CONFIG_PID_NS=y
CONFIG_USER_NS=y
CONFIG_NET_NS=y
CONFIG_CHECKPOINT_RESTORE=y

# ---------------------------------------------------------------------------
# 3. cgroups
# ---------------------------------------------------------------------------
CONFIG_CGROUPS=y
CONFIG_CGROUP_DEVICE=y
CONFIG_CGROUP_FREEZER=y
CONFIG_CGROUP_SCHED=y
CONFIG_CGROUP_CPUACCT=y
CONFIG_CGROUP_PERF=y
CONFIG_CGROUP_NET_PRIO=y
CONFIG_NET_CLS_CGROUP=y
CONFIG_BLK_CGROUP=y
CONFIG_MEMCG=y
CONFIG_MEMCG_SWAP=y
CONFIG_CPUSETS=y

# ---------------------------------------------------------------------------
# 4. systemd optional-but-recommended
# ---------------------------------------------------------------------------
CONFIG_FANOTIFY=y
CONFIG_FANOTIFY_ACCESS_PERMISSIONS=y
CONFIG_AUTOFS4_FS=y
CONFIG_SECURITY_YAMA=y
CONFIG_TMPFS_XATTR=y
CONFIG_TMPFS_POSIX_ACL=y
CONFIG_SECCOMP=y

# androidboot.selinux=permissive in the cmdline needs these to bite.
CONFIG_SECURITY_SELINUX=y
CONFIG_SECURITY_SELINUX_DEVELOP=y
CONFIG_SECURITY_SELINUX_BOOTPARAM=y

# ---------------------------------------------------------------------------
# 5. Wi-Fi and Bluetooth
# ---------------------------------------------------------------------------
# prima as a module, as tissot does: wifi-module-load.service inserts it once the
# Android side has the firmware mounted and WCNSS is up. vince_defconfig has it =y.
CONFIG_PRONTO_WLAN=m

# bluebinder talks to the container HAL through a virtual HCI.
CONFIG_BT=y
CONFIG_BT_HCIVHCI=y
CONFIG_BT_RFCOMM=y
CONFIG_BT_RFCOMM_TTY=y
CONFIG_BT_BNEP=y
CONFIG_BT_BNEP_MC_FILTER=y
CONFIG_BT_BNEP_PROTO_FILTER=y
CONFIG_BT_HIDP=y
CONFIG_RFKILL=y
CONFIG_HIDRAW=y
CONFIG_UHID=y
CONFIG_INPUT_UINPUT=y

# ---------------------------------------------------------------------------
# 6. Waydroid (waydroid-kernel.inc forces the rest after kconfig)
# ---------------------------------------------------------------------------
CONFIG_SQUASHFS=y
CONFIG_SQUASHFS_XATTR=y
CONFIG_SQUASHFS_XZ=y
CONFIG_SQUASHFS_ZLIB=y
CONFIG_VETH=y
CONFIG_TUN=y
CONFIG_NETFILTER_XT_TARGET_CHECKSUM=y
CONFIG_BRIDGE=y

# ---------------------------------------------------------------------------
# 7. connman / ofono networking
# ---------------------------------------------------------------------------
CONFIG_NETFILTER_XT_MATCH_RECENT=y
CONFIG_NETFILTER_XT_MATCH_SCTP=y
CONFIG_NETFILTER_NETLINK_ACCT=y
CONFIG_NETFILTER_XT_MATCH_NFACCT=y

# ---------------------------------------------------------------------------
# 8. Storage and diagnostics
# ---------------------------------------------------------------------------
CONFIG_BLK_DEV_LOOP=y
CONFIG_BLK_DEV_NBD=y
CONFIG_FUSE_FS=y
CONFIG_CUSE=y
CONFIG_ISO9660_FS=y
CONFIG_UDF_FS=y
CONFIG_IKCONFIG=y
CONFIG_IKCONFIG_PROC=y
CONFIG_OVERLAY_FS=y

# Streams kmsg to the host over the USB gadget network (nc -ul 6666). This phone
# has no debug UART to hand, so this and the initramfs adb shell are the channels
# for early boot.
CONFIG_NETCONSOLE=y
CONFIG_NETCONSOLE_DYNAMIC=y

# DUMMY: mer-kernel-check wants it off; =y as on the other ports, Android's netd
# expects dummy0.
CONFIG_DUMMY=y

# ---------------------------------------------------------------------------
# 9. What the toolchain changes
# ---------------------------------------------------------------------------
# No 32-bit VDSO: OE has no arm32 cross compiler in this kernel's build. Same call
# as tissot_defconfig.
# CONFIG_COMPAT_VDSO is not set

# A tree written for Android's clang cannot survive -Werror under GCC 15.
# CONFIG_CC_WERROR is not set
