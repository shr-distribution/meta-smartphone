# We have a conf and classes directory, append to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a recipes directory, add to BBFILES
BBFILES += "${LAYERDIR}/recipes*/*/*.bb ${LAYERDIR}/recipes*/*/*.bbappend"

BBFILE_COLLECTIONS += "brax-layer"
BBFILE_PATTERN_brax-layer := "^${LAYERDIR}/"
BBFILE_PRIORITY_brax-layer = "7"

LAYERDEPENDS_brax-layer = "core openembedded-layer android-layer"

LAYERSERIES_COMPAT_brax-layer = "wrynose"
