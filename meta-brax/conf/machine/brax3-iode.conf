#@TYPE: Machine
#@NAME: BraX3 (iodéOS vendor)
#@DESCRIPTION: Boot images for a Brax Technologies BraX3 (MediaTek Dimensity
#              6300, MT6835) running iodéOS, the OS the phone ships with.
#
# The same kernel tree and config as brax3.conf, built to report iodéOS's
# release, 5.15.211-android13-8-g63db33e5daa0, so the stock iodéOS vendor_boot
# modules insmod. Iode publishes no kernel source, only prebuilts
# (Brax3_IodeOs/device_brax_brax3-kernel); their modules' CRCs equal BaseOS's
# and score 0/377 against this kernel. HONESTY NOTE: the release string says
# .211, the code is Brax's .209 tree. Replace with Iode's source if it is ever
# published.

BRAX3_VENDOR = "iode"

# Everything keyed on :brax3 (GKI_CLANG_DIR in local.conf, the recipe's
# COMPATIBLE_MACHINE) applies here too.
MACHINEOVERRIDES =. "brax3:"

require conf/machine/include/brax3.inc
