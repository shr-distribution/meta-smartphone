# Make our kernel's vermagic string match the stock modules' exactly.
#
# Same reason as meta-zinwa's vermagic.cfg, which tells the full story: the
# storage and USB controllers (ufs-mediatek-mod.ko, phy-mtk-ufs.ko, mtk-mmc.ko,
# mtu3.ko) are vendor_boot modules that the initramfs loads with busybox insmod,
# which has no --force-vermagic, and the stock config does not set
# CONFIG_MODULE_FORCE_LOAD. A vermagic that misses by one character leaves no
# userdata and no adb.
#
# The BaseOS stock modules (Brax3_BaseOs/android_device_brax_brax3-kernel,
# baseos-1.0) carry:
#   5.15.209-android13-8-gdd511ad2a748 SMP preempt mod_unload modversions aarch64
#
# brax3_defconfig has LOCALVERSION="-android13-8" with LOCALVERSION_AUTO=y, so
# the suffix is otherwise taken from the git tree, and the published tree is a
# single squashed commit (815b9e54) that is not dd511ad2a748. Hence the fixed
# string; the recipe's empty .scmversion stops setlocalversion adding "+".
#
# iodéOS's build of the same KMI reports a different release; that is
# vermagic-iode.cfg, used by MACHINE=brax3-iode.
CONFIG_LOCALVERSION="-android13-8-gdd511ad2a748"
# CONFIG_LOCALVERSION_AUTO is not set
