# Vermagic for MACHINE=brax3-iode: match the stock iodéOS modules exactly.
#
# Same reason as vermagic-baseos.cfg (busybox insmod in the initramfs, no
# --force-vermagic, storage and USB are vendor_boot modules). The iodéOS stock
# modules (Brax3_IodeOs/device_brax_brax3-kernel, v7.9) carry:
#   5.15.211-android13-8-g63db33e5daa0 SMP preempt mod_unload modversions aarch64
#
# The suffix is set here; the ".211" cannot be, because the sublevel comes from
# the tree's Makefile (SUBLEVEL = 209). The recipe passes SUBLEVEL=211 on the
# make command line for this vendor (BRAX3_KERNEL_SUBLEVEL), which yields
# exactly the string above - checked with "make kernelrelease".
#
# Their modules' CRCs equal BaseOS's: 3,832 shared imported symbols, 0 differ,
# same module_layout, and 0 of 377 fail kmi-crc-check.py against this tree.
CONFIG_LOCALVERSION="-android13-8-g63db33e5daa0"
# CONFIG_LOCALVERSION_AUTO is not set
