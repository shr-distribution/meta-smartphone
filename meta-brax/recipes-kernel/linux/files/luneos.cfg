# LuneOS delta for the BraX3's own kernel (MediaTek mgk 5.15.209, GKI
# android13-5.15 KMI generation 8, MT6835).
#
# Merged on top of brax3_defconfig, the full config Brax ships in the tree,
# which reproduces the stock kernel's IKCONFIG up to LTO and LOCALVERSION (see
# the recipe). Everything here is therefore a *deviation from that baseline*,
# and every deviation is a chance to break the KMI. Build with
# LUNEOS_KERNEL_FRAGMENT = "0" first to prove the baseline reproduces, then add
# this and measure again with kmi-crc-check.py against the stock modules.
#
# Sections 1 and 2 are q25's (meta-zinwa), unchanged: they touch no struct the
# vendor modules see. Sections are ordered by how likely they are to move a
# CRC, most dangerous last, so bisecting means deleting from the bottom.

# ---------------------------------------------------------------------------
# 1. Behavioural only - no struct touched, no CRC can move
# ---------------------------------------------------------------------------

# systemd/udev hard requirements. Stock has none of these.
CONFIG_DEVTMPFS=y
CONFIG_DEVTMPFS_MOUNT=y
CONFIG_FHANDLE=y
CONFIG_TMPFS_XATTR=y
CONFIG_TMPFS_POSIX_ACL=y
CONFIG_AUTOFS_FS=y
CONFIG_QUOTA_NETLINK_INTERFACE=y

# Virtual terminal, for console=tty0 below. No debug UART is known on the BraX3.
CONFIG_VT=y
CONFIG_VT_CONSOLE=y

# request_module() autoloading. Stock sets STATIC_USERMODEHELPER=y with an
# empty path, which disables the usermode helper outright.
# CONFIG_STATIC_USERMODEHELPER is not set

# Hotplug events to the initramfs's mdev. Stock GKI has no uevent_helper, and
# without it late hotplug events are lost and /dev/disk/by-partlabel can come
# up empty. mer wants the path to default empty.
CONFIG_UEVENT_HELPER=y
CONFIG_UEVENT_HELPER_PATH=""

# bluebinder feeds the Android BT HAL into a virtual HCI, so vhci is its kernel
# prerequisite; the rest is the bluez profile set. Stock has none of them.
CONFIG_BT_HCIVHCI=y
CONFIG_BT_RFCOMM=y
CONFIG_BT_RFCOMM_TTY=y
CONFIG_BT_HIDP=y
CONFIG_BT_BNEP=y
CONFIG_BT_BNEP_MC_FILTER=y
CONFIG_BT_BNEP_PROTO_FILTER=y

# Waydroid wants its own binder trio however the nodes are created, plus veth
# and the checksum target for its networking. LuneOS mounts binderfs on the
# host and binds it into the container, which is orthogonal to this list.
CONFIG_ANDROID_BINDER_DEVICES="binder,hwbinder,vndbinder,anbox-binder,anbox-hwbinder,anbox-vndbinder"
CONFIG_VETH=y
CONFIG_NETFILTER_XT_TARGET_CHECKSUM=y

# ---------------------------------------------------------------------------
# 2. Netfilter / ofono / VPN. These add modules and match extensions rather
#    than members of core structs, but a few netfilter options do reach into
#    struct net - so they come before the namespace block, not with section 1.
# ---------------------------------------------------------------------------
CONFIG_INET_AH=y
CONFIG_INET_IPCOMP=y
CONFIG_INET6_AH=y
CONFIG_INET6_IPCOMP=y
CONFIG_NF_LOG_IPV4=y
CONFIG_NF_LOG_IPV6=y
CONFIG_IP_NF_MATCH_AH=y
CONFIG_IP_NF_MATCH_RPFILTER=y
CONFIG_IP6_NF_MATCH_RPFILTER=y
CONFIG_NETFILTER_XT_MATCH_RECENT=y
CONFIG_NETFILTER_XT_MATCH_SCTP=y

# PPP stack (ofono dialup / DUN)
CONFIG_PPP=y
CONFIG_PPP_ASYNC=y
CONFIG_PPP_SYNC_TTY=y
CONFIG_PPP_FILTER=y
CONFIG_PPP_MULTILINK=y
CONFIG_PPP_DEFLATE=y
CONFIG_PPP_BSDCOMP=y
CONFIG_PPPOE=y

# L2TP (VPN)
CONFIG_L2TP=y
CONFIG_L2TP_V3=y
CONFIG_L2TP_IP=y

# NET_L3_MASTER_DEV is the reverse of q25 here: the BraX3's stock kernel has it
# =y, so l3mdev_ops is already in the struct net_device every vendor wifi
# module was built against. It is left exactly as stock - unsetting it would
# break the KMI the way setting it does on MT6789. FANOTIFY, NF_TABLES,
# HUGETLBFS, POSIX_MQUEUE and CGROUP_PIDS are off in stock and stay off.

# ---------------------------------------------------------------------------
# 3. Namespaces - the KMI-poison candidates
#
# Bisected 26 Oct 2026 against all stock modules, BaseOS (177 vendor_boot +
# 597 vendor_dlkm) and Iode (377), kmi-crc-check.py on vmlinux.symvers:
#
#   baseline (brax3_defconfig, no fragment)    0/774, 0/377 would fail
#   this fragment as it stands                 0/774, 0/377
#   + SYSVIPC, SYSVIPC_SYSCTL, IPC_NS          774/774, 377/377
#   + USER_NS                                  0/774, 0/377
#
# So the KMI-poison option on MediaTek mgk android13-5.15 / MT6835 is
# CONFIG_SYSVIPC - and USER_NS, poison on MT6789, is clean here. The UBports
# halium.config for this kernel sets both; it is not a reference for the KMI.
#
# USER_NS stays off anyway, as on every other LuneOS port: nothing in the
# stack needs it, and one device behaving differently is a cost. It is
# measured clean, so turn it on here without another bisect if something does.
# No SysV IPC: the same userland consequences as q25 (luneos.cfg there).
# ---------------------------------------------------------------------------
CONFIG_PID_NS=y
CONFIG_CHECKPOINT_RESTORE=y
# CONFIG_USER_NS is not set
# CONFIG_SYSVIPC is not set

# ---------------------------------------------------------------------------
# 4. Command line
#
# Stock CONFIG_CMDLINE (the GKI quieting flags plus cgroup_disable=pressure),
# then console=tty0 and the cgroup v1 pair the Android container and systemd
# need - systemd reads both off /proc/cmdline, and the boot image's own cmdline
# is at the mercy of the bootloader (see brax3.conf). Unlike q25's, no
# selinux=0: kernel-porting.md "selinux=0: do not pass it on a Halium port".
#
# CONFIG_CMDLINE_EXTEND is already set by the stock config, so whatever the
# bootloader supplies is appended to this rather than replacing it.
# ---------------------------------------------------------------------------
CONFIG_CMDLINE="stack_depot_disable=on kasan.stacktrace=off kvm-arm.mode=protected cgroup_disable=pressure cgroup.memory=nokmem console=tty0 systemd.unified_cgroup_hierarchy=0 SYSTEMD_CGROUP_ENABLE_LEGACY_FORCE=1"
CONFIG_CMDLINE_EXTEND=y
