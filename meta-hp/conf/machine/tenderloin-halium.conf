#-----------------------------------------------------------------------------
#@TYPE: Machine
#@NAME: HP Touchpad (codename tenderloin)
#@DESCRIPTION: Machine configuration for the HP Touchpad (Halium)
#-----------------------------------------------------------------------------

require conf/machine/include/meta-android-halium.inc

TARGET_ARCH = "arm"

PREFERRED_PROVIDER_virtual/kernel = "linux-hp-tenderloin-halium"
MACHINE_KERNEL_PR = "r0"

# A 9.7" tablet: no NFC and no fingerprint reader on any Touchpad, and no
# physical keyboard either - the Touchstone dock is a charger and the wireless
# keyboard is a bluetooth accessory, neither of them hardware on this board.
# "keyboard" was in this list from the start and never described the device.
MACHINE_FEATURES = "kernel26 apm alsa bluetooth usbgadget usbhost wifi vfat ext2 touchscreen"
# The Touchpad 4G is basically the same as the Touchpad but includes a cellular modem.
# To support that as well add the MACHINE_FEATURES cellular here to let the upper layers
# respect that in packaging the correct content into the resulting image.
#
# "gps" belongs to that same variant and has been moved onto this line with it:
# the wifi-only Touchpad has no GNSS receiver at all, and the 4G model's A-GPS
# rides on the modem.
MACHINE_FEATURES += "cellular gps"

# One camera, and it faces the user: the 1.3 MP webcam above the display. No
# Touchpad has a rear sensor, so camera-rear would be a straight falsehood -
# camera-front is the whole topology here, and it is also what installs
# luneos-faced.
MACHINE_FEATURES += "camera-front"

MACHINE_DISPLAY_WIDTH_PIXELS = "1024"
MACHINE_DISPLAY_HEIGHT_PIXELS = "768"
MACHINE_DISPLAY_ORIENTATION = "0"
MACHINE_DISPLAY_PPI = "132"

PREFERRED_VERSION_android-headers-halium = "${@'16.0%' if d.getVar('TENDERLOIN_ANDROID_SYSTEM') == 'gsi' else '9.0%'}"

# Which Android the device boots: "device" is its own Halium 9 build, "gsi" is the
# 16.0 GSI with a vendor.img derived from that build (see
# android-system-image-legacy-gsi.inc). The headers follow the GSI, not the
# vendor, for the reason spelled out in tissot-halium.conf.
TENDERLOIN_ANDROID_SYSTEM ?= "device"
VIRTUAL-RUNTIME_android-system-image = "android-system-image-tenderloin-halium${@'-gsi' if d.getVar('TENDERLOIN_ANDROID_SYSTEM') == 'gsi' else ''}"
HALIUM_LEGACY_GSI = "${@'1' if d.getVar('TENDERLOIN_ANDROID_SYSTEM') == 'gsi' else '0'}"

# module-droid-card names its sink after the output in the audio policy. The TouchPad has only the legacy
# audio_policy.conf, whose output is "primary", so the sink is sink.primary (Android 9 XML vendors give
# sink.primary_output, the default). Without this the pcm_output remap that audiod and module-palm-policy
# route by finds no master, and every stream stays on a virtual sink: silence (7 Oct 2026).
WEBOS_PCM_OUTPUT_MASTER = "sink.primary"
ANDROID_HEADERS_DEFINES = "QCOM_BSP QCOM_DIRECTTRACK"

PREFERRED_PROVIDER_virtual/xserver = "xserver-xorg"
XSERVER = " \
    xserver-xorg \
    xf86-input-evdev \
    xf86-video-fbdev \
"

MACHINE_EXTRA_RDEPENDS = " \
    linux-firmware-ath6k \
    kernel-modules \
    lvm2 \
    tenderloin-touch-boost \
"

KERNEL_IMAGETYPE = "uImage"
IMAGE_FSTYPES += "tar.gz"
IMAGE_ROOTFS_EXTRA_SPACE = "200000"

UBOOT_ENTRYPOINT = "41000000"
UBOOT_LOADADDRESS = "41000000"

require conf/machine/include/arm/armv7a/tune-cortexa8.inc
