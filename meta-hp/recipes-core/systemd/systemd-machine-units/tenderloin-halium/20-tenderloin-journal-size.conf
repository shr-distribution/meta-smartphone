# The TouchPad's root filesystem is 3 GB with about 2.5 GB of system and
# Android images on it, and db8 warns that the application database is full at
# around 85% use. The generic 200 MB journal cap takes it past that, and
# SystemKeepFree=20% does not prevent it: on 2026-10-09 journald still allowed
# the full 200 MB with only 304 MB (10%) free, root at 91%. 64 MB keeps the last
# few boots.
[Journal]
SystemMaxUse=64M
