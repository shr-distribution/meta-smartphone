#-----------------------------------------------------------------------------
#@TYPE: Machine
#@NAME: Google/Asus Nexus 7 (2013) Wi-Fi (codename flo, product razor)
#@DESCRIPTION: Machine configuration for the Nexus 7 (2013) Wi-Fi, Halium
#              (3.4 vendor kernel, Android container, 32-bit, 16.0 GSI)
#-----------------------------------------------------------------------------

# Everything here is read from LineageOS' 18.1 build for the tablet, flox
# (android_device_asus_flox, android_kernel_google_msm, branch lineage-18.1, and
# the lineage-18.1-20260923-UNOFFICIAL-flox.zip its maintainer publishes), or
# from the tablet's published specifications. Nothing has been run on the
# tablet yet.
#
# flox is LineageOS' name for the Nexus 7 (2013) Wi-Fi with a vendor partition
# carved out of its eMMC ("Repartitioned"). LuneOS does not use that partition:
# the vendor image ships inside the rootfs like every other image, so the tablet
# does not have to be repartitioned. The LTE model (deb) is a different machine.

require conf/machine/include/meta-android-halium.inc

# 32-bit kernel and userland: APQ8064 (Snapdragon S4 Pro), four Krait cores,
# armeabi-v7a only.
TARGET_ARCH = "arm"

PREFERRED_PROVIDER_virtual/kernel ?= "linux-asus-flo-halium"
MACHINE_KERNEL_PR = "r0"

# From the tablet's specifications and the Lineage device tree:
#
#   wifi, bluetooth  the WCNSS (Riva) companion: prima for Wi-Fi, and Bluetooth
#                    over shared memory (ro.qualcomm.bt.hci_transport=smd),
#                    which the kernel's backports hci_smd driver serves.
#   gps              gps.msm8960.so through the vendor's GNSS HAL.
#   nfc              a Broadcom BCM20793 (nfc_nci.bcm2079x.default.so).
#   camera-rear/     a 5 MP rear and a 1.2 MP front camera, both behind
#   camera-front     camera.flox.so and mm-qcamera-daemon.
#
# Deliberately absent:
#
#   phone            the Wi-Fi model has no modem (the LTE sibling is deb).
#   vibrator         the Nexus 7 (2013) has no vibration motor.
MACHINE_FEATURES = "kernel26 apm alsa bluetooth gps usbgadget usbhost wifi vfat ext2 touchscreen nfc"
MACHINE_FEATURES += "camera-rear camera-front"

# A 7.02" 1200x1920 panel, native portrait (TARGET_SCREEN_WIDTH 1200 and
# TARGET_SCREEN_HEIGHT 1920 in the Lineage tree), 323 ppi:
# sqrt(1200^2 + 1920^2) / 7.02 = 322.5.
# TODO(verify): the orientation the compositor needs on the tablet.
MACHINE_DISPLAY_WIDTH_PIXELS = "1200"
MACHINE_DISPLAY_HEIGHT_PIXELS = "1920"
MACHINE_DISPLAY_ORIENTATION = "0"
MACHINE_DISPLAY_PPI = "323"

# The vendor is the one of LineageOS 18.1 (Android 11, VNDK 30), made
# Treble-shaped by classes/halium-legacy-vendor.bbclass, and paired with the
# 16.0 GSI. The GSI follows the headers, not the vendor, as on the other
# 32-bit machines.
PREFERRED_VERSION_android-headers-halium = "16.0%"
VIRTUAL-RUNTIME_android-system-image = "android-system-image-flo-halium"

# HALIUM_LEGACY_GSI is deliberately not set. It only makes halium-kernel-3.4.inc
# add meta-android's renameat2 patch, which the flo/3.4/lineage-18.1 branch
# already carries as a commit (its syscall table has memfd_create at 385).

PREFERRED_PROVIDER_virtual/xserver = "xserver-xorg"
XSERVER = " \
    xserver-xorg \
    xf86-input-evdev \
    xf86-video-fbdev \
"

# prima and every other driver are built into the kernel; module support is
# only on for v4l2loopback.
MACHINE_EXTRA_RDEPENDS = " \
    android-kernel-bootimg \
    dosfstools \
"

# A board-file kernel: no device tree, the bootloader passes ATAGs.
KERNEL_IMAGETYPE = "zImage"
IMAGE_FSTYPES += "tar.gz"
IMAGE_ROOTFS_EXTRA_SPACE = "200000"

# fstab.flox: the eMMC is behind msm_sdcc.1, partitions by name. The boot
# partition is where luneos-package's installer writes the boot image.
ANDROID_BOARD_BOOTIMAGE_PARTITION = "/dev/block/platform/msm_sdcc.1/by-name/boot"
ANDROID_BOARD_FLASH_BLOCK_SIZE = "131072"

# console=ttyHSL0,115200,n8 in the kernel command line.
SERIAL_CONSOLE = "115200 ttyHSL0"

require conf/machine/include/arm/armv7a/tune-cortexa8.inc

# v4l2loopback: kernel half of droidcam2v4l2 (the daemon itself ships on every
# halium device via packagegroup-luneos-extended). It is an out-of-tree module,
# so - like wireguard-module - it can only be named on a machine that builds its
# own kernel; the recipe meta package is named, not kernel-module-v4l2loopback.
MACHINE_EXTRA_RDEPENDS += "v4l2loopback"
