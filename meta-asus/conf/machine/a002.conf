#-----------------------------------------------------------------------------
#@TYPE: Machine
#@NAME: Asus Zenfone AR (codename A002 / ZS571KL)
#@DESCRIPTION: Machine configuration for the Asus Zenfone AR (Halium, 16.0 GSI)
#-----------------------------------------------------------------------------

# The Zenfone AR (ZS571KL, msm8996) launched on Android 7.0 and never had a
# vendor partition (partition_ufs.xml of the factory QFIL image lists system,
# userdata, cache, boot, recovery, modem and firmware - no vendor, no super).
# So it runs the arm64 16.0 GSI with a vendor.img that `m vendorimage` built
# from the stock /vendor against a LineageOS 16.0 msm8996 device tree
# (device/asus/{A002,msm8996-common}), the way tissot-halium does - the vendor
# travels inside the rootfs, not on a partition. There is no device (own Halium
# build) variant: the stock ROM is Nougat only, there is no LineageOS/Halium 9
# tree for this phone, so nothing but the GSI path exists.

require conf/machine/include/arm/arch-arm64.inc
require conf/machine/include/meta-android-halium.inc

PREFERRED_PROVIDER_virtual/kernel ?= "linux-asus-a002-halium"
MACHINE_KERNEL_PR = "r0"

# NFC (NXP), fingerprint (the ZS571KL has a front capacitive reader) and the
# rest are declared from the stock /vendor HALs present in vendor.img
# (nfc_nci.*, fingerprint.qcom, sensors, sound_trigger). None tried under LuneOS.
MACHINE_FEATURES = "apm alsa bluetooth gps usbgadget usbhost phone wifi vfat ext2 touchscreen nfc"
MACHINE_FEATURES += "fingerprint"
MACHINE_FEATURES += "camera-rear camera-front"

# QHD panel. From the published ZS571KL specification (5.7" 2560x1440), NOT yet
# read back from the kernel device tree or a real device - verify and correct
# against qcom,mdss-pan-physical-{width,height}-dimension in the panel dtsi.
MACHINE_DISPLAY_WIDTH_PIXELS = "1440"
MACHINE_DISPLAY_HEIGHT_PIXELS = "2560"
MACHINE_DISPLAY_ORIENTATION = "0"
MACHINE_DISPLAY_PPI = "515"

# Tracks the GSI, not the vendor, for the reason spelled out in tissot-halium.conf
# (libhybris gates its A16 support on ANDROID_VERSION_MAJOR from these headers).
PREFERRED_VERSION_android-headers-halium = "16.0%"

# The droid modules follow the vendor's audio HAL. This vendor is Android 7.0
# (audio HAL from the msm8996 Nougat tree), so the halium include's jb2q default
# is correct; do not pin the modern tree.

VIRTUAL-RUNTIME_android-system-image = "android-system-image-a002"
ANDROID_HEADERS_DEFINES = "QCOM_BSP QTI_BSP QCOM_HARDWARE"

PREFERRED_PROVIDER_virtual/xserver = "xserver-xorg"
XSERVER = " \
    xserver-xorg \
    xf86-input-evdev \
    xf86-video-fbdev \
"

# The Wi-Fi driver (qcacld) is built into the stock msm8996 defconfig, so there
# is no wlan module to name here. android-kernel-bootimg writes boot.img on the
# first boot; dosfstools for the vfat sdcard/usbotg mounts in fstab.qcom.
MACHINE_EXTRA_RDEPENDS = " \
    android-kernel-bootimg \
    dosfstools \
"

KERNEL_IMAGETYPE = "Image.gz-dtb"
IMAGE_FSTYPES += "tar.gz"
IMAGE_ROOTFS_EXTRA_SPACE = "200000"

# A 3.18 kernel: keep the ext4 options it can mount (no metadata_csum/64bit/
# orphan_file), as the other pre-5.x halium machines.
EXTRA_IMAGECMD:ext4:forcevariable = "-i 4096 -O ^64bit,^metadata_csum,^metadata_csum_seed,^orphan_file"

# From the factory image: boot by the stable bootdevice/by-name symlink (the
# fstab.qcom uses /dev/block/bootdevice/by-name for every partition), the
# system partition size and flash block size from partition_ufs.xml /
# device/asus/A002/BoardConfig.mk.
ANDROID_BOARD_BOOTIMAGE_PARTITION = "/dev/block/bootdevice/by-name/boot"
ANDROID_BOARD_SYSTEMIMAGE_PARTITION_SIZE = "4831838208"
ANDROID_BOARD_FLASH_BLOCK_SIZE = "131072"

SERIAL_CONSOLE = "115200 ttyHSL0"
