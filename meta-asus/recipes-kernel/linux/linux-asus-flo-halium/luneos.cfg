# LuneOS/Halium config delta - Google/Asus Nexus 7 (2013) Wi-Fi (flo, razor,
# APQ8064).
#
# Merged on top of arch/arm/configs/lineageos_flo_defconfig of
# LineageOS/android_kernel_google_msm (3.4.113, branch lineage-18.1), the config
# the LineageOS 18.1 (Android 11) flox build boots with. It is an Android config,
# so it lacks what a systemd userspace assumes: the namespaces the container
# uses, DEVTMPFS, FHANDLE, VT and the cgroup device controller. The shape follows
# linux-samsung-sm-t520's luneos.cfg, the other 3.4 Lineage 18.1 kernel.
#
# NOTE: do NOT write bare "# CONFIG_FOO=y" in comments in this file.
# scripts/kconfig/merge_config.sh matches ^(# )?CONFIG_[A-Za-z0-9_][= ] and
# treats such a line as a directive. Reference symbols without the CONFIG_
# prefix in prose.

# ---------------------------------------------------------------------------
# Deliberately OFF
# ---------------------------------------------------------------------------
# No System V IPC, as on every recent port: PmLogLib stopped calling shmget/shmat
# in September 2026, and the container keeps the host's IPC and user namespaces
# (lxc.namespace.keep = ipc user). IPC_NS depends on SYSVIPC.
# CONFIG_SYSVIPC is not set
# CONFIG_SYSVIPC_SYSCTL is not set

# 3.4 defaults the user namespace to y as soon as NAMESPACES is on. Nothing asks
# for it; the container keeps the host's.
# CONFIG_USER_NS is not set

# Real-time group scheduling. The defconfig has it on. With it, a task in a
# non-root cgroup has no RT runtime unless one is assigned, so
# sched_setscheduler(SCHED_FIFO) fails for the container's services (the
# composer sets itself SCHED_FIFO). waydroid-kernel.inc forces it off for the
# same reason.
# CONFIG_RT_GROUP_SCHED is not set

# fanotify stays off, as on the other ports; systemd does not need it.
# CONFIG_FANOTIFY is not set

# Android's paranoid network check limits socket creation to the AID_INET group,
# which the glibc userspace's services do not carry. Off as in the Halium 3.4
# trees of hammerhead and mako. A Wi-Fi tablet with no modem has no rild for it
# to matter to either way.
# CONFIG_ANDROID_PARANOID_NETWORK is not set

# ---------------------------------------------------------------------------
# What Halium needs and the defconfig lacks
# ---------------------------------------------------------------------------
# The namespaces the container uses. PID_NS needs the setns() and user
# namespace backports on the branch (pidns_operations was declared but never
# defined in this tree, so PID_NS did not link).
CONFIG_NAMESPACES=y
CONFIG_UTS_NS=y
CONFIG_PID_NS=y
CONFIG_NET_NS=y

CONFIG_DEVTMPFS=y
CONFIG_DEVTMPFS_MOUNT=y
CONFIG_FHANDLE=y
CONFIG_VT=y

# systemd and Android's libprocessgroup
CONFIG_CGROUP_DEVICE=y
CONFIG_CPUSETS=y
CONFIG_BLK_CGROUP=y
CONFIG_AUTOFS4_FS=y

# POSIX ACLs on ext4 and tmpfs, which systemd's tmpfiles and journal set
# (meta-oe's linux.inc forces the tmpfs one on as well). The branch fixes
# shmem_tmpfile(), which still called the generic_acl_init() this tree's
# backport of "fs: remove generic_acl" had removed.
CONFIG_EXT4_FS_POSIX_ACL=y
CONFIG_TMPFS_POSIX_ACL=y

# Hotplug events go to udev, not to /sbin/hotplug.
CONFIG_UEVENT_HELPER_PATH=""

# /proc/config.gz, to compare a running kernel against this file.
CONFIG_IKCONFIG=y
CONFIG_IKCONFIG_PROC=y

# Options the hammerhead and mako Halium kernels have on and a Lineage 18.1
# defconfig leaves off (the list sm-t520's luneos.cfg arrived at by diffing the
# built .config files):
#   DEVPTS_MULTIPLE_INSTANCES  the container and systemd mount a private devpts
#   BRIDGE                     lxcbr0 / the container's network
#   NETFILTER_XT_MATCH_OWNER   Android's netd matches packets by uid
#   AIO                        io_setup() and friends; a plain syscall set
#   PROC_EVENTS                process event connector
CONFIG_DEVPTS_MULTIPLE_INSTANCES=y
# STP and LLC are what BRIDGE selects; with module support they followed it to m.
CONFIG_BRIDGE=y
CONFIG_STP=y
CONFIG_LLC=y
CONFIG_NETFILTER_XT_MATCH_OWNER=y
CONFIG_AIO=y
# PROC_EVENTS sits on the netlink connector, which the defconfig leaves off.
CONFIG_CONNECTOR=y
CONFIG_PROC_EVENTS=y

# Loadable modules, for v4l2loopback (the kernel half of droidcam2v4l2), an
# out-of-tree module. The defconfig builds everything in and has no module
# support at all; the drivers it builds in (prima included) stay built in.
CONFIG_MODULES=y
CONFIG_MODULE_UNLOAD=y
# With module support on, every option whose Kconfig default is m becomes a
# module where it used to be built in, and nothing would load those modules: IPv6
# and its netfilter tables, the ADSP RPC and backlight classes among them. These are
# exactly the options the defconfig builds in without module support and that
# turn into m with it (found by resolving the config both ways), pinned back.
CONFIG_MSM_RESET_MODEM=y
CONFIG_MSM_BUSPM_DEV=y
CONFIG_CP_ACCESS=y
CONFIG_XFRM_IPCOMP=y
CONFIG_INET_TUNNEL=y
CONFIG_IPV6=y
CONFIG_INET6_AH=y
CONFIG_INET6_ESP=y
CONFIG_INET6_IPCOMP=y
CONFIG_IPV6_MIP6=y
CONFIG_INET6_XFRM_TUNNEL=y
CONFIG_INET6_TUNNEL=y
CONFIG_INET6_XFRM_MODE_TRANSPORT=y
CONFIG_INET6_XFRM_MODE_TUNNEL=y
CONFIG_INET6_XFRM_MODE_BEET=y
CONFIG_IPV6_SIT=y
CONFIG_NF_CONNTRACK_H323=y
CONFIG_NETFILTER_XT_TARGET_HMARK=y
CONFIG_NETFILTER_XT_TARGET_TCPMSS=y
CONFIG_NETFILTER_XT_MATCH_HASHLIMIT=y
CONFIG_NF_NAT_H323=y
CONFIG_NF_DEFRAG_IPV6=y
CONFIG_NF_CONNTRACK_IPV6=y
CONFIG_NF_NAT_IPV6=y
CONFIG_IP6_NF_IPTABLES=y
CONFIG_IP6_NF_MATCH_RPFILTER=y
CONFIG_IP6_NF_FILTER=y
CONFIG_IP6_NF_TARGET_REJECT=y
CONFIG_IP6_NF_MANGLE=y
CONFIG_IP6_NF_RAW=y
CONFIG_HW_RANDOM=y
CONFIG_HW_RANDOM_MSM=y
CONFIG_MSM_ADSPRPC=y
CONFIG_USB_GSPCA=y
CONFIG_LCD_CLASS_DEVICE=y
CONFIG_BACKLIGHT_CLASS_DEVICE=y
CONFIG_BACKLIGHT_GENERIC=y
CONFIG_HID_LOGITECH_DJ=y
CONFIG_CRYPTO_RNG=y
CONFIG_CRYPTO_DEFLATE=y
CONFIG_CRYPTO_ANSI_CPRNG=y

# A panic reboots after 5 s in the defconfig, which looks like a power-off and
# leaves no console to read. Keep the panic on screen instead while the port is
# young.
CONFIG_PANIC_TIMEOUT=0

# ---------------------------------------------------------------------------
# Bluetooth: the backports 4.2 stack, with the WCNSS SMD driver
# ---------------------------------------------------------------------------
# The Bluetooth stack of this 3.4 tree speaks the management interface 1.0, and
# bluetoothd 5.86 starts a discovery with it that the kernel never answers (found
# on the SM-T520's 3.4 kernel). The branch builds Linux backports 4.2-rc7 into the
# kernel instead (BACKPORT_INTEGRATE; commits by Simon Fels and Marius Gripsgard
# from the Halium hammerhead tree), and adds a port of the in-tree hci_smd driver
# to it: the controller here is the WCNSS (Riva) one, which speaks HCI over the
# shared-memory channels APPS_RIVA_BT_CMD and APPS_RIVA_BT_ACL
# (ro.qualcomm.bt.hci_transport=smd in the LineageOS build). BACKPORT_BT depends
# on !BT, so the in-tree stack goes, and with it the in-tree hci_smd.
#
# Not set, because no 3.4 kernel can have them: BACKPORT_BT_6LOWPAN depends on the
# kernel's own 6LOWPAN and BACKPORT_BT_RFCOMM_TTY on TTY, two symbols that only
# exist from 3.9 on. bluez does not use RFCOMM TTYs.
#
# These lines are applied again by do_configure:append in the recipe: the
# BACKPORT_BT_* symbols only exist once BACKPORT_LINUX is set, so the first
# oldconfig pass drops them silently.
# BACKPORT_BT depends on these crypto and CRC options; the in-tree stack did not.
CONFIG_CRYPTO_CMAC=y
CONFIG_CRYPTO_SHA256=y
CONFIG_CRYPTO_BLKCIPHER=y
CONFIG_CRC16=y
# CONFIG_BT is not set
CONFIG_BACKPORT_INTEGRATE=y
CONFIG_BACKPORT_LINUX=y
CONFIG_BACKPORT_BPAUTO_USERSEL_BUILD_ALL=y
CONFIG_BACKPORT_6LOWPAN=y
CONFIG_BACKPORT_6LOWPAN_NHC=y
CONFIG_BACKPORT_BT=y
CONFIG_BACKPORT_BT_BREDR=y
CONFIG_BACKPORT_BT_LE=y
CONFIG_BACKPORT_BT_DEBUGFS=y
CONFIG_BACKPORT_BT_RFCOMM=y
CONFIG_BACKPORT_BT_BNEP=y
CONFIG_BACKPORT_BT_BNEP_MC_FILTER=y
CONFIG_BACKPORT_BT_BNEP_PROTO_FILTER=y
CONFIG_BACKPORT_BT_HIDP=y
CONFIG_BACKPORT_BT_HCISMD=y
CONFIG_BACKPORT_BT_HCIVHCI=y
