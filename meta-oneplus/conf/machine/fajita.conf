#-----------------------------------------------------------------------------
#@TYPE: Machine
#@NAME: OnePlus 6T (codename fajita)
#@DESCRIPTION: Machine configuration for the OnePlus 6T, SDM845
#
# This machine exists to build the *boot image*, the way halium-arm64.conf says
# a device machine should: the rootfs comes from MACHINE=halium-arm64 and the
# GSI is chosen at install time from the device's vendor API level. What comes
# out of here is:
#
#   MACHINE=fajita bitbake initramfs-android-image   the Halium initramfs
#   MACHINE=fajita bitbake linux-oneplus-fajita      boot.img (kernel + initrd)
#
# Tier B: SDM845 launched on Android 9 and predates GKI, so the kernel is built
# per device from the LineageOS 4.9 tree - see linux-oneplus-fajita_git.bb.
#
# Target vendor is LineageOS 22.2 (Android 15), i.e. vendor API level 35, not
# stock OxygenOS. The 6T's last OxygenOS is 11 (vendor API 30), so a phone left
# on stock wants the Halium 11 GSI instead; the installer picks the GSI from
# ro.board.api_level/ro.vndk.version at install time either way, so the only
# thing pinned to a generation here is android-headers-halium below.
#
# Layout facts, from device/oneplus/{fajita,sdm845-common} (lineage-22.2) and
# the kernel tree, NOT read back out of a device image - see the UNVERIFIED
# note at the end:
#
#   - Boot header v1, 4096 byte pages. v1 has no dtb section (that arrives in
#     v2), so the device tree stays appended to the kernel: Image.gz-dtb, with
#     BOARD_KERNEL_SEPARATED_DTBO, so the per-board overlays live in dtbo.img,
#     which stays stock and is never flashed by us.
#   - A/B (AB_OTA_PARTITIONS: boot dtbo system vbmeta vendor), so every
#     partition lookup needs the active slot suffix.
#   - BOARD_USES_RECOVERY_AS_BOOT + TARGET_NO_RECOVERY: the boot partition *is*
#     recovery on this device. Flashing a LuneOS boot.img replaces recovery as
#     well; keep the stock boot.img to get it back. Same arrangement as sunfish.
#   - NO dynamic partitions. system and vendor are real partitions with
#     slotselect (fstab.qcom: /dev/block/by-name/system, .../vendor), there is
#     no `super` and no retrofit metadata, so mount-android.sh takes its plain
#     by-name path and parse-android-dynparts is never involved. This is the
#     simplest storage case in the tree.
#   - userdata is fileencryption=ice in the stock fstab, so it has to be
#     reformatted unencrypted for the rootfs.img/system.img install model.
#-----------------------------------------------------------------------------

require conf/machine/include/arm/arch-arm64.inc
require conf/machine/include/meta-android-halium.inc

PREFERRED_PROVIDER_virtual/kernel ?= "linux-oneplus-fajita"
MACHINE_KERNEL_PR = "r0"

# No rootfs is built for this machine (see above), so nothing is pulled in for
# one. Same arrangement as sunfish.conf, surya.conf and bluejay.conf.
MACHINE_ESSENTIAL_EXTRA_RDEPENDS = ""
MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS = ""

# NFC is fitted (NXP PN553 - the device tree installs libnfc-nxp*.conf and the
# android.hardware.nfc-service.nxp HAL). The fingerprint reader is the
# under-display Goodix one, declared in fajita.dtsi as goodix_fp with
# oem,fajta; the fpc and silead nodes beside it are the other two suppliers the
# same firmware can drive, not additional hardware. Dual nano-SIM tray, so no
# esim, and no physical keyboard.
MACHINE_FEATURES = "apm alsa bluetooth gps usbgadget usbhost phone wifi vfat ext2 touchscreen nfc fingerprint"

# 6.41" 1080x2340 AMOLED (Samsung, dsi_samsung_sofef00_m per fajita.dtsi).
# sqrt(1080^2+2340^2)/6.41 = 402 ppi. Kept for reference only: geometry and
# density come from the runtime adaptation, not from the build -
# luneos-device-config ships adaptations/fajita/deviceinfo. LineageOS buckets
# this as TARGET_SCREEN_DENSITY := 450, which is a density bucket rather than
# the panel's real ppi.
MACHINE_DISPLAY_WIDTH_PIXELS = "1080"
MACHINE_DISPLAY_HEIGHT_PIXELS = "2340"
MACHINE_DISPLAY_ORIENTATION = "0"
MACHINE_DISPLAY_PPI = "402"

# Tracks the GSI generation pinned for this device, not the vendor it runs
# against. libhybris gates its per-generation support on ANDROID_VERSION_MAJOR,
# which comes from this package, so the two have to move together - sargo.conf
# spells out at length what breaks when they do not.
PREFERRED_VERSION_android-headers-halium = "16.0%"

# Treble-era GSI, so the modern droid modules rather than the jb2q ones the
# halium include defaults to.
PREFERRED_VERSION_pulseaudio-modules-droid = "17.0.103%"

# No GSI baked in, as on halium-arm64, sargo, sunfish and surya: rootfs.img and
# android-rootfs.img sit side by side in userdata and the GSI is picked at
# install time from the device's vendor API level.
VIRTUAL-RUNTIME_android-system-image = ""

# Deliberately no XSERVER: this machine builds no rootfs, and the stack here is
# hwcomposer-based, which xf86-video-fbdev does not serve.

IMAGE_FSTYPES += "tar.gz"
IMAGE_ROOTFS_EXTRA_SPACE = "200000"

# BOARD_KERNEL_IMAGE_NAME := Image.gz-dtb in BoardConfigCommon.mk, and the
# header is v1, which has no dtb section - so unlike surya (v2) the appended
# tree stays inside the kernel section and kernel_android.bbclass leaves it
# alone. arch/arm64/boot/Makefile builds this target as Image.gz plus every
# .dtb found under boot/dts, and with CONFIG_BUILD_ARM64_DT_OVERLAY=y the base
# trees (sdm845.dtb, sdm845-v2.dtb, sdm845-v2.1.dtb) are built as the
# dtbo-base prerequisites of the fajita overlays. KERNEL_DEVICETREE is
# therefore deliberately unset - see the recipe.
KERNEL_IMAGETYPE = "Image.gz-dtb"

# A/B device, eMMC-style by-name path (the 6T is UFS, but its by-name symlinks
# are under /dev/block/bootdevice, as the stock fstab shows). Read by
# luneos-package.inc when an image package wants to name the boot partition;
# the active slot suffix still has to be appended by whatever flashes it -
# fastboot does this itself, which is how the flash kit installs.
ANDROID_BOARD_BOOTIMAGE_PARTITION = "/dev/block/bootdevice/by-name/boot"
# BOARD_FLASH_BLOCK_SIZE := 262144 (BOARD_KERNEL_PAGESIZE * 64).
ANDROID_BOARD_FLASH_BLOCK_SIZE = "262144"

# fajita.dtsi retags &qupv3_se9_2uart as qcom,msm-geni-console-oem, i.e. the
# debug UART is that QUP instance, handled by msm_geni_serial.c, which
# registers ttyMSM. UNVERIFIED on hardware, and a retail 6T exposes no UART
# without a jig - it is here because the kernel console is on it. netconsole
# over the USB gadget (see luneos.cfg) is the channel that actually works.
SERIAL_CONSOLE = "115200 ttyMSM0"

# Triple rear (16 MP wide, 20 MP secondary, plus the 6T's depth sensor) and
# 16 MP on the front. camera-front is what installs luneos-faced, and the pair
# is what installs the camera app - the count does not matter to either, only
# which way the sensors point.
MACHINE_FEATURES += "camera-rear camera-front"

#-----------------------------------------------------------------------------
# Where the per-device bits live, so they can be found from here:
#
#   display scaling, key devices   luneos-device-config, Tier 1:
#                                  adaptations/fajita/deviceinfo
#   udev device-node permissions   none of its own so far; check the device's
#                                  own ueventd.qcom.rc against the generic
#                                  65-android.rules on first boot.
#   Android services to stub       none shipped. LineageOS's livedisplay HAL
#                                  here is the AIDL
#                                  vendor.lineage.livedisplay-service.oneplus_sdm845,
#                                  which drives sysfs nodes directly rather
#                                  than surya's SDM backend, so there is no
#                                  reason to assume it crashes. Stub it only
#                                  from a logcat that shows it doing so.
#   kernel config delta            linux-oneplus-fajita/luneos.cfg
#
# UNVERIFIED: no OnePlus 6T has run this. Everything here is derived from
# LineageOS's device and kernel trees (lineage-22.2), not from a booted device,
# and the boot image geometry in the kernel recipe has not been checked against
# a stock or LineageOS boot.img the way surya's was. Do that first - it is a
# `fastboot boot` away from being cheap, and it is the one class of mistake
# that gives no diagnostics at all.
#-----------------------------------------------------------------------------
