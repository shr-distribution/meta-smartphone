# LuneOS / Halium kernel config delta - OnePlus 6T (fajita, SDM845)
#
# Merged on top of arch/arm64/configs/enchilada_defconfig
# (LineageOS/android_kernel_oneplus_sdm845, lineage-22.2, 4.9.337) - one config
# for both SDM845 OnePlus phones.
#
# Every entry was checked against that defconfig rather than copied blind from
# surya's fragment; the state it is changing is named where it is not obvious.
# Note that "absent from the defconfig" means off for all of these - none of
# them default y in 4.9.
#
# Note on this device: CONFIG_QCA_CLD_WLAN=y - wifi (qcacld-3.0) is built into
# the kernel - and LineageOS ships no prebuilt vendor kernel modules for fajita
# at all (no .ko in device/oneplus/{fajita,sdm845-common}; the .ko insmods left
# in the CAF init.target.rc refer to OxygenOS-era files that a LineageOS vendor
# does not have). So there are no stock vermagic/CRCs a rebuild could break:
# this port needs neither the Tier A KMI discipline nor mindphone's
# CONFIG_MODULE_FORCE_LOAD workaround. MODULE_SIG_FORCE stays as stock, with the
# signing key pinned in the recipe.

# ---------------------------------------------------------------------------
# 1. mer-kernel-check ERRORS - hard requirements
# ---------------------------------------------------------------------------

# systemd: name_to_handle_at()/open_by_handle_at(), used by the mount monitor.
# Explicitly "not set" in the stock defconfig.
CONFIG_FHANDLE=y

# SysV IPC is deliberately NOT enabled, matching surya and the GKI devices.
#
# mer-kernel-check asks for it, and the MP01 bring-up found it was not optional
# then - libPmLogLib called shmget()/shmat(), so with SYSVIPC off every PmLogCtl
# blocked forever. That is fixed at the source now: libPmLogLib imports
# shm_open@GLIBC (POSIX shm, no SysV IPC), and nothing else on the LuneOS boot
# path calls the SysV interfaces. See the long version in surya's fragment.
#
# Consequence to keep in mind: IPC_NS depends on SYSVIPC, so it goes too, and
# LXC must not unshare the IPC namespace - "lxc.namespace.keep = ipc user", the
# arrangement bluejay, panther and surya run with.
# CONFIG_SYSVIPC is not set

# systemd and the Halium initrd both require a kernel-populated /dev. Absent
# from the stock defconfig - Android's init makes its own /dev.
CONFIG_DEVTMPFS=y
CONFIG_DEVTMPFS_MOUNT=y

# Virtual console. Stock Android has no VT at all (explicitly "not set" here);
# LuneOS needs it for the console and for VT switching.
CONFIG_VT=y
CONFIG_VT_CONSOLE=y
CONFIG_CONSOLE_TRANSLATIONS=y
CONFIG_UNIX98_PTYS=y

# UTF-8 filenames
CONFIG_NLS_UTF8=y

# Not set in this defconfig, unlike surya's - kept here so the fragment states
# the whole requirement rather than depending on the Android defconfig staying
# this way. An empty STATIC_USERMODEHELPER_PATH disables every
# call_usermodehelper(), i.e. request_module(), core dumps and the firmware
# fallback loader.
# CONFIG_STATIC_USERMODEHELPER is not set

# ---------------------------------------------------------------------------
# 2. Namespaces - required by the LXC Android container
#
# NAMESPACES is already y, but UTS_NS and PID_NS are explicitly "not set" and
# USER_NS/NET_NS/CHECKPOINT_RESTORE are absent. Without PID_NS the container
# shares the host's pid namespace, which is the one namespace LXC here does
# need (IPC_NS is the one we do without, above).
# ---------------------------------------------------------------------------
CONFIG_NAMESPACES=y
CONFIG_UTS_NS=y
CONFIG_PID_NS=y
CONFIG_USER_NS=y
CONFIG_NET_NS=y
CONFIG_CHECKPOINT_RESTORE=y

# ---------------------------------------------------------------------------
# 3. cgroups - LXC device whitelisting + systemd resource control
#
# CGROUP_DEVICE in particular is off in the stock config and LXC needs it to
# apply lxc.cgroup.devices.* for the Android container. FREEZER, CPUACCT,
# BLK_CGROUP and CPUSETS are already y.
# ---------------------------------------------------------------------------
CONFIG_CGROUPS=y
CONFIG_CGROUP_DEVICE=y
CONFIG_CGROUP_FREEZER=y
CONFIG_CGROUP_SCHED=y
CONFIG_CGROUP_CPUACCT=y
CONFIG_CGROUP_PERF=y
CONFIG_CGROUP_NET_PRIO=y
CONFIG_NET_CLS_CGROUP=y
CONFIG_BLK_CGROUP=y
CONFIG_MEMCG=y
CONFIG_MEMCG_SWAP=y
CONFIG_CPUSETS=y

# ---------------------------------------------------------------------------
# 4. systemd optional-but-recommended
# ---------------------------------------------------------------------------
CONFIG_FANOTIFY=y
CONFIG_FANOTIFY_ACCESS_PERMISSIONS=y
CONFIG_AUTOFS4_FS=y
CONFIG_SECURITY_YAMA=y
CONFIG_TMPFS_XATTR=y
CONFIG_TMPFS_POSIX_ACL=y
CONFIG_SECCOMP=y

# SELinux: keep it built (the Android container needs the labels) but allow
# selinux=0 / permissive from the kernel command line during bring-up. The
# stock config has SECURITY_SELINUX but neither DEVELOP nor the boot parameter,
# so androidboot.selinux=permissive in the cmdline needs this to bite.
CONFIG_SECURITY_SELINUX=y
CONFIG_SECURITY_SELINUX_DEVELOP=y
CONFIG_SECURITY_SELINUX_BOOTPARAM=y

# ---------------------------------------------------------------------------
# 5. Bluetooth - bluebinder talks to the container HAL over a virtual HCI
#
# BT and RFKILL are y in stock; everything else here is absent, including
# HCIVHCI, which is the one bluebinder cannot work without.
# ---------------------------------------------------------------------------
CONFIG_BT=y
CONFIG_BT_HCIVHCI=y
CONFIG_BT_RFCOMM=y
CONFIG_BT_RFCOMM_TTY=y
CONFIG_BT_BNEP=y
CONFIG_BT_BNEP_MC_FILTER=y
CONFIG_BT_BNEP_PROTO_FILTER=y
CONFIG_BT_HIDP=y
CONFIG_RFKILL=y

# HID: BT keyboards/mice via hidraw, and uinput. UHID and INPUT_UINPUT are
# already y here; HIDRAW is not.
CONFIG_HIDRAW=y
CONFIG_UHID=y
CONFIG_INPUT_UINPUT=y

# ---------------------------------------------------------------------------
# 6. Waydroid / nested containers
#
# waydroid-kernel.inc forces VETH, SW_SYNC, UHID, OVERLAY_FS, the extra binder
# devices and RT_GROUP_SCHED=n on top of this - stock has RT_GROUP_SCHED=y and
# no VETH, both of which it corrects. Listed here too so the fragment stands
# alone; the .inc wins either way because it edits .config after kconfig.
# ---------------------------------------------------------------------------
CONFIG_SQUASHFS=y
CONFIG_SQUASHFS_XATTR=y
CONFIG_SQUASHFS_XZ=y
CONFIG_SQUASHFS_ZLIB=y
CONFIG_VETH=y
CONFIG_TUN=y
CONFIG_NETFILTER_XT_TARGET_CHECKSUM=y
CONFIG_BRIDGE=y

# ---------------------------------------------------------------------------
# 7. connman / ofono networking bits left off by the Android defconfig
# ---------------------------------------------------------------------------
CONFIG_NETFILTER_XT_MATCH_RECENT=y
CONFIG_NETFILTER_XT_MATCH_SCTP=y
CONFIG_NETFILTER_NETLINK_ACCT=y
CONFIG_NETFILTER_XT_MATCH_NFACCT=y

# ---------------------------------------------------------------------------
# 8. Storage / misc userland conveniences
#
# BLK_DEV_LOOP and FUSE_FS are already y (loop matters: rootfs.img and
# android-rootfs.img are loop-mounted out of userdata).
# ---------------------------------------------------------------------------
CONFIG_BLK_DEV_LOOP=y
CONFIG_BLK_DEV_NBD=y
CONFIG_FUSE_FS=y
CONFIG_CUSE=y
CONFIG_ISO9660_FS=y
CONFIG_UDF_FS=y

# Already y in stock, and worth keeping: /proc/config.gz is how
# mer_verify_kernel_config gets run against the config the device is actually
# running.
CONFIG_IKCONFIG=y
CONFIG_IKCONFIG_PROC=y

# overlayfs is already y here, unlike sargo's 4.9 kernel - so
# luneos-device-config can apply the adaptation as one overlay mount instead of
# falling back to a bind mount per file. Forced by halium-kernel.inc anyway.
CONFIG_OVERLAY_FS=y

# ---------------------------------------------------------------------------
# 9. Deliberate values that differ from mer-kernel-check's advice
# ---------------------------------------------------------------------------
# NOTE: do NOT write bare "# CONFIG_FOO=y" in comments in this file. Both
# kconfig and merge_config.sh read a line of that shape as a directive, so a
# "documentation" comment silently overrides the symbol. Reference symbols
# without the CONFIG_ prefix below.

# DUMMY: mer wants it unset (connman can present dummy0 as a wired service).
# Kept =y to match stock and the athena/mindphone/surya ports, where =y caused
# no trouble and Android's netd expects dummy0 to exist. This is the one
# deliberate mer ERROR.
CONFIG_DUMMY=y

# FW_LOADER_USER_HELPER: absent from this defconfig, and left that way.
# Qualcomm firmware is loaded directly from the filesystem
# (firmware_class.path=/vendor/firmware_mnt/image in the cmdline), so the
# fallback path is inert. mindphone turned this off and flagged it as a
# suspected wifi/firmware regression, which is the mirror image of the same
# non-event.

# Left as mer warnings on purpose:
#   RTC_DRV_CMOS            - x86 only, not available on arm64
#   SECURITY_YAMA_STACKED   - only meaningful on kernels < 4.3
#   NFS*/SUNRPC/LOCKD/CIFS/BTRFS/ECRYPT_FS - unused by LuneOS on a handset
#   BT_HCIUART*             - BT goes through bluebinder/vhci, not a UART HCI
#   LBDAF                   - always-on for 64-bit

# netconsole: stream kmsg to the host over the USB gadget network (UDP 6666,
# listen with: nc -ul 6666). Dynamic so the initramfs attaches it after the
# gadget comes up. A retail 6T exposes no debug UART without a jig, so this and
# the initramfs adb shell are the only channels for early boot output. Needs
# printk.devkmsg=on in the cmdline to get the replayed early buffer.
CONFIG_NETCONSOLE=y
CONFIG_NETCONSOLE_DYNAMIC=y

# ---------------------------------------------------------------------------
# 10. Image size - the kernel/ramdisk window
# ---------------------------------------------------------------------------
# The header gives the kernel a budget, not just an address: the bootloader
# writes the ramdisk at base+ramdisk_offset, so anything past
# ramdisk_offset - kernel_offset = 0x01000000 - 0x8000 = 16,744,448 B risks
# being overwritten. That is the athena rule.
#
# On fajita the kernel section is Image.gz *plus every appended base dtb*
# (sdm845.dtb, sdm845-v2.dtb, sdm845-v2.1.dtb, built with DTC_FLAGS=-@ because
# CONFIG_BUILD_ARM64_DT_OVERLAY=y, so they are larger than a plain dtb), which
# is what makes the margin worth watching here even though the boot partition
# itself is 64 MB and nowhere near full.
#
# Check it rather than assume it: measure the produced Image.gz-dtb and compare
# against that number. surya is the device that shows the rule does not bind
# everywhere - its kernel is 1 MiB past the line and boots, because a v2-era
# ABL relocates - but the 6T's ABL is a generation older and nothing here
# establishes which behaviour it has. If it needs shrinking, this is the lever:
# KALLSYMS_ALL is =y in stock and adds non-function symbols to the in-kernel
# table for no benefit to us. (IKHEADERS does not exist on 4.9.)
# CONFIG_KALLSYMS_ALL is not set

# ---------------------------------------------------------------------------
# 11. -Werror, which a nine-year-old tree cannot survive a modern GCC with
# ---------------------------------------------------------------------------
# enchilada_defconfig sets CONFIG_CC_WERROR=y, and the top-level Makefile turns
# that into a tree-wide -Werror. It is a reasonable setting for the toolchain
# OnePlus shipped this with in 2018; against OE's cross GCC (15.x here) every
# diagnostic added to the compiler since then becomes a build failure. Measured,
# with nothing else changed, the first two are:
#
#   arch/arm64/kernel/process.c:196   printk("\n%s: %pS:\n", name, addr) in the
#                                    OEM-added show_data() - %pS with an
#                                    unsigned long, which is type-unsafe and
#                                    correct at runtime on a 64-bit varargs ABI
#                                    [-Werror=format=]
#   kernel/extable.c:44               __stop___ex_table > __start___ex_table -
#                                    comparing two array names, which is what
#                                    the code means to do
#                                    [-Werror=array-compare]
#
# Both are warnings about style, not bugs, and there is no reason to expect them
# to be the last two: the alternative to this line is carrying a growing patch
# stack that says nothing about LuneOS and has to be re-audited on every host
# toolchain bump. Warnings still print; they are simply no longer fatal. Same
# call the mindphone port made when it dropped -Werror from 30 MTK vendor
# Makefiles, and athena from its 4.19 CAF tree.
# CONFIG_CC_WERROR is not set
