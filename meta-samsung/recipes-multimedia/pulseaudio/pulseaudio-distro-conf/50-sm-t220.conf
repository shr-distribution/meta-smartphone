# SM-T220: do not let the kernel kill PulseAudio's real-time threads.
#
# module-droid-card's sink threads (droid-sink-primary/-deep) run SCHED_RR, and
# PulseAudio arms RLIMIT_RTTIME = 200 ms on itself when it enables real-time
# scheduling. A write into the MediaTek audio HAL (audio.primary.mt6765) can run
# longer than that without sleeping, and when the limit expires the scheduler
# tick sends SIGKILL (SI_KERNEL, from hard-IRQ context) -- no log line, no core,
# systemd only reports "code=killed, status=9/KILL". Seen with the signal_generate
# tracepoint filtered on sig==9: the sender was the droid-sink-deep thread itself.
# -1 removes the limit and keeps real-time scheduling for latency.
rlimit-rttime = -1
