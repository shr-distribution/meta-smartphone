# The sdcard's partition, for example mmcblk1p1
sdcard_partition="not-set-in-machine.conf"

# The android system partition, for example mmcblk0p8
#
# Left unset deliberately. This device has dynamic partitions (stock
# fstab.mt6765 mounts system, system_ext, vendor, product and odm as "logical";
# the LP table of the stock super.img lists exactly those five, inside a
# 6023020544 byte super), so
# there is no fixed system partition node, and the GSI is carried as
# android-rootfs.img inside our own rootfs (see android-system-image-sm-t220.bb).
system_partition="not-set-in-machine.conf"

# The type of the root filesystem image, for example ext2
rootfs_type="ext2"

# TODO(verify): boot_backlight_node and boot_backlight_level, so the panel is
# lit before the compositor starts. radon uses
# /sys/class/leds/lcd-backlight/brightness, which is the MediaTek driver's
# node; whether this tablet's backlight is exposed there has not been read.
