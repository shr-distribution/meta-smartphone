# The sdcard's partition, for example mmcblk1p1. The microSD slot is dw_mmc.2
# (the stock fstab.universal5420 has voldmanaged=extSdCard on
# /devices/platform/dw_mmc.2), and the eMMC is mmcblk0.
sdcard_partition=mmcblk1p1

# The android system partition, for example mmcblk0p8. Only used for the panic
# scenario; the stock fstab.universal5420 mounts SYSTEM as mmcblk0p18. The Android
# system is carried as android-rootfs.img inside our own rootfs, not on this partition.
system_partition=mmcblk0p18

# The type of the root filesystem image, for example ext2
rootfs_type="ext2"

