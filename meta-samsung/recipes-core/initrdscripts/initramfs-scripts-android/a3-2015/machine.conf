# webos_deploy.sh unpacks the rootfs into /data/luneos, so what the init has to
# mount is the stock userdata partition; mount_root_partition then finds
# $SDCARD_DIR/luneos and bind-mounts it as the root.
#
# By label, not by number. Samsung's PIT differs between the 8 GB and the 16 GB
# (A300FU) variants, so an mmcblk0pNN that is right on one is wrong on the
# other. mdev-partlabel.sh creates /dev/disk/by-partlabel/* during the coldplug
# that start_mdev does, and mount_sdcard resolves its value with
# "find /dev -name ...", so a bare partition label is all it needs.
sdcard_partition="userdata"

# Fallback only, used when no /data/luneos is present. The stock system
# partition is 1.46 GB and a LuneOS rootfs does not fit in it, so this exists to
# fail somewhere recognisable rather than to be booted from.
system_partition="disk/by-partlabel/system"
