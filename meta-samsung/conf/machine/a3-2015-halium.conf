#-----------------------------------------------------------------------------
#@TYPE: Machine
#@NAME: Samsung Galaxy A3 (2015) (SM-A300F/FU/H/..., codename a3lte), Halium
#@DESCRIPTION: Machine configuration for the Samsung Galaxy A3 (2015) on
#              Halium: the 3.10 vendor kernel, the 16.0 GSI in an Android
#              container, 32-bit
#-----------------------------------------------------------------------------

# The Halium counterpart of a3-2015, which runs the same phone on a mainline kernel with no
# Android container. Both machines stay; this one uses the vendor's drivers through the GSI.
#
# Everything here is read from vlw's LineageOS 18.1 trees for the phone
# (github.com/vlw: android_device_samsung_a3lte, android_device_samsung_msm8916-common,
# android_kernel_samsung_msm8916-caf, proprietary_vendor_samsung, all branch lineage-18.1).
# Nothing has been read off the phone itself yet.

require conf/machine/include/meta-android-halium.inc

# 32-bit kernel and userland. The MSM8916 has Cortex-A53 cores, but the LineageOS a3lte build is
# armeabi-v7a only (FORCE_32_BIT := true in its BoardConfig.mk) and its kernel is an arch/arm one,
# so the vendor is 32-bit and pairs with the halium_arm GSI.
TARGET_ARCH = "arm"

PREFERRED_PROVIDER_virtual/kernel ?= "linux-samsung-a3-2015-halium"
MACHINE_KERNEL_PR = "r0"

# The same hardware as a3-2015, here through the vendor's HALs: Qualcomm WCNSS Wi-Fi and Bluetooth,
# a Qualcomm modem, GPS, Samsung's NFC HAL (vendor.samsung.hardware.nfc@1.0-service in the device
# tree, an S3FWRN5 chip), and a rear and a front camera (camera.vendor.msm8916.so).
MACHINE_FEATURES = "kernel26 apm alsa bluetooth gps usbgadget usbhost phone wifi vfat ext2 touchscreen nfc"
MACHINE_FEATURES += "camera-rear camera-front"

# 4.5" 540x960 AMOLED, as in a3-2015.conf.
MACHINE_DISPLAY_WIDTH_PIXELS = "540"
MACHINE_DISPLAY_HEIGHT_PIXELS = "960"
MACHINE_DISPLAY_ORIENTATION = "0"
MACHINE_DISPLAY_PPI = "245"

# The vendor is the one built from LineageOS 18.1 (Android 11, VNDK 30), made Treble-shaped by
# classes/halium-legacy-vendor.bbclass, and paired with the 16.0 GSI, as on sm-t520.
PREFERRED_VERSION_android-headers-halium = "16.0%"
VIRTUAL-RUNTIME_android-system-image = "android-system-image-a3-2015-halium"

PREFERRED_PROVIDER_virtual/xserver = "xserver-xorg"
XSERVER = " \
    xserver-xorg \
    xf86-input-evdev \
    xf86-video-fbdev \
"

# No kernel modules: lineageos_a3_defconfig builds everything in, the Wi-Fi driver too
# (PRONTO_WLAN=y).
MACHINE_EXTRA_RDEPENDS = " \
    android-kernel-bootimg \
    dosfstools \
"

KERNEL_IMAGETYPE = "zImage"

# Installed from TWRP (the device tree has a TWRP configuration), as a rootfs tarball, like the other
# Halium phones.
IMAGE_FSTYPES += "tar.gz"
IMAGE_ROOTFS_EXTRA_SPACE = "200000"

# The fstab of the device tree (a3lte/rootdir/etc/fstab.qcom) names the partitions under
# /dev/block/bootdevice/by-name; the eMMC is 7824900.sdhci (androidboot.bootdevice). The boot
# partition is 13 MiB (BOARD_BOOTIMAGE_PARTITION_SIZE).
ANDROID_BOARD_BOOTIMAGE_PARTITION = "/dev/block/bootdevice/by-name/boot"
ANDROID_BOARD_FLASH_BLOCK_SIZE = "4096"

# The kernel is 3.10, whose ext4 knows none of 64bit, metadata_csum, metadata_csum_seed or
# orphan_file, which a current mke2fs enables by default.
EXTRA_IMAGECMD:ext4:forcevariable = "-i 4096 -O ^64bit,^metadata_csum,^metadata_csum_seed,^orphan_file"

# The LineageOS command line has console=null; msm_serial_hs's ttyHSL0 is the MSM8916 debug UART.
# TODO(verify): that it is reachable on this phone.
SERIAL_CONSOLE = "115200 ttyHSL0"

require conf/machine/include/arm/armv7a/tune-cortexa8.inc
