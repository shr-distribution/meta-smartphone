#-----------------------------------------------------------------------------
#@TYPE: Machine
#@NAME: Samsung Galaxy Tab Pro 10.1 Wi-Fi (SM-T520, codename n2awifi / picassowifi)
#@DESCRIPTION: Machine configuration for the Samsung Galaxy Tab Pro 10.1
#              Wi-Fi, Halium (3.4 vendor kernel, Android container, 32-bit)
#-----------------------------------------------------------------------------

# Everything here is read from the stock firmware T520XXUAOI2 (SAMFW factory
# image: boot.img, the ramdisk's fstab.universal5420 and system.img's
# build.prop) or from the exynos5420 community's LineageOS device trees
# (android_device_samsung_{n2awifi,n2a-common,universal5420-common},
# lineage-18.1). Nothing has been read off the tablet itself yet; the
# TODO(verify) markers say what still has to be. See sm-t520-STATUS.md.

require conf/machine/include/meta-android-halium.inc

# 32-bit kernel and userland. The Exynos 5420 is a Cortex-A15/A7 big.LITTLE
# part and the stock build is armeabi-v7a only (ro.product.cpu.abi=armeabi-v7a,
# TARGET_ARCH arm in Lineage's BoardConfigCommon.mk).
TARGET_ARCH = "arm"

PREFERRED_PROVIDER_virtual/kernel ?= "linux-samsung-sm-t520"
MACHINE_KERNEL_PR = "r0"

# Declared from what the Lineage device tree wires up and the stock firmware
# ships (sensors.universal5420, camera.universal5420, gps.universal5420,
# audio.primary.universal5420):
#
#   wifi, bluetooth  BOARD_HAVE_SAMSUNG_WIFI with bcmdhd; Broadcom Bluetooth
#                    (BOARD_HAVE_BLUETOOTH_BCM, libbt_vndcfg.txt, 921600 baud).
#   touchscreen      a touch panel; the driver has not been identified.
#   gps              gps.universal5420.so and a gpsd.
#   camera-rear/     camera.universal5420.so; the tablet has an 8 MP rear and
#   camera-front     a 2 MP front camera. Not tried under LuneOS, so if the
#                    camera pipeline misbehaves this is the line to drop.
#   ir-blaster       the IR LED behind Samsung's iCE40 FPGA (CONFIG_ICE4_FPGA,
#                    CONFIG_IR_REMOCON_FPGA, /sys/class/sec/sec_ir), which
#                    irblasterd drives. Tried on the tablet on 6 Oct 2026: it
#                    emits (seen on a phone camera) and works an LG TV.
#
# Deliberately absent:
#
#   phone            the Wi-Fi model has no modem (the LTE sibling is the T525).
#   nfc              the SM-T520 has none.
#
# TODO(verify): the feature list against the running tablet
# (adb shell pm list features).
MACHINE_FEATURES = "kernel26 apm alsa bluetooth gps usbgadget usbhost vfat ext2 touchscreen wifi"
MACHINE_FEATURES += "camera-rear camera-front"
MACHINE_FEATURES += "ir-blaster"

# The panel is 2560x1600, native landscape (the kernel's framebuffer mode is
# "U:2560x1600p-60", read on the tablet; Lineage's device-common.mk has
# TARGET_SCREEN_HEIGHT 2560 and TARGET_SCREEN_WIDTH 1600, which is the other way
# round and misled this file at first).
#
# MACHINE_DISPLAY_PPI is the pixel density of a 10.1" 2560x1600 panel:
# sqrt(1600^2 + 2560^2) / 10.1 = 299 ppi. That is from the nominal diagonal,
# not from the tablet's reported physical size; Android's own density bucket,
# ro.sf.lcd_density=320, is not this.
# TODO(verify): the panel orientation (the hwrotation the compositor needs)
# and the real physical size (dumpsys display xDpi/yDpi).
MACHINE_DISPLAY_WIDTH_PIXELS = "2560"
MACHINE_DISPLAY_HEIGHT_PIXELS = "1600"
MACHINE_DISPLAY_ORIENTATION = "0"
MACHINE_DISPLAY_PPI = "299"

# The vendor is the one built from LineageOS 18.1 (Android 11, VNDK 30), made
# Treble-shaped by classes/halium-legacy-vendor.bbclass, and paired with the
# 16.0 GSI. The GSI follows the headers, not the vendor, as on the other
# 32-bit machines.
PREFERRED_VERSION_android-headers-halium = "16.0%"
VIRTUAL-RUNTIME_android-system-image = "android-system-image-sm-t520"

# HALIUM_LEGACY_GSI is deliberately not set. It only makes halium-kernel-3.4.inc
# add meta-android's renameat2 patch, which does not apply to this tree (it
# already carries memfd_create at 385); linux-samsung-sm-t520 has its own
# rebased copy, always applied, because the T520 only has the GSI path.

PREFERRED_PROVIDER_virtual/xserver = "xserver-xorg"
XSERVER = " \
    xserver-xorg \
    xf86-input-evdev \
    xf86-video-fbdev \
"

# No kernel modules: lineageos_n2awifi_defconfig builds everything in
# (CONFIG_MODULES is not set), including bcmdhd.
MACHINE_EXTRA_RDEPENDS = " \
    android-kernel-bootimg \
    dosfstools \
"

# The stock kernel is a board-file kernel with no device tree (the stock
# boot.img has a zero-length dt section), compressed with LZMA.
KERNEL_IMAGETYPE = "zImage"

# ext4 as well: nothing on this tablet unpacks a rootfs tarball, so LuneOS is
# installed as a rootfs.img inside a flashed userdata image rather than from a
# recovery zip. See classes/userdataimg.bbclass and luneos-odin-package.
IMAGE_FSTYPES += "tar.gz ext4 userdataimg"

# The kernel is 3.4, whose ext4 knows none of 64bit, metadata_csum,
# metadata_csum_seed or orphan_file, all of which a current mke2fs enables by
# default. Both filesystems the initramfs has to mount - the userdata wrapper and
# the rootfs.img inside it - are cleared of them. (Found from the first flash: the
# default images carried all four; `dumpe2fs -h` shows the features.) forcevariable
# because the image type override `ext4` is added after the machine's overrides.
EXTRA_IMAGECMD:ext4:forcevariable = "-i 4096 -O ^64bit,^metadata_csum,^metadata_csum_seed,^orphan_file"
USERDATA_IMAGE_FEATURES = "^64bit,^metadata_csum,^metadata_csum_seed,^orphan_file"
IMAGE_ROOTFS_EXTRA_SPACE = "200000"
IMAGE_CLASSES += "userdataimg"

# From the stock ramdisk's fstab.universal5420 (T520XXUAOI2): eMMC behind
# dw_mmc.0, partitions by name under /dev/block/platform/dw_mmc.0/by-name
# (BOOT, RECOVERY, SYSTEM, PERSDATA, EFS, CACHE, USERDATA). The stock fstab
# mounts system as mmcblk0p18, cache p19 and data p21. The boot partition is
# 8 MiB (BOARD_BOOTIMAGE_PARTITION_SIZE in Lineage's BoardConfig.mk), which the
# kernel plus the Halium initramfs have to fit in; see sm-t520-STATUS.md.
ANDROID_BOARD_BOOTIMAGE_PARTITION = "/dev/block/platform/dw_mmc.0/by-name/BOOT"
ANDROID_BOARD_FLASH_BLOCK_SIZE = "4096"

# CONFIG_CMDLINE of the kernel names the debug UART: console=ttySAC2,115200n8.
# TODO(verify): that it is physically reachable.
SERIAL_CONSOLE = "115200 ttySAC2"

require conf/machine/include/arm/armv7a/tune-cortexa8.inc

# module-droid-card names the sink after the mix port in the vendor's audio policy. Android 9 and
# earlier (hammerhead) call it "primary output", so the sink is sink.primary_output; this Android 11
# vendor calls it "primary-out", so the sink is sink.primary-out, and the pcm_output remap that
# audiod and module-palm-policy route by name found no master ("Failed to load module
# module-remap-sink ... initialization failed") and every stream stayed on a virtual sink: silence.
# There is no deep_buffer sink here.
WEBOS_PCM_OUTPUT_MASTER = "sink.primary-out"
