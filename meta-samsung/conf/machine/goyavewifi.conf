#-----------------------------------------------------------------------------
#@TYPE: Machine
#@NAME: Samsung Galaxy Tab 3 Lite 7.0 / Tab E Lite Wi-Fi (SM-T113, codename goyavewifi)
#@DESCRIPTION: Machine configuration for the Samsung SM-T113 (Spreadtrum SC7730S):
#              the 3.10 hybris kernel and the 16.0 GSI over a vendor derived from the
#              LineageOS 15.1 build of the tablet, 32-bit
#-----------------------------------------------------------------------------

# Written from the stock T113XXS0AQC2 firmware, the LineageOS 15.1 build of 11 Jun 2026
# (Lost-Entrepreneur439/SC8830-releases), mertsan2007's goyavewifi device tree and the LineageOS 16.0 trees of
# github.com/sc8830-Bringup. Nothing has been read off the tablet itself yet; see goyavewifi-STATUS.md.

require conf/machine/include/meta-android-halium.inc

# 32-bit only: a quad Cortex-A7 SoC, armeabi-v7a vendor, arch/arm kernel. The same cortexa8 tune as the other
# 32-bit halium machines, so their sstate is reusable.
TARGET_ARCH = "arm"

PREFERRED_PROVIDER_virtual/kernel ?= "linux-samsung-goyavewifi"
MACHINE_KERNEL_PR = "r0"

# A Wi-Fi tablet: no modem (the 15.1 vendor carries rild and phoneserver for the 3G sibling, SM-T116, which
# shares the tree). The 7" panel is a touchscreen. GPS and NFC are not listed: nothing read so far says
# whether this SKU has either.
MACHINE_FEATURES = "kernel26 apm alsa bluetooth usbgadget usbhost vfat ext2 touchscreen wifi"
MACHINE_FEATURES += "camera-rear camera-front"

# 1024x600 MIPI DSI behind a VX5B3D bridge, 154x90 mm (sprd-dsi-panel-vx5b3d-WSVGA_video.dtsi):
# 1024 / (154 / 25.4) = 169 ppi. Android runs it as a 600x1024 portrait screen with ro.sf.hwrotation=270
# (TARGET_SCREEN_WIDTH 600, TARGET_SCREEN_HEIGHT 1024 in the LineageOS device tree).
# TODO(verify): the orientation the compositor needs.
MACHINE_DISPLAY_WIDTH_PIXELS = "1024"
MACHINE_DISPLAY_HEIGHT_PIXELS = "600"
MACHINE_DISPLAY_ORIENTATION = "0"
MACHINE_DISPLAY_PPI = "169"

# The vendor is the Android 9 one (VNDK 28) built from the LineageOS 16.0 trees in a Halium 9.0 tree, made
# Treble-shaped by classes/halium-legacy-vendor.bbclass and paired with the 16.0 GSI, as on the A3 (2015) and
# the SM-T520.
# The GSI follows the headers, not the vendor, as on the other 32-bit machines.
PREFERRED_VERSION_android-headers-halium = "16.0%"
VIRTUAL-RUNTIME_android-system-image = "android-system-image-goyavewifi"

# HALIUM_LEGACY_GSI is deliberately not set. It only makes halium-kernel-3.4.inc add meta-android's renameat2
# patch, which does not apply to this tree (its syscall table stops at finit_module); linux-samsung-goyavewifi
# has its own version of it, always applied, because this tablet only has the GSI path.

PREFERRED_PROVIDER_virtual/xserver = "xserver-xorg"
XSERVER = " \
    xserver-xorg \
    xf86-input-evdev \
    xf86-video-fbdev \
"

# No kernel modules to ship: the Mali driver, bcmdhd (Wi-Fi) and the BCM4343 Bluetooth driver are built in.
MACHINE_EXTRA_RDEPENDS = " \
    android-kernel-bootimg \
    dosfstools \
"

KERNEL_IMAGETYPE = "zImage"

# Installed from the LineageOS recovery of the tablet (TWRP-style), as a rootfs tarball, like the other
# Halium tablets and phones.
IMAGE_FSTYPES += "tar.gz"
IMAGE_ROOTFS_EXTRA_SPACE = "200000"

# The kernel lives in the partition named KERNEL, not "boot": the updater-script of the LineageOS build
# writes boot.img to /dev/block/platform/sprd-sdhci.3/by-name/KERNEL. The eMMC is sprd-sdhci.3. The boot
# partition is 16 MiB, the flash block size 128 KiB (BOARD_BOOTIMAGE_PARTITION_SIZE, BOARD_FLASH_BLOCK_SIZE
# in the LineageOS device tree).
ANDROID_BOARD_BOOTIMAGE_PARTITION = "/dev/block/platform/sprd-sdhci.3/by-name/KERNEL"
ANDROID_BOARD_FLASH_BLOCK_SIZE = "131072"

# The kernel is 3.10, whose ext4 knows none of 64bit, metadata_csum, metadata_csum_seed or orphan_file, which
# a current mke2fs enables by default.
EXTRA_IMAGECMD:ext4:forcevariable = "-i 4096 -O ^64bit,^metadata_csum,^metadata_csum_seed,^orphan_file"

# The console of the stock boot.img header: the SC8830's UART1.
# TODO(verify): that it is reachable on this tablet.
SERIAL_CONSOLE = "115200 ttyS1"

require conf/machine/include/arm/armv7a/tune-cortexa8.inc
