#-----------------------------------------------------------------------------
#@TYPE: Machine
#@NAME: Samsung Galaxy A3 (2015) (SM-A300F/FU/H/M, codename a3lte/a3ulte/a33g)
#@DESCRIPTION: Machine configuration for the Samsung Galaxy A3 (2015) on a
#              mainline MSM8916 kernel. No Halium, no Android container.
#-----------------------------------------------------------------------------

require conf/machine/include/arm/arch-arm64.inc

PREFERRED_PROVIDER_virtual/kernel ?= "linux-samsung-a3-2015"
MACHINE_KERNEL_PR = "r0"

# No "keyboard": a slab with side keys and two capacitive touchkeys, not a
# physical keyboard.
#
# No "nfc", although the hardware IS there - msm8916-samsung-a2015-common.dtsi
# has an s3fwrn5 at nfc@27 and the mainline driver binds it. NFC_RDEPENDS is
# nfcd plus nfcd-binder-plugin, which reaches the Android NFC HAL over binder,
# and this machine has no Android container for it to talk to. Same reasoning
# tissot.conf gives for leaving it off. Declaring it again is the right move
# once something drives the kernel NFC netlink interface directly.
MACHINE_FEATURES = "apm alsa bluetooth gps usbgadget usbhost phone wifi vfat ext2 touchscreen"

# Rear camera: Sony IMX219 on CCI master 0 behind CSIPHY0, driven by the
# mainline imx219 driver. This pulls in org.webosports.app.camera and v4l-utils
# through CAMERA_RDEPENDS in packagegroup-luneos-extended.
#
# This replaces an earlier note here that said no camera feature should be
# declared because the MSM8916 CAMSS path was unusable on mainline. The SoC
# driver does exist (qcom,msm8916-camss) and the sensor is now described in
# msm8916-samsung-a3u-eur.dts, so the app has something to talk to. It remains
# untested on hardware: no msm8916 board upstream wires a camera sensor at all,
# so if frames never arrive, suspect CAMSS before the sensor.
#
# Front camera: Samsung S5K5E3YX, sharing CCI master 0 with the rear sensor
# (the vendor puts both there; only the CSIPHY, MCLK and reset line differ) and
# driven by the s5k5e3 driver added alongside this port.
#
# camera-front also gates FACEUNLOCK_RDEPENDS, so face unlock comes with it.
MACHINE_FEATURES += "camera-rear camera-front"

# 4.5" 540x960 AMOLED (Samsung AMS452EF01 with an S6E88A0 controller)
MACHINE_DISPLAY_WIDTH_PIXELS = "540"
MACHINE_DISPLAY_HEIGHT_PIXELS = "960"
MACHINE_DISPLAY_ORIENTATION = "0"
MACHINE_DISPLAY_PPI = "245"

PREFERRED_PROVIDER_virtual/libgl ?= "mesa"
PREFERRED_PROVIDER_virtual/libgbm ?= "mesa"
PREFERRED_PROVIDER_virtual/egl ?= "mesa"
PREFERRED_PROVIDER_virtual/mesa ?= "mesa"
PREFERRED_PROVIDER_virtual/libgles1 ?= "mesa"
PREFERRED_PROVIDER_virtual/libgles2 ?= "mesa"
PREFERRED_PROVIDER_libgbm ?= "mesa"

# Not using Halium, it's a mainline kernel
VIRTUAL-RUNTIME_android-initramfs-scripts = "initramfs-scripts-android"

PREFERRED_PROVIDER_virtual/xserver = "xserver-xorg"
XSERVER = " \
    xserver-xorg \
    xf86-input-evdev \
    xf86-video-fbdev \
"

# msm-firmware-loader pulls modem/WCNSS/venus blobs off the stock apnhlos,
# modem and persist partitions, which Samsung leaves in place. It does not
# cover the two the A3 needs from elsewhere:
#   - the Adreno 306 microcode, which is in linux-firmware
#   - WCNSS_qcom_wlan_nv.bin, the per-device WiFi calibration, which Samsung
#     ships on the stock /system - firmware-samsung-a3-2015 lifts it from there
# fsck.vfat is needed for the vfat firmware partitions.
MACHINE_EXTRA_RDEPENDS = " \
    msm-firmware-loader \
    firmware-samsung-a3-2015 \
    linux-firmware-qcom-adreno-a3xx \
    kernel-modules \
    dosfstools \
"

KERNEL_IMAGETYPE = "Image.gz"

# One DT covers every A3 2015 variant; postmarketOS made the same call when it
# collapsed a3lte/a3ulte/a33g into a single device package.
KERNEL_DEVICETREE = "qcom/msm8916-samsung-a3u-eur.dtb"

IMAGE_FSTYPES += "tar.gz"
IMAGE_ROOTFS_EXTRA_SPACE = "200000"

# Upstream lk2nd (msm8916-mainline) loads the real Android boot image from
# 512 KiB into the boot partition. The msm8953-mainline fork that tissot, rosy
# and mido use moved that to 1 MiB, which is why luneos-package.inc defaults to
# 1M - this machine has to say otherwise or lk2nd reads past its own image.
LK2ND_BOOT_IMAGE_OFFSET = "512K"

# Samsung's partition table has no fixed mmcblk numbering across the 8 GB and
# 16 GB variants, so name the partition instead of numbering it.
ANDROID_BOARD_BOOTIMAGE_PARTITION = "/dev/block/bootdevice/by-name/boot"

# Only used for the ext4.fastboot image type, which this machine does not build
# (the rootfs is a directory under /data, see PORTING.md). Sized after the
# stock system partition so the value is not a lie if someone enables it.
ANDROID_BOARD_SYSTEMIMAGE_PARTITION_SIZE = "1568669696"
ANDROID_BOARD_FLASH_BLOCK_SIZE = "131072"

# Samsung wires the MSM8916 UART to the 3.5 mm jack: a serial cable with the
# right resistor on the ID pin gives a real console, which is worth having on a
# device with no other early output. Unlike tissot and rosy, do not blank
# SERIAL_CONSOLES for this machine.
SERIAL_CONSOLE = "115200 ttyMSM0"
