#-----------------------------------------------------------------------------
#@TYPE: Machine
#@NAME: Samsung Galaxy Tab A7 Lite Wi-Fi (SM-T220, codename gta7litewifi)
#@DESCRIPTION: Machine configuration for the Samsung Galaxy Tab A7 Lite
#              Wi-Fi, Halium (stock vendor kernel plus Android container)
#-----------------------------------------------------------------------------

# Everything here is read from gta7lite/android_kernel_samsung_ot8 (halium-12,
# gta7litewifi_defconfig) or from the LineageOS device trees in the same
# GitHub organisation (android_device_samsung_gta7litewifi and
# android_device_samsung_mt6765-common). Nothing has been read off the tablet
# itself yet; the TODO(verify) markers say what still has to be. See
# sm-t220-STATUS.md.

require conf/machine/include/arm/arch-arm64.inc
require conf/machine/include/meta-android-halium.inc

# 64-bit kernel and userland. Lineage's BoardConfigCommon.mk has TARGET_ARCH
# arm64 with a 32-bit TARGET_2ND_ARCH for compatibility, and this tree has only
# an arm64 defconfig for the platform (arch/arm/configs has nothing for it).
# Unlike mindphone (MT6739, a 32-bit kernel on a 64-bit-capable SoC) there is
# no reason to build 32-bit, so this is the same shape as radon.

PREFERRED_PROVIDER_virtual/kernel ?= "linux-samsung-sm-t220"
MACHINE_KERNEL_PR = "r0"

# Read off the stock kernel configuration, and confirmed on the tablet itself
# (adb, T220XXS6CWL2, `pm list features`):
#
#   wifi, bluetooth  android.hardware.wifi / .bluetooth(_le); CONFIG_MTK_COMBO=y
#                    with CONSYS_6765, plus CFG80211 and BT_BREDR/HS/LE.
#   touchscreen      android.hardware.touchscreen.multitouch.distinct; dumpsys
#                    input shows two TOUCH|TOUCH_MT devices.
#   gps              android.hardware.location.gps is reported.
#   camera-rear/     android.hardware.camera and .camera.front, and
#   camera-front     dumpsys media.camera lists 2 devices. Declared from what
#                    Android's HAL reports; not yet tried under LuneOS, so if
#                    the camera pipeline misbehaves this is the line to drop.
#   nfc              NOT declared: "# CONFIG_NFC is not set" and no NFC feature.
#
# Deliberately absent:
#
#   phone            the Wi-Fi model has no modem: the device reports
#                    telephony.ims features but neither "telephony" nor
#                    "radio". The same OT8 kernel serves the LTE T225/T227, so
#                    the kernel's modem options say nothing about this variant.
#
# Do not read the camera complement off CONFIG_CUSTOM_KERNEL_IMGSENSOR, which
# lists nine sensors: that is the reference-design-defaults trap mindphone.conf
# and radon.conf document. The device's own report above is what counts.
MACHINE_FEATURES = "alsa bluetooth gps usbgadget usbhost vfat ext2 touchscreen wifi"
MACHINE_FEATURES += "camera-rear camera-front"

# 800x1340 from the defconfig: CONFIG_LCM_WIDTH="800", CONFIG_LCM_HEIGHT="1340"
# (the ft8201_lianchuang_boe_dsi_vdo_hdp_wxga panel is the last of the twelve
# listed in CONFIG_CUSTOM_KERNEL_LCM and the only one that is 800 wide).
# Upright: CONFIG_MTK_LCM_PHYSICAL_ROTATION="0".
#
# MACHINE_DISPLAY_PPI is the physical pixel density. dumpsys display on the
# tablet reports xDpi=189.906 and yDpi=197.883 for the 800x1340 mode, which is
# the panel size the vendor HWC advertises: 800/189.906*25.4 = 107.0 mm by
# 1340/197.883*25.4 = 172.0 mm, a 202.6 mm (7.98") diagonal, so
#   sqrt(800^2 + 1340^2) / 7.98 = 195.6 ppi  ->  196.
# (Android's own density bucket is 213, ro.sf.lcd_density, and is not this.)
# TODO(verify): that is the driver's figure, not a measurement; hold a ruler to
# the glass before trusting it to a few percent.
MACHINE_DISPLAY_WIDTH_PIXELS = "800"
MACHINE_DISPLAY_HEIGHT_PIXELS = "1340"
MACHINE_DISPLAY_ORIENTATION = "0"
MACHINE_DISPLAY_PPI = "196"

# The stock vendor, read from /vendor/build.prop in T220XXSAEYE4's super.img:
# ro.vendor.build.version.release=12, sdk 31, ro.vndk.version=31, fingerprint
# samsung/gta7litewifixx/gta7litewifi:12/SP1A.210812.016. That is the same VNDK
# generation as mp01, which runs the same pair of versions below.
PREFERRED_VERSION_android-headers-halium = "16.0%"
PREFERRED_VERSION_pulseaudio-modules-droid = "17.0.103%"
VIRTUAL-RUNTIME_android-system-image = "android-system-image-sm-t220"

PREFERRED_PROVIDER_virtual/xserver = "xserver-xorg"
XSERVER = " \
    xserver-xorg \
    xf86-input-evdev \
    xf86-video-fbdev \
"

MACHINE_EXTRA_RDEPENDS = " \
    android-kernel-bootimg \
    dosfstools \
"

KERNEL_IMAGETYPE = "Image.gz"
# ext4 as well: nothing on this tablet unpacks a rootfs tarball, so LuneOS is
# installed as a rootfs.img inside a flashed userdata image rather than from a
# recovery zip. See classes/userdataimg.bbclass and luneos-odin-package.
IMAGE_FSTYPES += "tar.gz ext4 userdataimg"
IMAGE_ROOTFS_EXTRA_SPACE = "200000"
IMAGE_CLASSES += "userdataimg"

# From the stock ramdisk's fstab.mt6765 (T220XXSAEYE4): a single-slot device,
# not A/B - boot, recovery, dtbo and vbmeta each have one partition, under
# /dev/block/platform/bootdevice/by-name. system, system_ext, vendor, product and
# odm are logical partitions inside super (6023020544 bytes per Lineage's
# BoardConfigCommon.mk; confirmed by the LP table of the stock super.img), so
# there is no fixed system partition node. As on radon, the GSI is carried as
# android-rootfs.img inside our own rootfs. userdata is f2fs. boot is 32 MiB
# (the stock boot.img is exactly 33554432 bytes).
ANDROID_BOARD_BOOTIMAGE_PARTITION = "/dev/block/platform/bootdevice/by-name/boot"
ANDROID_BOARD_FLASH_BLOCK_SIZE = "131072"

# The kernel's own mt6765.dts sets bootargs "console=tty0
# console=ttyS0,921600n1" and the defconfig has CONFIG_SERIAL_8250_MT6577=y with
# CONFIG_SERIAL_8250_CONSOLE=y, so the debug UART is ttyS0 at 921600.
# The running tablet has /dev/ttyS0 and /dev/ttyS1 and no ttyMT*, which agrees.
# TODO(verify): that the UART is physically reachable on the board.
SERIAL_CONSOLE = "921600 ttyS0"
