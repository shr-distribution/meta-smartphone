# LuneOS/Halium config delta - Samsung Galaxy Tab A7 Lite Wi-Fi (SM-T220,
# gta7litewifi, MT8768T).
#
# Merged on top of arch/arm64/configs/gta7litewifi_defconfig and the branch's
# own arch/arm64/configs/halium.config, from gta7lite/android_kernel_samsung_ot8
# (halium-12, 4.19.191). halium.config already turns on DEVTMPFS, FHANDLE,
# SYSVIPC, VT and the IPC/NET/PID/USER/UTS namespaces, so none of those are
# repeated here.
#
# Every line below was checked against gta7litewifi_defconfig and is either
# absent or set the wrong way there. The list is a first pass, taken from what
# the mindphone and mp01 fragments needed; it has NOT been validated against a
# running kernel. Check the built .config for "not set" surprises and for
# merge_config.sh warnings about overridden symbols.
#
# NOTE: do NOT write bare "# CONFIG_FOO=y" in comments in this file.
# scripts/kconfig/merge_config.sh matches ^(# )?CONFIG_[A-Za-z0-9_][= ] and
# treats such a line as a directive. Reference symbols without the CONFIG_
# prefix in prose.

# request_module() autoloading. Stock sets STATIC_USERMODEHELPER=y with the
# path /system_ext/bin/aee_core_forwarder, which disables every other usermode
# helper. Same fix as mp01.
# CONFIG_STATIC_USERMODEHELPER is not set

# systemd and Android's libprocessgroup
CONFIG_CGROUP_DEVICE=y
CONFIG_AUTOFS4_FS=y

# bluebinder feeds the Android BT HAL into a virtual HCI, so vhci is its kernel
# prerequisite. Stock has CONFIG_BT_BREDR/HS/LE but not this.
CONFIG_BT_HCIVHCI=y

# Hotplug events to the initramfs's mdev.
CONFIG_UEVENT_HELPER=y
CONFIG_UEVENT_HELPER_PATH=""

# ---------------------------------------------------------------------------
# ABI: the Android container loads Samsung's PREBUILT vendor modules
# ---------------------------------------------------------------------------
# This tablet's vendor partition (T220XXSAEYE4, read from super.img) carries ten
# prebuilt modules built against the STOCK kernel: wmt_drv, wmt_chrdev_wifi,
# wlan_drv_gen4m (5.8 MB), bt_drv_connac1x, gps_drv, fmradio_drv_mt6631,
# connfem, fpsgo, met, trace_mmstat. Any option that changes the layout of a
# struct they touch makes them read the wrong offsets.
#
# Measured on the Titan Pocket (same MediaTek recipe, see meta-unihertz
# luneos.cfg): NETPOLL put three pointers into net_device_ops and the vendor's
# wlan_drv called ndo_bpf through the shifted table - a kernel panic 22 s into
# every boot, found from ramoops. SYSVIPC was one of the options put back.
#
# Rule: before turning anything on, check it is not inside task_struct,
# net_device(_ops), sk_buff, sock, inode, file, device or cred.
#
# Compared against Samsung's own gta7litewifi_defconfig (the stock config),
# the built .config differed in 28 options. The only ones inside those structs:

# No System V IPC. It adds sysvsem/sysvshm to task_struct in front of files,
# nsproxy and signal, which the stock-built vendor modules do not expect.
# IPC_NS, SYSVIPC_COMPAT and SYSVIPC_SYSCTL go with it. LuneOS no longer needs
# it (PmLogLib stopped using shmget/shmat) and the container config already
# keeps the host namespaces: lxc.namespace.keep = ipc user. The upstream
# halium.config turns SYSVIPC on, so this has to come after it.
# CONFIG_SYSVIPC is not set

# The vendor modules are force-loaded past the vermagic check (our release
# string differs from the stock "4.19.191-27189992-abT220XXS6CWL2"), and
# modprobe --force is refused by the kernel without this. Same as the Pocket.
CONFIG_MODULE_FORCE_LOAD=y

