# LuneOS/Halium config delta - Samsung Galaxy Tab Pro 10.1 Wi-Fi (SM-T520,
# n2awifi / picassowifi, Exynos 5420).
#
# Merged on top of arch/arm/configs/lineageos_n2awifi_defconfig from
# exynos5420/android_kernel_samsung_exynos5420 (3.4, branch lineage-18.1). That
# defconfig is the one the LineageOS 18.1 (Android 11) build of this tablet
# boots with. It is an Android config, so it lacks what a systemd userspace
# assumes: NAMESPACES, DEVTMPFS, FHANDLE, VT and the cgroup device controller.
#
# First pass. It was merged into the real defconfig with the tree's own kconfig
# and the result inspected, but NOT booted. Re-check the built .config.
#
# NOTE: do NOT write bare "# CONFIG_FOO=y" in comments in this file.
# scripts/kconfig/merge_config.sh matches ^(# )?CONFIG_[A-Za-z0-9_][= ] and
# treats such a line as a directive. Reference symbols without the CONFIG_
# prefix in prose.

# ---------------------------------------------------------------------------
# Deliberately OFF
# ---------------------------------------------------------------------------
# No System V IPC. The defconfig turns it on, and the UBports/Droidian lists
# ask for it, but LuneOS no longer needs it: PmLogLib stopped calling
# shmget/shmat in September 2026 and SYSVIPC is off on every recent port (see
# kernel-porting.md in luneos-porting-mcp). IPC_NS depends on SYSVIPC, so it
# goes too, and the container config already tells LXC not to unshare the
# IPC and USER namespaces (lxc.namespace.keep = ipc user, the default of
# ANDROID_LXC_KEEP_NS). SYSVIPC_SYSCTL is only a child of SYSVIPC.
# CONFIG_SYSVIPC is not set
# CONFIG_SYSVIPC_SYSCTL is not set

# 3.4 marks the user namespace EXPERIMENTAL and defaults it to y as soon as
# NAMESPACES is on, so it would come back silently. Nothing asks for it: LXC is
# told to keep the host's. TODO(verify): that lxc starts without it on this
# kernel (the lxc-config comment says clone(CLONE_NEWUSER) is simply not
# requested).
# CONFIG_USER_NS is not set

# Real-time group scheduling. The defconfig has it on. With it, a task in a
# non-root cgroup has no RT runtime unless one is assigned, so
# sched_setscheduler(SCHED_FIFO) fails for the container's services (the
# composer sets itself SCHED_FIFO). waydroid-kernel.inc forces it off for the
# same reason.
# CONFIG_RT_GROUP_SCHED is not set

# fanotify stays off, as on the other ports; systemd does not need it.
# hammerhead-halium has it on, so it is known to be harmless there, just
# unneeded.
# CONFIG_FANOTIFY is not set

# Android's paranoid network check limits socket creation to the AID_INET
# group. The Halium 3.4 tree of hammerhead (the working 3.4 reference) has it
# off so the glibc userspace, whose services do not carry Android group ids,
# can open sockets. The note in kernel-porting.md about keeping it on is about
# rild on hybris 12.1+; this is a Wi-Fi-only tablet with no modem.
# CONFIG_ANDROID_PARANOID_NETWORK is not set

# ---------------------------------------------------------------------------
# What Halium needs and the defconfig lacks
# ---------------------------------------------------------------------------
# The namespaces the container does use. PID_NS, UTS_NS and NET_NS are clean;
# IPC_NS and USER_NS are the ones left out above.
CONFIG_NAMESPACES=y
CONFIG_UTS_NS=y
CONFIG_PID_NS=y
CONFIG_NET_NS=y

CONFIG_DEVTMPFS=y
CONFIG_DEVTMPFS_MOUNT=y
CONFIG_FHANDLE=y
CONFIG_VT=y

# systemd and Android's libprocessgroup
CONFIG_CGROUP_DEVICE=y
CONFIG_CPUSETS=y
CONFIG_BLK_CGROUP=y
CONFIG_AUTOFS4_FS=y

# POSIX ACLs on ext4, which the LuneOS rootfs and userdata use (systemd's
# tmpfiles and journal set ACLs). The Lineage defconfig has them off.
CONFIG_EXT4_FS_POSIX_ACL=y

# bluebinder feeds the Android BT HAL into a virtual HCI, so vhci is its kernel
# prerequisite.
CONFIG_BT_HCIVHCI=y

# Hotplug events go to udev, not to /sbin/hotplug.
CONFIG_UEVENT_HELPER=y
CONFIG_UEVENT_HELPER_PATH=""

# /proc/config.gz, to compare a running kernel against this file.
CONFIG_IKCONFIG=y
CONFIG_IKCONFIG_PROC=y

# ---------------------------------------------------------------------------
# The SM-T520 reboots itself after about four minutes unless these are off
# ---------------------------------------------------------------------------
# Found from the first flash: TWRP's own 3.4 kernel (same tree, same config
# options) ended every session with
#
#   Kernel panic - not syncing: hung_task: blocked tasks      (at 242.5 s)
#
# The board file (arch/arm/mach-exynos/board-universal5420-sensor.c) registers a
# Semtech SX9500 grip sensor at I2C address 0x28 on bus 4 unconditionally. The
# SX9500 is a SAR sensor of the LTE models; the Wi-Fi T520 appears not to have the
# chip (not proven - nothing answers there), so the driver's transfers time out
# once a second ("exynos5-hs-i2c.4: tx timeout"), a kernel worker stays blocked,
# and after the 120 s hung-task timeout plus one more check period khungtaskd
# panics the kernel. PANIC_TIMEOUT=5 then reboots it, which looks like a
# power-off. The Lineage defconfig has the panics on and the driver in.
#
# No driver for a chip that is not there, and a stuck task is reported, not fatal.
# CONFIG_SENSORS_SX9500 is not set
# CONFIG_BOOTPARAM_HUNG_TASK_PANIC is not set
CONFIG_BOOTPARAM_HUNG_TASK_PANIC_VALUE=0
# CONFIG_BOOTPARAM_SOFTLOCKUP_PANIC is not set

# Options the hammerhead and mako Halium kernels (3.4.0 / 3.4.113) have on and the
# Lineage 18.1 defconfig of this tablet leaves off, found by diffing the built
# .config files of the three kernels for the namespace, procfs, devpts, network
# and syscall options:
#   DEVPTS_MULTIPLE_INSTANCES  the Android container and systemd mount a private
#                              devpts (mount -o newinstance)
#   BRIDGE                     lxcbr0 / the container's network
#   NETFILTER_XT_MATCH_OWNER   Android's netd matches packets by uid
#   AIO                        io_setup() and friends; a plain syscall set
#   PROC_EVENTS                process event connector (mako has it on)
# Not copied: IPV6_ROUTE_INFO (this tree's net/ipv6/route.c does not compile with it:
# rt6_route_rcv() calls rt6_get_route_info() with a struct net the function
# does not take), IPV6_SUBTREES, SECURITY_{TOMOYO,SMACK,YAMA,APPARMOR} and STRICT_DEVMEM, which the
# two other kernels carry for their distributions and Halium does not need.
CONFIG_DEVPTS_MULTIPLE_INSTANCES=y
CONFIG_BRIDGE=y
CONFIG_NETFILTER_XT_MATCH_OWNER=y
CONFIG_AIO=y
CONFIG_PROC_EVENTS=y

# Swap. The board's own config has ZSWAP on ZSMALLOC_NEW, a cache in front of a swap device,
# and no swap device exists to sit in front of: zram-on.sh finds no /sys/devices/virtual/block/zram0
# and swap-on.sh fails ("swapon: cannot open /tmp/zram0"), so this 1.7 GB tablet ran with no swap at
# all (4 Oct 2026; free memory 48 MB with the UI up). ZRAM needs the plain ZSMALLOC, which excludes
# ZSMALLOC_NEW, and ZSWAP selects that one. The klimtlte config of the same tree builds exactly this.
# CONFIG_ZSWAP is not set
# CONFIG_ZSMALLOC_NEW is not set
CONFIG_ZSMALLOC=y
CONFIG_ZRAM=y
CONFIG_ZRAM_LZ4_COMPRESS=y

# Bluetooth through bluez's hciattach on /dev/ttySAC0 (bcm-hciattach.service in systemd-machine-units).
#
# The Bluetooth stack of this 3.4 tree is the original one (management interface 1.0, revision 0): bluetoothd 5.86
# starts a discovery with it and the kernel never answers (Settings found no devices), though the controller itself
# scans fine from user space. Hammerhead's own kernel replaces it with Linux backports 4.2-rc7, built into the kernel
# (CONFIG_BACKPORT_INTEGRATE; commits by Simon Fels and Marius Gripsgard from the Ubuntu Touch / Halium team, in
# shr-distribution/linux hammerhead/3.4/halium-9.0), which has management interface 1.10. The backports' Bluetooth
# takes over from the in-tree one, which must be off: BACKPORT_BT depends on !BT.
#
# These lines are applied again by do_configure:append in the recipe: the BACKPORT_BT_* symbols only exist once
# BACKPORT_LINUX is set, so the first oldconfig pass drops them silently.
CONFIG_CRYPTO_CMAC=y
# CONFIG_BT is not set
CONFIG_BACKPORT_INTEGRATE=y
CONFIG_BACKPORT_LINUX=y
CONFIG_BACKPORT_BPAUTO_USERSEL_BUILD_ALL=y
CONFIG_BACKPORT_6LOWPAN=y
CONFIG_BACKPORT_BT=y
CONFIG_BACKPORT_BT_BREDR=y
CONFIG_BACKPORT_BT_LE=y
CONFIG_BACKPORT_BT_6LOWPAN=y
CONFIG_BACKPORT_BT_DEBUGFS=y
CONFIG_BACKPORT_BT_RFCOMM=y
CONFIG_BACKPORT_BT_RFCOMM_TTY=y
CONFIG_BACKPORT_BT_BNEP=y
CONFIG_BACKPORT_BT_BNEP_MC_FILTER=y
CONFIG_BACKPORT_BT_BNEP_PROTO_FILTER=y
CONFIG_BACKPORT_BT_HIDP=y
CONFIG_BACKPORT_BT_HCIUART=y
CONFIG_BACKPORT_BT_HCIUART_H4=y
CONFIG_BACKPORT_BT_HCIVHCI=y

# bcmdhd reads its firmware and nvram itself. lineageos_n2awifi_defconfig has them under
# /system/etc/wifi, which the plain 16.0 GSI does not have; the host's /etc/wifi is a link to
# /vendor/etc/wifi (android-system-image-legacy-gsi.inc), where the vendor image keeps them.
CONFIG_BCMDHD_FW_PATH="/etc/wifi/bcmdhd_sta.bin"
CONFIG_BCMDHD_NVRAM_PATH="/etc/wifi/nvram_net.txt"
