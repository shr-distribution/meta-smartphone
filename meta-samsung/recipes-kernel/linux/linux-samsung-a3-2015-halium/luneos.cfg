# LuneOS/Halium config delta - Samsung Galaxy A3 (2015) (SM-A300F/FU/H/..., a3lte, MSM8916).
#
# Merged on top of arch/arm/configs/lineageos_a3_defconfig from vlw/android_kernel_samsung_msm8916-caf
# (3.10.108, branch lineage-18.1), the config the LineageOS 18.1 build of the A3 boots with. It is an
# Android config, so it lacks what a systemd userspace and the LXC container assume.
#
# First pass: merged and built, NOT booted. Re-check the built .config.
#
# NOTE: do NOT write bare "# CONFIG_FOO=y" in comments in this file. kconfig reads such a line as a
# directive. Reference symbols without the CONFIG_ prefix in prose.

# ---------------------------------------------------------------------------
# Deliberately OFF (the same choices as sm-t520's luneos.cfg, which explains them)
# ---------------------------------------------------------------------------
# No System V IPC and so no IPC namespace; LXC keeps the host's IPC and user namespaces.
# CONFIG_SYSVIPC is not set
# CONFIG_USER_NS is not set
# Real-time group scheduling: with it a task in a non-root cgroup gets no RT runtime, and the
# container's composer cannot make itself SCHED_FIFO.
# CONFIG_RT_GROUP_SCHED is not set
# Android's paranoid network check limits sockets to the AID_INET group, which the glibc userspace's
# services do not carry.
# CONFIG_ANDROID_PARANOID_NETWORK is not set

# ---------------------------------------------------------------------------
# What Halium needs and the defconfig lacks
# ---------------------------------------------------------------------------
CONFIG_NAMESPACES=y
CONFIG_UTS_NS=y
CONFIG_PID_NS=y
CONFIG_NET_NS=y

CONFIG_DEVTMPFS=y
CONFIG_DEVTMPFS_MOUNT=y
CONFIG_FHANDLE=y
CONFIG_VT=y

# systemd and Android's libprocessgroup
CONFIG_CGROUP_DEVICE=y
CONFIG_CPUSETS=y
CONFIG_BLK_CGROUP=y
CONFIG_AUTOFS4_FS=y
CONFIG_TMPFS_XATTR=y
CONFIG_TMPFS_POSIX_ACL=y
CONFIG_EXT4_FS_POSIX_ACL=y

# Hotplug events go to udev, not to /sbin/hotplug.
CONFIG_UEVENT_HELPER_PATH=""

# /proc/config.gz, to compare a running kernel against this file.
CONFIG_IKCONFIG=y
CONFIG_IKCONFIG_PROC=y

# What sm-t520's fragment adds for the container and the distribution, from a diff against the working
# hammerhead and mako Halium kernels: a private devpts, the lxcbr0 bridge, netd's uid match, AIO and the
# process event connector.
CONFIG_DEVPTS_MULTIPLE_INSTANCES=y
CONFIG_BRIDGE=y
CONFIG_NETFILTER_XT_MATCH_OWNER=y
CONFIG_AIO=y
CONFIG_PROC_EVENTS=y

# bluebinder feeds the Android BT HAL into a virtual HCI, so vhci is its kernel prerequisite (as on
# sm-t520); without it bluebinder exits with "No such device". It and connman also use /dev/rfkill.
CONFIG_BT_HCIVHCI=y
CONFIG_RFKILL=y

# DEBUG (bring-up): the kernel console in a RAM buffer that survives a warm reset; see the
# ramoops settings in the kernel recipe's CMDLINE.
CONFIG_PSTORE=y
CONFIG_PSTORE_CONSOLE=y
CONFIG_PSTORE_RAM=y
