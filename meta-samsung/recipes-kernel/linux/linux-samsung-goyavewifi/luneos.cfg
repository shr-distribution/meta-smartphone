# LuneOS/Halium config delta - Samsung Galaxy Tab 3 Lite 7.0 / Tab E Lite Wi-Fi (SM-T113, goyavewifi,
# Spreadtrum SC7730S).
#
# Merged on top of lineage_goyavewifi_defconfig (this directory: arch/arm/configs/lineage_goyavewifi_defconfig
# of github.com/mertsan2007/android_kernel_samsung_sc8830, branch lineage-15.1, c32a0cc6d316), the config the
# LineageOS 15.1 build of the tablet boots. It is an Android config, so it lacks what a systemd userspace and the
# LXC container assume. The kernel it is applied to is the 3.10.103 tree of github.com/samsung-sc8830
# (branch hybris-14.1) with the patches in this directory; the 3.10.89 tree the config comes from is a different
# tree, so symbols the config names that this one lacks are dropped by kconfig without a word. Re-check the
# built .config rather than this file.
#
# First pass: merged and built, NOT booted.
#
# NOTE: do NOT write bare "# CONFIG_FOO=y" in comments in this file. kconfig reads such a line as a
# directive. Reference symbols without the CONFIG_ prefix in prose.

# ---------------------------------------------------------------------------
# Deliberately OFF (the same choices as the Galaxy A3 (2015) and the SM-T520, whose luneos.cfg explain them)
# ---------------------------------------------------------------------------
# No System V IPC and so no IPC namespace; LXC keeps the host's IPC and user namespaces.
# CONFIG_SYSVIPC is not set
# CONFIG_USER_NS is not set
# Real-time group scheduling: with it a task in a non-root cgroup gets no RT runtime, and the
# container's composer cannot make itself SCHED_FIFO.
# CONFIG_RT_GROUP_SCHED is not set
# Android's paranoid network check limits sockets to the AID_INET group, which the glibc userspace's
# services do not carry. This tablet has no modem, so nothing here is like the A3's rmt_storage, which
# needed group net_raw to pass the IPC router's bind check.
# CONFIG_ANDROID_PARANOID_NETWORK is not set

# ---------------------------------------------------------------------------
# What Halium needs and the defconfig lacks
# ---------------------------------------------------------------------------
CONFIG_NAMESPACES=y
CONFIG_UTS_NS=y
CONFIG_PID_NS=y
CONFIG_NET_NS=y
CONFIG_POSIX_MQUEUE=y

CONFIG_DEVTMPFS=y
CONFIG_DEVTMPFS_MOUNT=y
CONFIG_FHANDLE=y
CONFIG_VT=y

# systemd and Android's libprocessgroup
CONFIG_CGROUP_DEVICE=y
CONFIG_CPUSETS=y
CONFIG_BLK_CGROUP=y
CONFIG_AUTOFS4_FS=y
CONFIG_TMPFS_XATTR=y
CONFIG_TMPFS_POSIX_ACL=y
CONFIG_EXT4_FS_POSIX_ACL=y

# systemd's readahead collector; the Mer kernel checker warns about it.
CONFIG_FANOTIFY=y

# Hotplug events go to udev, not to /sbin/hotplug.
CONFIG_UEVENT_HELPER_PATH=""

# /proc/config.gz, to compare a running kernel against this file.
CONFIG_IKCONFIG=y
CONFIG_IKCONFIG_PROC=y

# What the A3 and SM-T520 fragments add for the container and the distribution: a private devpts, the
# lxcbr0 bridge and veth pairs, netd's uid match, AIO and the process event connector.
CONFIG_DEVPTS_MULTIPLE_INSTANCES=y
CONFIG_BRIDGE=y
CONFIG_VETH=y
CONFIG_NETFILTER_XT_MATCH_OWNER=y
CONFIG_AIO=y
CONFIG_PROC_EVENTS=y

# bluebinder feeds the Android BT HAL into a virtual HCI, so vhci is its kernel prerequisite; without it
# bluebinder exits with "No such device". It and connman also use /dev/rfkill.
CONFIG_BT_HCIVHCI=y
CONFIG_RFKILL=y

# ---------------------------------------------------------------------------
# Needed to link with this tree
# ---------------------------------------------------------------------------
# The Melfas and Zinitix touch drivers call _store_cpu_num_min_limit(), which sprd_hotplug.c provides, and
# sec_dt_init.c calls charger_status_cb(), which sx9500.c only defines with the TA-noise option. The
# lineage-15.1 tree defines both unconditionally; this one does not, so a kernel built from the plain
# config fails to link.
CONFIG_SPRD_CPU_DYNAMIC_HOTPLUG=y
CONFIG_SENSORS_SX9500_DEFENCE_CODE_FOR_TA_NOISE=y
